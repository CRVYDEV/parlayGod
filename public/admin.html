<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMERTÀ — the books</title>
<style>
  :root { --bg:#0b0b0e; --panel:#131318; --panel2:#17171e; --line:#26262f; --ink:#d6d2c4;
    --dim:#7d7a6f; --neon:#e8b34b; --blood:#c0392b; --ok:#5fa96b; --bad:#d16055; --cold:#5b84a8; font-size:15px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Georgia,'Times New Roman',serif; }
  code,input,button,.mono { font-family:'Courier New',monospace; }
  #top { display:flex; align-items:baseline; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line);
    background:var(--panel); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  #top h1 { font-size:19px; margin:0; letter-spacing:5px; color:var(--neon); font-weight:normal; }
  #top .sub { color:var(--dim); font-size:12px; }
  #status { margin-left:auto; font-size:13px; }
  button { background:#1d1d25; border:1px solid var(--line); color:var(--ink); padding:7px 12px;
    border-radius:4px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--neon); }
  button.danger { border-color:var(--blood); color:var(--bad); }
  input { background:#0e0e12; border:1px solid var(--line); color:var(--ink); padding:7px 8px; border-radius:4px; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; padding:12px 16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .panel h2 { margin:0 0 10px; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--dim); font-weight:normal; }
  .row { display:flex; justify-content:space-between; margin:3px 0; font-size:13px; gap:10px; }
  .row .k { color:var(--dim); } .row .v { color:var(--ink); text-align:right; }
  .big { font-size:26px; color:var(--neon); margin:2px 0 8px; }
  .banner { padding:12px 16px; margin:0; text-align:center; font-size:15px; letter-spacing:2px; }
  .banner.ok { background:rgba(95,169,107,.14); color:var(--ok); border-bottom:1px solid var(--ok); }
  .banner.bad { background:rgba(192,57,43,.18); color:var(--bad); border-bottom:1px solid var(--blood); }
  .chk { display:flex; justify-content:space-between; font-size:12px; padding:2px 0; border-bottom:1px solid #1c1c22; }
  .chk .g { color:var(--ok); } .chk .b { color:var(--bad); }
  .feed { max-height:340px; overflow-y:auto; font-size:11px; }
  .feed .e { padding:3px 0; border-bottom:1px solid #1a1a20; color:var(--dim); }
  .feed .e b { color:var(--ink); }
  .bar { height:6px; background:#22222a; border-radius:3px; overflow:hidden; margin:1px 0 6px; }
  .bar i { display:block; height:100%; background:var(--neon); }
  .mod-row { display:flex; gap:6px; margin:6px 0; flex-wrap:wrap; align-items:center; }
  .mod-row input { flex:1; min-width:80px; }
  .center { max-width:420px; margin:16vh auto; text-align:center; }
  .center h1 { letter-spacing:8px; color:var(--neon); font-weight:normal; }
  .center p { color:var(--dim); font-size:13px; }
  .hidden { display:none !important; }
  #err { color:var(--bad); font-size:12px; margin-top:6px; }
  .note { color:var(--dim); font-size:11px; margin-top:4px; }
</style>
</head>
<body>

<div id="login" class="center">
  <h1>THE BOOKS</h1>
  <p>OMERTÀ live-ops. This is the mod console — the whole city, one screen.</p>
  <div style="margin-top:14px"><input id="mkey" type="password" placeholder="mod key" size="26" style="font-size:14px">
    <button id="enter" style="font-size:14px;padding:8px 18px">OPEN THE LEDGER</button></div>
  <div id="err"></div>
</div>

<div id="dash" class="hidden">
  <div id="bkbanner" class="banner hidden">…</div>
  <div id="banner" class="banner">…</div>
  <div id="top">
    <h1>THE BOOKS</h1><span class="sub" id="stamp">—</span>
    <span id="status"></span>
    <button id="refresh">refresh</button>
    <button id="logout" class="danger">lock up</button>
  </div>
  <div class="grid">
    <div class="panel" id="p-backups"><h2>Backups</h2><div class="body">…</div></div>
    <div class="panel" id="p-social"><h2>Growth loop</h2><div class="body">…</div></div>
    <div class="panel" id="p-integrity"><h2>§10.4 Integrity</h2><div class="body">…</div></div>
    <div class="panel" id="p-economy"><h2>The Economy</h2><div class="body">…</div></div>
    <div class="panel" id="p-players"><h2>Players</h2><div class="body">…</div></div>
    <div class="panel" id="p-funnel"><h2>Onboarding Funnel</h2><div class="body">…</div></div>
    <div class="panel" id="p-engage"><h2>Engagement &amp; Retention</h2><div class="body">…</div></div>
    <div class="panel" id="p-top"><h2>The Powerful</h2><div class="body">…</div></div>
    <div class="panel" id="p-chain"><h2>Chain · Reserve · Vig</h2><div class="body">…</div></div>
    <div class="panel" id="p-activity"><h2>Live Activity</h2><div class="feed body">…</div></div>
    <div class="panel" id="p-mod"><h2>Moderation</h2><div class="body"></div></div>
  </div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const fmt = (n) => Number(n || 0).toLocaleString('en-US');
  // (red-team R7 HIGH) escape player-controlled strings before innerHTML — the activity feed is a
  // generic telemetry passthrough and the top-players list carries player names; the mod key lives in
  // sessionStorage here, so an unescaped payload is a mod-side stored XSS → root escalation.
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let mkey = sessionStorage.getItem('omerta_mod_key') || '';
  let timer = null;

  async function j(method, path, body) {
    const r = await fetch(path, { method, headers: { 'x-mod-key': mkey,
      ...(body !== undefined ? { 'content-type': 'application/json' } : {}) },
      body: body === undefined ? undefined : JSON.stringify(body) });
    let b = null; try { b = await r.json(); } catch { b = {}; }
    return { code: r.status, body: b };
  }

  $('#enter').onclick = tryLogin;
  $('#mkey').onkeydown = (e) => { if (e.key === 'Enter') tryLogin(); };
  async function tryLogin() {
    mkey = $('#mkey').value.trim();
    const r = await j('GET', '/v1/mod/overview');
    if (r.code === 200) { sessionStorage.setItem('omerta_mod_key', mkey); showDash(); }
    else { $('#err').textContent = r.code === 401 ? 'Wrong key.' : `Error ${r.code}.`; }
  }
  $('#logout').onclick = () => { sessionStorage.removeItem('omerta_mod_key'); location.reload(); };
  $('#refresh').onclick = refreshAll;

  function showDash() {
    $('#login').classList.add('hidden'); $('#dash').classList.remove('hidden');
    refreshAll();
    if (timer) clearInterval(timer);
    timer = setInterval(refreshAll, 15000); // live
  }

  async function refreshAll() {
    const [ov, inv, fn, res, vig, em, act, rev, eng] = await Promise.all([
      j('GET', '/v1/mod/overview'), j('GET', '/v1/mod/invariants'), j('GET', '/v1/mod/funnel'),
      j('GET', '/v1/mod/reserve'), j('GET', '/v1/mod/vig'), j('GET', '/v1/mod/emission'),
      j('GET', '/v1/mod/activity?limit=60'), j('GET', '/v1/mod/revenue'),
      j('GET', '/v1/mod/engagement'),
    ]);
    if (ov.code === 401) return $('#logout').onclick();
    $('#stamp').textContent = 'as of ' + new Date().toLocaleTimeString();
    renderIntegrity(inv.body); renderEconomy(ov.body, em.body); renderPlayers(ov.body); renderEngagement(eng.body);
    renderFunnel(fn.body); renderTop(ov.body); renderChain(res.body, vig.body, em.body, rev.body);
    renderBackups(ov.body); renderSocial(ov.body);
    renderActivity(act.body); renderMod();
  }

  const rowHtml = (k, v) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;

  // BACKUPS — the health nobody can see from inside the game. Postgres ships write-ahead-log
  // segments to the backup service; if that stops, the database keeps working perfectly while the
  // ability to RESTORE it quietly rots. That happened twice on 2026-07-25 and the only evidence was
  // in the host's log stream. It gets its own banner because by the time you need a backup, it is
  // far too late to discover you did not have one.
  // THE GROWTH LOOP — the backups panel's twin. A server can run SOCIAL_VERIFY_MODE=live with no
  // provider token, and then the word-of-mouth cash faucet pays nobody while everything looks normal:
  // no boot error, nothing in the game, nothing here. That is how it shipped. Now it is one line.
  function renderSocial(ov) {
    const s = ov?.social || {};
    const el = $('#p-social').querySelector('.body');
    const yes = (b) => `<span style="color:var(--${b ? 'ok' : 'bad'})">${b ? 'yes' : 'no'}</span>`;
    const live = !!s.rewardsLive;
    el.innerHTML =
      `<div class="big" style="color:var(--${live ? 'ok' : 'bad'})">${live ? 'PAYING' : 'NOT PAYING'}</div>`
      + rowHtml('verify mode', s.mode || 'off')
      + rowHtml('post checks (Spread the Word)', yes(s.posts))
      + rowHtml('follow check (First Week · X)', yes(s.x))
      + (live
        ? '<div class="note">Word-of-mouth rewards are being paid. A check a provider can\'t perform means '
          + 'that task is dropped from the First-Week checklist rather than shown and refused.</div>'
        : `<div class="note">The Spread-the-Word cash faucet is <b>inert</b> — players can share, but nobody
           gets paid.${s.mode === 'live' ? ' Mode is <code>live</code> but <code>X_BEARER_TOKEN</code> is not set: '
          + 'add it (plus <code>X_TARGET_USER_ID</code> for the follow check) to switch the loop on.'
          : ' Set <code>SOCIAL_VERIFY_MODE=live</code> plus the X tokens to switch it on.'}</div>`);
  }

  function renderBackups(ov) {
    const b = ov?.backups || {};
    const wh = !!ov?.alerting?.webhook;
    const el = $('#p-backups').querySelector('.body');
    // CAN THE ALARM REACH YOU? Both alarms — this one and the §10.4 sweep — shout down the same webhook.
    // Unset, they shout into a log file, which is exactly the situation the backup incident exposed.
    // Built here rather than inline because the archiver-unsupported branch below returns EARLY, and
    // whether your alerts work has nothing to do with whether this database exposes archiver stats —
    // put it only after that return and it vanishes on precisely the setups least able to spare it.
    const alertRow = rowHtml('alerts reach you', wh
      ? '<span style="color:var(--ok)">yes — webhook set</span>'
      : '<span style="color:var(--bad)">NO — log only</span>')
      + (wh ? '' : '<div class="note">Set <code>INVARIANT_WEBHOOK_URL</code> (a Slack or Discord webhook) so a '
        + 'failing backup or a drifting ledger reaches your phone instead of a log nobody reads. '
        + 'Then use <b>send test alert</b> under Mod Tools to prove it arrives.</div>');
    const bn = $('#bkbanner');
    if (!b.state || b.state === 'unsupported') {
      bn.className = 'banner hidden';
      el.innerHTML = '<div class="note">This database does not expose archiver stats (pg-mem in dev, or a '
        + 'restricted role). Nothing to report — not a problem, just not visible from here.</div>' + alertRow;
      return;
    }
    const ago = (s) => s == null ? 'never' : (s < 90 ? s + 's ago' : s < 5400 ? Math.round(s / 60) + 'm ago' : Math.round(s / 3600) + 'h ago');
    if (b.state === 'failing') {
      bn.className = 'banner bad';
      bn.textContent = '\u26a0 BACKUPS ARE FAILING — the game is fine, but RESTORING it may not be. Take a manual dump.';
    } else if (b.state === 'off') {
      bn.className = 'banner bad';
      bn.textContent = '\u26a0 BACKUPS ARE SWITCHED OFF — there is no recovery chain at all. Take a manual dump.';
    } else {
      bn.className = 'banner hidden';
    }
    const good = b.state === 'ok';
    el.innerHTML =
      `<div class="big" style="color:var(--${good ? 'ok' : 'bad'})">${
        good ? 'HEALTHY' : b.state === 'stale' ? 'QUIET' : b.state === 'off' ? 'NOT RUNNING' : 'FAILING'}</div>`
      + rowHtml('last shipped', `${b.lastArchivedWal || 'never'} <span class="note">(${ago(b.secondsSinceArchived)})</span>`)
      + rowHtml('shipped total', fmt(b.archivedCount))
      + rowHtml('last failure', b.lastFailedWal ? `${b.lastFailedWal} <span class="note">(${ago(b.secondsSinceFailed)})</span>` : 'none')
      + rowHtml('failures total', fmt(b.failedCount))
      + `<div class="note">${good
        ? 'Write-ahead logs are shipping. Point-in-time recovery is being maintained.'
        : b.state === 'stale'
          ? 'No failures, but nothing has shipped in a while. Normal on a quiet database (no writes, no logs to ship).'
          : b.state === 'off'
            ? 'archive_mode is off — this database has no point-in-time recovery at all. Zero failures here means nothing is even being attempted. Run tools/backup.sh, and check with your database host.'
            : 'The last thing that happened was a FAILURE. Run tools/backup.sh for an independent dump, and raise it with your database host.'}</div>`
      + (b.failedCount > 0 && good
        ? '<div class="note">Past failures are recorded here forever — what matters is that the most recent event was a success.</div>' : '')
      + alertRow;
  }

  function renderIntegrity(inv) {
    const checks = inv?.checks || [];
    const ok = !!inv?.ok;
    $('#banner').className = 'banner ' + (ok ? 'ok' : 'bad');
    $('#banner').textContent = ok ? '§10.4 HOLDS — the books balance' : '⚠ LEDGER DRIFT DETECTED — investigate now';
    $('#p-integrity').querySelector('.body').innerHTML = checks.map((c) =>
      `<div class="chk"><span>${c.name}</span><span class="${c.ok ? 'g' : 'b'}">${c.ok ? '✓' : 'drift ' + fmt(c.drift)}</span></div>`).join('')
      + (checks.find((c) => c.name === 'reason vocabulary' && (c.unknown || []).length)
        ? `<div class="note" style="color:var(--bad)">unknown reasons: ${(checks.find((c) => c.name === 'reason vocabulary').unknown).join(', ')}</div>` : '');
  }

  function renderEconomy(ov, em) {
    const e = ov?.economy || {};
    $('#p-economy').querySelector('.body').innerHTML =
      `<div class="big">$${fmt(e.ammPrice)} <span class="note">per $OMR (AMM spot)</span></div>`
      + rowHtml('$OMR supply', `${fmt(e.omrSupply)} (${fmt(e.omrStaked)} staked)`)
      + rowHtml('AMM pool', `$${fmt(e.ammCash)} / ${fmt(e.ammOmr)} $OMR`)
      + rowHtml('street-tax pool', `$${fmt(e.taxPool)} <span class="note">→ next buyback</span>`)
      + rowHtml('event fund', `${fmt(e.eventFund)} $OMR`)
      + rowHtml('stake pool', `${fmt(e.stakePool)} $OMR (${Math.round((em?.backed ?? 1) * 100)}% backed)`)
      + rowHtml('the den book', `profit $${fmt(e.den.profit)} · paid $${fmt(e.den.distributed)}`)
      + rowHtml('gang treasuries', `$${fmt(e.gangTreasury)} across ${fmt(e.gangCount)}`)
      + rowHtml('player wealth', `$${fmt(e.charWealth)} (cash+bank)`);
  }

  function renderPlayers(ov) {
    const p = ov?.players || {};
    $('#p-players').querySelector('.body').innerHTML =
      `<div class="big">${fmt(p.active24h)} <span class="note">active (24h)</span></div>`
      + rowHtml('accounts', `${fmt(p.accounts)}${p.banned ? ` · ${fmt(p.banned)} banned` : ''}${p.agents ? ` · ${fmt(p.agents)} agents` : ''}`)
      + rowHtml('living streets', fmt(p.alive))
      + rowHtml('in the ground', fmt(p.dead))
      + rowHtml('in lockup', fmt(p.jailed))
      + rowHtml('under indictment', fmt(p.indicted));
  }

  function renderFunnel(fn) {
    if (!fn) return;
    const lv = fn.levels || {}, pr = fn.progression || {}, fw = fn.firstWeek || {};
    const alive = Math.max(1, (fn.characters || {}).alive || 1);
    const barRow = (k, n) => { const pct = Math.round(100 * n / alive);
      return `<div class="row"><span class="k">${k}</span><span class="v">${fmt(n)} (${pct}%)</span></div><div class="bar"><i style="width:${pct}%"></i></div>`; };
  // ENGAGEMENT — which systems anyone actually uses, and whether players come back. The DEAD list is
  // the point: with 35 systems, knowing which have never been opened by a human is what decides what
  // to build next. Untracked systems are shown separately so an instrumentation gap is never read as
  // a player verdict.
  function renderEngagement(e) {
    if (!e || !e.systems) { $('#p-engage').querySelector('.body').innerHTML = '<div class="note">no data</div>'; return; }
    const p = e.players, r = e.retention;
    const pct = (c) => (c.rate === null ? `<span style="color:var(--dim)">pending (${fmt(c.pending)} too new)</span>` : `${c.rate}%`);
    const live = e.systems.filter((s) => s.accounts > 0);
    const top = live.slice(0, 12).map((s) =>
      `<div class="row"><span class="k">${s.system}</span><span class="v">${fmt(s.accounts)} player(s) · ${fmt(s.events)} events</span></div>`).join('');
    const deadList = e.dead.length
      ? `<div class="note" style="margin-top:10px;color:var(--bad)">NEVER TOUCHED BY A PLAYER (${e.dead.length}/${e.systems.length}): ${e.dead.join(' · ')}</div>`
      : '<div class="note" style="margin-top:10px;color:var(--good)">every tracked system has been used by at least one player</div>';
    const untracked = e.untracked.length
      ? `<div class="note" style="color:var(--dim)">untracked (no telemetry declared, so no verdict): ${e.untracked.join(' · ')}</div>` : '';
    const uncat = e.uncatalogued.length
      ? `<div class="note" style="color:var(--bad)">${e.uncatalogued.length} event type(s) no system claims — the catalog in src/engagement.js is behind the code</div>` : '';
    $('#p-engage').querySelector('.body').innerHTML =
      `<div class="row"><span class="k">humans / agents</span><span class="v">${fmt(p.humans)} / ${fmt(p.agents)}</span></div>`
      + `<div class="row"><span class="k">active in ${e.window}d</span><span class="v">${fmt(p.activeInWindow)} <span style="color:var(--dim)">(${fmt(p.neverActive)} never played)</span></span></div>`
      + `<div class="row"><span class="k">D1 return</span><span class="v">${pct(r.d1)}</span></div>`
      + `<div class="row"><span class="k">D7 return</span><span class="v">${pct(r.d7)}</span></div>`
      + `<div class="row"><span class="k">median active days</span><span class="v">${fmt(r.medianActiveDays)}</span></div>`
      + `<div class="note" style="margin-top:10px">MOST-USED SYSTEMS (${live.length} of ${e.systems.length} used at all)</div>` + top
      + deadList + untracked + uncat;
  }

    $('#p-funnel').querySelector('.body').innerHTML =
      `<div class="note">of ${fmt((fn.characters || {}).alive)} living streets</div>`
      + barRow('pulled a job', pr.pulled_a_job || 0)
      + barRow('declared a Path', pr.declared_path || 0)
      + barRow('in a family', pr.in_a_family || 0)
      + barRow('linked a wallet', pr.linked_wallet || 0)
      + `<div class="note" style="margin-top:6px">levels — 1–4: ${fmt(lv.lvl_1_4)} · 5–9: ${fmt(lv.lvl_5_9)} · 10–19: ${fmt(lv.lvl_10_19)} · 20+: ${fmt(lv.lvl_20_plus)}</div>`
      + `<div class="note">first-week capstones: ${fmt(fw.capstone)}</div>`
      + renderBroadcast(fn.broadcast)
      + renderReferral(fn.referral);
  }
  function renderBroadcast(bc) {
    if (!bc) return '';
    const kinds = Object.entries(bc.byKind || {}).map(([k, n]) => `${k} ${fmt(n)}`).join(' · ') || '—';
    return `<div class="note" style="margin-top:8px;color:var(--neon)">THE BROADCAST — ${fmt(bc.shares)} share intents from ${fmt(bc.sharers)} players <span style="color:var(--dim)">(the top of the organic funnel)</span></div>`
      + `<div class="row"><span class="k">by kind</span><span class="v">${kinds}</span></div>`
      + `<div class="row"><span class="k">referred / share</span><span class="v">${bc.referredPerShare} <span style="color:var(--dim)">signups per share</span></span></div>`;
  }
  function renderReferral(rf) {
    if (!rf) return '';
    const acc = Math.max(1, rf.accounts || 1);
    const pct = (n) => Math.round(100 * n / acc);
    return `<div class="note" style="margin-top:8px;color:var(--neon)">REFERRAL FUNNEL — K-factor ${rf.kFactor} <span style="color:var(--dim)">(qualified recruits / account; &gt;1 compounds)</span></div>`
      + `<div class="row"><span class="k">came in on a code</span><span class="v">${fmt(rf.referred)} (${pct(rf.referred)}%)</span></div>`
      + `<div class="row"><span class="k">sparked (early payout)</span><span class="v">${fmt(rf.sparked)}</span></div>`
      + `<div class="row"><span class="k">qualified (full)</span><span class="v">${fmt(rf.qualified)} · spark→qual ${rf.sparkToQualified}</span></div>`
      + `<div class="row"><span class="k">recruiters</span><span class="v">${fmt(rf.recruiters)} · ${fmt(rf.totalRecruits)} recruits</span></div>`
      + `<div class="row"><span class="k">re-referred (viral depth)</span><span class="v">${fmt(rf.reReferred)}</span></div>`;
  }

  function renderTop(ov) {
    const t = ov?.top || {};
    $('#p-top').querySelector('.body').innerHTML =
      `<div class="note">top streets by respect</div>`
      + (t.players || []).slice(0, 6).map((p, i) => rowHtml(`${i + 1}. ${esc(p.name)}`, `${fmt(p.respect)} rsp · $${fmt(p.netWorth)}`)).join('')
      + `<div class="note" style="margin-top:8px">top families by treasury</div>`
      + (t.gangs || []).slice(0, 6).map((g, i) => rowHtml(`${i + 1}. ${esc(g.name)} [${esc(g.tag)}]`, `$${fmt(g.treasury)}${g.warsWon ? ` · ${g.warsWon}W` : ''}`)).join('');
  }

  function renderChain(res, vig, em, rev) {
    const v = vig?.invariants || {}, vs = vig?.status || {};
    const extractOk = v.ok !== false;
    $('#p-chain').querySelector('.body').innerHTML =
      `<div class="note">withdrawal reserve (full-reserve queue)</div>`
      + rowHtml('funded', `${fmt(res?.fundedOmr)} $OMR`)
      + rowHtml('committed / available', `${fmt(res?.committedOutstanding)} / ${fmt(res?.available)}`)
      + rowHtml('queued (unsigned)', `${fmt(res?.queuedOmr)} $OMR`)
      + `<div class="note" style="margin-top:8px">the Vig (real-revenue redistribution)</div>`
      + rowHtml('extraction ≤ inflow', `<span class="${extractOk ? '' : ''}" style="color:${extractOk ? 'var(--ok)' : 'var(--bad)'}">${extractOk ? '✓ holds' : '⚠ VIOLATED'}</span>`)
      + rowHtml('prize pool', `${fmt(vs.prizePool ?? vs.prize_pool ?? '?')} $OMR`)
      + `<div class="note" style="margin-top:8px">staking emission</div>`
      + rowHtml('pool / backed', `${fmt(em?.poolBalance)} $OMR · ${Math.round((em?.backed ?? 1) * 100)}%`)
      + (rev ? `<div class="note" style="margin-top:8px">the Store (ETH revenue, split ${rev.split.founder / 100}/${rev.split.buyback / 100}/${rev.split.rwa / 100})</div>`
        + rowHtml('gross ETH', `Ξ${fmt(rev.grossEth)}`)
        + rowHtml('founder / buyback / rwa', `Ξ${fmt(rev.founderEth)} · Ξ${fmt(rev.buybackEth)} · Ξ${fmt(rev.rwaEth)}`)
        + rowHtml('rwa reserve', `Ξ${fmt(rev.rwaEth)} <span class="note">${rev.rwaDormant ? 'dormant (R2)' : '⚠ spent'}</span>`)
        + (rev.pendingLinks ? rowHtml('pending links', `${rev.pendingLinks} unclaimed purchase(s)`) : '') : '');
  }

  function renderActivity(act) {
    const evs = act?.events || [];
    $('#p-activity').querySelector('.body').innerHTML = evs.map((e) => {
      const t = e.at ? new Date(e.at).toLocaleTimeString() : '';
      const p = e.props || {}; const bits = Object.entries(p).slice(0, 3).map(([k, val]) =>
        `${esc(k)}=${esc(typeof val === 'object' ? JSON.stringify(val) : val)}`).join(' ');
      return `<div class="e"><b>${esc(e.event)}</b> <span style="float:right">${t}</span><br>${bits}</div>`;
    }).join('') || '<div class="note">quiet on the wire…</div>';
  }

  function renderMod() {
    if ($('#p-mod').querySelector('.body').dataset.wired) return; // forms are static — wire once
    $('#p-mod').querySelector('.body').dataset.wired = '1';
    $('#p-mod').querySelector('.body').innerHTML = `
      <div class="mod-row"><input id="m-invcount" placeholder="# codes" size="4" value="5"><input id="m-invuses" placeholder="uses" size="4" value="1">
        <button id="m-invite">mint invites</button></div>
      <div id="m-invout" class="note"></div>
      <div class="mod-row"><input id="m-conf-id" placeholder="character id"><input id="m-conf-amt" placeholder="$ (blank=all)" size="8">
        <button id="m-conf" class="danger">confiscate</button></div>
      <div class="mod-row"><input id="m-kill-id" placeholder="character id"><button id="m-kill" class="danger">mod-kill</button></div>
      <div class="mod-row"><input id="m-ban-id" placeholder="account id"><button id="m-ban" class="danger">ban</button></div>
      <div class="mod-row"><input id="m-fund" placeholder="$OMR to reserve" size="10"><button id="m-fund-go">fund reserve</button></div>
      <div class="mod-row"><input id="m-push-h" placeholder="hours" size="5" value="48"><input id="m-push-m" placeholder="mult" size="5" value="2"><button id="m-push-go">start recruit drive</button></div>
      <div class="mod-row"><button id="m-alert-go">send test alert</button>
        <span class="note">proves INVARIANT_WEBHOOK_URL works — before you need it</span></div>
      <div id="m-out" class="note"></div>`;
    const out = (m, bad) => { const el = $('#m-out'); el.textContent = m; el.style.color = bad ? 'var(--bad)' : 'var(--dim)'; };
    $('#m-invite').onclick = async () => {
      const r = await j('POST', '/v1/mod/invites', { count: Number($('#m-invcount').value), uses: Number($('#m-invuses').value) });
      $('#m-invout').textContent = r.code === 200 ? `codes: ${(r.body.codes || []).join(', ')}` : `error ${r.code}`;
    };
    $('#m-conf').onclick = async () => {
      const id = $('#m-conf-id').value.trim(); if (!id) return out('character id?', true);
      if (!confirm(`Confiscate from ${id}?`)) return;
      const amt = $('#m-conf-amt').value.trim();
      const r = await j('POST', '/v1/mod/confiscate', { characterId: id, ...(amt ? { amount: Number(amt) } : {}) });
      out(r.code === 200 ? `confiscated $${fmt(r.body.confiscated)}` : `error: ${r.body.message || r.code}`, r.code !== 200); refreshAll();
    };
    $('#m-kill').onclick = async () => {
      const id = $('#m-kill-id').value.trim(); if (!id) return out('character id?', true);
      if (!confirm(`MOD-KILL ${id}? This runs the estate — irreversible.`)) return;
      const r = await j('POST', '/v1/mod/kill', { characterId: id });
      out(r.code === 200 ? `retired — heir ${r.body.heirId}` : `error: ${r.body.message || r.code}`, r.code !== 200); refreshAll();
    };
    $('#m-ban').onclick = async () => {
      const id = $('#m-ban-id').value.trim(); if (!id) return out('account id?', true);
      if (!confirm(`Ban account ${id}?`)) return;
      const r = await j('POST', '/v1/mod/ban', { accountId: id });
      out(r.code === 200 ? 'banned.' : `error: ${r.body.message || r.code}`, r.code !== 200);
    };
    $('#m-fund-go').onclick = async () => {
      const amt = Number($('#m-fund').value); if (!(amt > 0)) return out('amount?', true);
      const r = await j('POST', '/v1/mod/reserve/fund', { amount: amt });
      out(r.code === 200 ? 'reserve funded (queue drained).' : `error: ${r.body.message || r.code}`, r.code !== 200); refreshAll();
    };
    $('#m-push-go').onclick = async () => {
      const hours = Number($('#m-push-h').value), mult = Number($('#m-push-m').value);
      if (!(hours > 0) || !(mult >= 1)) return out('hours & mult (≥1)?', true);
      if (!confirm(`Start a ${mult}× recruitment drive for ${hours}h? Referral CASH payouts multiply.`)) return;
      const r = await j('POST', '/v1/mod/referral/push', { hours, mult });
      out(r.code === 200 ? `drive live: ${r.body.mult}× for ${r.body.hours}h` : `error: ${r.body.message || r.code}`, r.code !== 200);
    };
    // No confirm() on this one — it is the only harmless button on the panel (it moves nothing and
    // touches no player), and a drill you have to click twice is a drill you skip.
    $('#m-alert-go').onclick = async () => {
      out('sending…');
      const r = await j('POST', '/v1/mod/alert/test');
      out(r.code === 200 ? r.body.message : `error: ${r.body.message || r.code}`, r.code !== 200 || !r.body.configured);
    };
  }

  // auto-open if a key is already stored this session
  if (mkey) { $('#mkey').value = mkey; tryLogin(); }
</script>
</body>
</html>
