<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMERTÀ — the codex</title>
<style>
  :root {
    --bg: #0b0b0e; --panel: #131318; --panel2: #17171e; --line: #26262f;
    --ink: #d6d2c4; --dim: #7d7a6f; --neon: #e8b34b; --blood: #c0392b;
    --ok: #5fa96b; --bad: #d16055; --cold: #5b84a8; font-size: 15px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
  code, .mono, input { font-family: 'Courier New', monospace; }
  a { color: var(--neon); text-decoration: none; } a:hover { text-decoration: underline; }

  #top { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  #top h1 { font-size: 21px; margin: 0; letter-spacing: 6px; color: var(--neon); font-weight: normal; }
  #top .sub { color: var(--dim); font-size: 12px; }
  #top .home { margin-left: auto; }

  #wrap { display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: calc(100vh - 48px); }
  #nav { border-right: 1px solid var(--line); background: var(--panel); padding: 14px 0; position: sticky; top: 48px;
    height: calc(100vh - 48px); overflow-y: auto; }
  #nav .search { padding: 0 14px 10px; }
  #nav input { width: 100%; background: #0f0f13; border: 1px solid var(--line); color: var(--ink); padding: 8px 10px; border-radius: 4px; font-size: 13px; }
  #nav .grp { color: var(--dim); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 16px 4px; }
  #nav a.item { display: block; padding: 5px 16px 5px 20px; color: var(--ink); font-size: 13px; border-left: 2px solid transparent; }
  #nav a.item:hover { background: var(--panel2); text-decoration: none; }
  #nav a.item.on { color: var(--neon); border-left-color: var(--neon); background: rgba(232,179,75,.06); }
  #nav a.item.hide { display: none; }

  #doc { padding: 26px 34px 80px; max-width: 900px; }
  #doc section { scroll-margin-top: 60px; margin-bottom: 34px; border-bottom: 1px dashed var(--line); padding-bottom: 26px; }
  #doc h2 { color: var(--neon); font-weight: normal; letter-spacing: 2px; font-size: 24px; margin: 0 0 4px; }
  #doc .tag { color: var(--dim); font-size: 12px; font-style: italic; margin: 0 0 14px; }
  #doc h3 { color: var(--ink); font-size: 15px; letter-spacing: 1px; text-transform: uppercase; margin: 18px 0 6px; border-left: 3px solid var(--neon); padding-left: 8px; }
  #doc p, #doc li { line-height: 1.6; font-size: 14px; color: var(--ink); }
  #doc .dim { color: var(--dim); }
  #doc ul { margin: 6px 0; padding-left: 22px; }
  #doc code { background: #0f0f13; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; font-size: 12px; color: var(--neon); }
  #doc .loop { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--neon); border-radius: 4px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
  #doc .loop b { color: var(--neon); }
  #doc table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  #doc th { color: var(--dim); font-weight: normal; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
  #doc .warn { color: var(--bad); }
  #doc .routes { color: var(--dim); font-size: 12px; font-family: 'Courier New', monospace; }
  #doc .lead { font-size: 15px; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; background: var(--panel); }

  @media (max-width: 820px) {
    #wrap { grid-template-columns: 1fr; }
    #nav { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); max-height: 40vh; }
    #doc { padding: 18px 16px 60px; }
  }
</style>
</head>
<body>
<div id="top">
  <h1>OMERTÀ</h1><span class="sub">the codex · the knowledge base for the game</span>
  <a class="home" href="/">← back to the city</a>
</div>
<div id="wrap">
  <div id="nav">
    <div class="search"><input id="q" placeholder="search the codex…" autocomplete="off"></div>
    <div id="navlist"></div>
  </div>
  <div id="doc"></div>
</div>

<script>
// ── The codex content. Each section: { id, group, title, tag, html }. Rendered into #doc + #nav. ──
// GROUPS order the sidebar. Content authored from the verified feature inventory.
const R = (s) => `<div class="routes">${s}</div>`;          // route line
const L = (s) => `<div class="loop">${s}</div>`;            // loop / callout
const SECTIONS = [
  { id: 'welcome', group: 'Start', title: 'Welcome to the City', tag: 'what this is',
    html: `<p class="lead">OMERTÀ is a deep multiplayer crime game. You start as a new player in the Docks with $500. You
      try to become a powerful and feared boss. Another player can also kill your character. This codex describes every
      system and every loop.</p>
      <p>Use the search box to find a topic. The numbers here are the current settings and can change. "Level N" is your
      character level. The level comes from respect: <code>level = floor(sqrt(respect/4)) + 1</code> — L5 ≈ 64 respect,
      L10 ≈ 324, L20 ≈ 1444, L30 ≈ 3364.</p>` },

  { id: 'coreloop', group: 'Start', title: 'The Core Loop', tag: 'how you earn and grow',
    html: `${L(`Do <b>jobs</b> for cash → <b>train</b> your stats → put your cash in the <b>bank</b> → set up <b>income
      sources</b> that pay you while you are away → increase your <b>level</b>.`)}
      <p><b>Crimes</b> — 29 jobs, from Pickpocket (L1) to Empty the Federal Depository (L110). Each job has a level
      requirement, a nerve cost, a cash range, and a chance of jail if you fail. Your success rate increases with cunning
      and speed, your family level, some districts, and your rank. Jobs can give <b>crates</b> (buy guns and make gear) and
      <b>makings</b> (Kitchen ingredients).</p>
      <p><b>Energy and nerve</b> power your actions and increase again with time. <b>Heat</b> is the police attention that
      crime causes. Too much heat starts a police case. <b>Train</b> costs 10 energy (the increase becomes smaller as a
      stat becomes higher). <b>Heal</b> returns you to full health. <b>Check in</b> one time each day for a streak bonus
      and energy.</p>
      <p><b>The Bank:</b> another player can steal the cash in your pocket when you die. Bank cash is safe. But a new
      deposit is <b>"in transit" for 2 hours</b> (another player can steal it until it clears). You cannot use the bank
      from a safehouse.</p>
      ${R(`POST /v1/crimes/:id · /train/:stat · /heal · /checkin · /bank/deposit|withdraw · /travel/:district`)}` },

  { id: 'character', group: 'The Basics', title: 'Your Character, Death & the Heir', tag: 'respect, rank, the estate',
    html: `<p>Each account has one living character. You start at L1, with 50 energy, 10 nerve, 100 health, $500, and all
      stats at 5. <b>Respect</b> is your experience. It sets your <b>level</b> and your <b>rank</b> (benefits at L10
      Hustler, L35 Enforcer, L65 Soldier "made man", L95 Underboss, L125 Don). <b>Effective stats</b> = trained + gear +
      assets. <b>Firepower (fp)</b> comes from your gun — you need 50 fp or more to make a lethal hit.</p>
      ${L(`<b>Death:</b> the character dies, but the account does not die. An heir is born and inherits everything at the
      account level.`)}
      <p><b>Lost when the character dies:</b> stats, skills, businesses, the speakeasy, the Kitchen crew, the boxing
      fighter, territory operation control, and this season's kills. <b>Passes to the heir:</b> prestige, the legal
      Portfolio/Dynasty book, the Estate, the Store patron/pass benefit, the dynasty name, hitman reputation and lifetime
      kills, minted status, revive tokens, and 25% of your Underworld standings.</p>
      <p><b>Seasons</b> last 28 days. At the end, your level converts to prestige (<code>floor(level/2)</code>) and your
      respect returns to 0. <b>Respec</b> your stats for 15 $OMR (24-hour cooldown).</p>
      ${R(`POST /v1/character · GET /v1/me · /v1/session · POST /v1/respec`)}` },

  { id: 'cars', group: 'The Basics', title: 'Cars, Guns & Gear', tag: 'the garage and the armory',
    html: `<p><b>Cars and the Garage</b> (limit 12). 60 models, each with trims. <b>Boost</b> steals a random car (5-minute
      cooldown). <b>Melt</b> scraps a car for ammo (25% goes to your family). <b>Fence</b> and <b>repair</b> sell or fix a
      car. A car that is listed or pledged refuses melt, fence, and repair.</p>
      <p><b>Guns and the Armory.</b> 15 guns (Rusty .25 fp3 to the 'Undertaker' fp60), bought with cash and crates.
      <b>Vests</b> (bought with $OMR) increase survival. <b>Ammo</b> costs $2000 for 50 rounds. Its price is <b>never
      reduced</b> — it controls the cost of a kill.</p>
      <p><b>Gear</b> (about 55 items, priced in $OMR) increases stats. Gear is a tradeable NFT on the blockchain. A
      fire-kill has a <b>15% chance to take one in-game gear piece</b> — but <b>gear minted on the blockchain is safe</b>.
      Keep gear in the game to use it (you can lose it), or move it to the blockchain (it is safe and tradeable, but you
      cannot use it in the game).</p>
      ${R(`POST /v1/garage/boost · /garage/:carId/melt|fence|repair · /armory/gun/:id/buy|equip · /armory/ammo · /workshop/craft/:id`)}` },

  { id: 'city', group: 'The Basics', title: 'The City & the Living World', tag: 'events, weather, districts, NPC families',
    html: `<p>The city has a <b>daily background that is the same for all players</b> and can be known in advance. <b>City
      events</b> (16, one each day) change every loop (HEAT WAVE, DOCK STRIKE, THE CRACKDOWN, BUREAU SWEEP, OPEN CITY, and
      more). <code>GET /v1/city</code> shows the current day and a 7-day forecast. <b>Regional weather</b> changes
      trade-good prices. A <b>day and night clock</b> increases convictions during patrol hours (UTC 13–22) and makes night
      raids easier.</p>
      <table><tr><th>District</th><th>Benefit</th></tr>
      <tr><td>Docks</td><td>+50% contraband · laundering district · start here</td></tr>
      <tr><td>Neon Mile</td><td>+15% racket/front income · the vice district</td></tr>
      <tr><td>Old Foundry</td><td>workshop −25%</td></tr>
      <tr><td>Brick Yards</td><td>+2% crime success</td></tr>
      <tr><td>Canal Row</td><td>+10% crime pay · laundering district</td></tr>
      <tr><td>Cathedral Hill</td><td>nerve increases two times faster</td></tr></table>
      <p><b>NPC rival families</b> — shared cash reserves that the whole server reduces together (Zappa L8, Kryl L20,
      Moreau L40). A raid costs energy, ammo, and heat, and pays a bonus if you reduce a family below its floor. If you
      defeat a family, your family holds its outpost (the outpost pays tribute to the treasury; a rival can take it by
      paying more than your garrison).</p>
      <p><b>The uprising</b> — the NPC families fight back. On some days (shown in advance on the forecast) a family rises up
      (harder to raid, no tribute). At the end, it leaves a held outpost if the garrison is too small — use <b>reinforce</b>
      from the treasury (this also protects against rival families) or lose the turf. If you keep a family weak, a small
      garrison is enough.</p>
      ${R(`GET /v1/city [public] · /v1/world · POST /v1/world/:npcId/raid · /v1/world/:npcId/reinforce · GET /v1/market/prices [public]`)}` },

  { id: 'economy', group: 'Money', title: 'The Economy — $OMR, Laundering & Staking', tag: 'the money cycle',
    html: `<p><b>Currencies:</b> cash (pocket and bank), <b>$OMR</b> (premium, launderable, extractable, account-level, so
      it survives death), crates, and ammo. The main rule: the game records every movement of value on a ledger.
      The game also creates $OMR — only on a fixed, public schedule, <b>the Street Wage</b>: a capped daily pot
      splits between the players who really played that day (respect earned, level 5+, up to 5 $OMR each). Only a
      <b>minted</b> account draws the wage (the Made Man package, or its PLEX price in earned $OMR) — one paid
      identity per earner keeps bot farms out of the pot. The pot
      comes from a hard, finite endowment and gets smaller on a set halving schedule. Board: ${R(`GET /v1/wage`)}
      Agents do not draw the wage.</p>
      <p><b>The AMM swap.</b> <b>Buy (cash to $OMR) is laundering</b> — minimum $500, only at a laundering district
      (Docks/Canal) or your turf, +15 heat, blocked from a safehouse, limit $2.6M/day. <b>Sell ($OMR to cash)</b> — the early-exit tax: $OMR younger than 48 hours pays an extra tax at the exit
      (sell or withdraw) — 50% at age zero, straight-line down to 0% at 48 hours, no exemptions. An exit prices
      your NEWEST tokens first, so old savings cannot shield a fresh dump — each fresh token pays once, at its own
      age's rate. Aged $OMR: no limit, 2% take.</p>
      ${L(`<b>Staking</b> pays up to 14% APY <b>from a funded pool</b> (not created). You always get your full principal
      back, but it <b>unbonds for 6 hours</b> (another player can steal it) before it is available. Staked $OMR is safe;
      unbonding is not.`)}
      <p><b>The cycle:</b> cash costs go to the street-tax pool. A 12-hour buyback buys $OMR: 30% to the staking pool, 25%
      to protocol liquidity, 50% to a family. <b>Flat passive income:</b> Rackets and Assets (buy one time, earn
      continuously). <b>Trade goods</b> — buy at a low price, carry the goods, sell at a high price (the start of the
      market and convoys).</p>
      ${R(`POST /v1/swap · /stake · /unstake · /claim-rewards · /rackets|assets/:id/buy · /goods/buy|sell`)}` },

  { id: 'kitchen', group: 'Money', title: 'The Kitchen', tag: 'the offline drug engine',
    html: `${L(`Buy <b>makings</b> → upgrade your <b>lab</b> → <b>cook</b> a batch → <b>collect</b> → <b>deal</b> (or let
      your <b>crew</b> sell while you are offline).`)}
      <p>Your <b>trade rank</b> controls it. There are 8 drugs (unlocked by rank). Cook produces <code>demand×12</code>,
      with a fire risk. <b>Deal</b> income = demand × quality × event × trade bonus, and <b>adds heat</b> (feeds the Law).
      A rank-0 dealer gets a +50% bonus on the corner. <b>Crew</b> (up to 5) sell while you are offline but cost
      <b>$1,200 each hour in wages ("the nut")</b> — if you do not pay for 3 days, the crew becomes <b>cold</b> and stops.
      <b>Lay low</b> and <b>clean papers</b> reduce heat. Above heat 60, the Bureau can raid.</p>
      ${R(`POST /v1/kitchen/makings/:drugId · /lab/upgrade · /cook · /collect · /deal · /crew/hire · /crew/wages · /laylow · /cleanpapers`)}` },

  { id: 'business', group: 'Money', title: 'Businesses & Fronts', tag: 'premium upgradeable venues',
    html: `<p>Level-gated, upgradeable places (Laundromat L15 to Casino L58) that earn cash <b>and</b> launder money
      privately. <code>GET /v1/catalog</code> lists them.</p>
      ${L(`<b>buy</b> → <b>collect</b> (24-hour limit) → <b>upgrade</b> → <b>launder</b> → <b>pay the upkeep</b>.`)}
      <p>Laundering through your business draws <b>less heat (8, compared to 15)</b> but has a daily limit. <b>Upkeep
      ("the pad")</b> is 20% of hourly income; if you do not pay for 3 days, the business becomes <b>cold</b>. Laundering
      builds <b>scrutiny</b>; above 60, the Bureau can <b>raid</b> (it takes the pending income, adds a fine, and closes
      the business). A rival can <b>shakedown</b> 30% of the pending income in a stat contest.</p>
      ${R(`GET /v1/catalog [public] · POST /v1/business/:kind/buy · /business/collect · /upkeep · /:id/upgrade|launder|shakedown`)}` },

  { id: 'territory', group: 'Money', title: 'Territory Rackets', tag: 'seizable family capital',
    html: `<p>There is one income operation in each district. The family that holds the turf owns it, so wars are about
      income, not only a treasury payment. Ladder: Numbers ($50k) → Protection ($250k) → Smuggling ($1M).</p>
      <p>A boss or underboss <b>establishes</b> an operation on held turf. Income accrues (24-hour limit) and <b>collects
      to the treasury</b>. You can <b>upgrade</b> it and must pay <b>upkeep</b> (20%, cold after 3 days). <b>When another
      family seizes the turf, the whole operation moves to the victor</b> (plus a war premium of 50% of the build cost).</p>
      ${R(`GET /v1/territory · POST /v1/territory/:districtId/establish|upgrade · /territory/collect · /upkeep`)}` },

  { id: 'families', group: 'Crews & Family', title: 'Families', tag: 'groups, wars, turf, the treasury',
    html: `<p><b>Found</b> a family for $25k at L5 (maximum 20 members); you join a family immediately. Roles: boss /
      underboss / capo / crew. <b>Tribute</b> (cash adds to the weekly task; $OMR goes to the reserve). <b>Wars</b> —
      declare a war for $10k; it runs 30 minutes; the winner takes 20% of the treasury. A fire-kill on a war rival scores 3
      points (a jump scores 1). <b>Turf</b> — seize a district for its benefits and its territory racket.</p>
      <p>The reserve buys status: <b>seals</b> (Wax 25 to Obsidian 1500 $OMR) and the <b>Foundation</b> (60 to 3000 $OMR).
      The Foundation is real power: it reduces the RICO conviction chance of every member (only members present when a case
      was filed). The family also holds a legal <b>RWA book</b> that earns a dividend.</p>
      ${R(`POST /v1/gangs · /gangs/:id/join · /leave · /kick · /promote · /gangs/tribute[/omr] · /war/:id · /districts/:id/seize · /gangs/foundation · /gangs/vanity/*`)}` },

  { id: 'commission', group: 'Crews & Family', title: 'The Commission', tag: 'server politics',
    html: `<p>Weekly governance with no money. The <b>top 5 families by this season's standing</b> hold seats. Each seated
      boss or underboss casts one <b>public vote each week</b>. Last week's majority controls this week. The boss of the
      first seat can <b>veto</b> one time each week.</p>
      <p><b>Decrees:</b> Open Season (safehouse ×0.5), Pax (no new wars), Amnesty (lay-low ×0.5), Lockdown (convoy defense
      +20).</p>
      ${R(`GET /v1/commission [public] · POST /v1/commission/vote · /veto`)}` },

  { id: 'den', group: 'Money', title: 'The Den (Casino)', tag: 'cash-only gambling',
    html: `<p><b>CASH ONLY, never $OMR.</b> The server calculates and records every result. The house adds 1% to the
      street-tax pool from real profit only.</p>
      <ul><li><b>Craps</b> — the pass line in one action, 1:1, edge about 1.41%, 1 nerve, up to $250k ($2M high-stakes at
      L30 or higher).</li>
      <li><b>The Numbers</b> — pick a number 0–999, one ticket each day, pays 600:1.</li>
      <li><b>Back-room PvP dice</b> — agree by listing a fade limit; the winner takes the pot minus a 5% rake.</li>
      <li><b>The weekly Fight</b> — one $5k bet on a favorite; the Neon-holding boss can <b>fix</b> it for $50k.</li>
      <li><b>The Track</b> — the greyhounds and the horses. A daily card (6 runners with posted odds, about 15% house
      share); one $50–$10k win bet for each race each day; the winner comes from the daily seed; claim at the LOCKED odds.
      If you own an animal, <b>run it in the card</b> ($5k nomination, up to 2 owner entries a race) — the town bets on
      your animal.</li>
      <li><b>The Futurity</b> — the major race where the Stable meets the Track. Owners <b>nominate</b> their animals ($5k
      fee, up to 8 in the field). The whole town bets <b>parimutuel</b>. At window close, the worker races the field on
      form; the winners share the losing pool minus a 5% share, and the winning owner takes a promoter's purse. (This is
      different from The Stakes — that is owners competing for a pooled buy-in; the Futurity is the crowd betting on the
      field.)</li></ul>
      ${R(`GET /v1/casino [public] · POST /v1/casino/dice · /numbers[/claim] · /fade · /dice/:id · /fight[/claim|/fix] · /track[/claim] · /futurity/nominate/:id · /futurity/bet`)}` },

  { id: 'stable', group: 'Money', title: 'The Stable', tag: 'own the dogs and the ponies',
    html: `<p>Own racing animals. <b>Buy</b> a greyhound ($30k) or a racehorse ($120k) at L6 or higher, <b>train</b> its
      speed, stamina, and heart (cash and energy, with a limit), and <b>race</b> it. Run up to 4. CASH only. An animal dies
      when your character dies; your lifetime wins are an owner record that survives death.</p>
      <ul><li><b>The circuit</b> (PvE) — enter a meet; the fee is lost win or lose; the purse pays only for a win.</li>
      <li><b>Match race</b> (PvP) — race a rival owner's animal of the same kind for a cash wager; the winner takes the pot
      minus a 5% share.</li>
      <li><b>Breed</b> two animals of the same kind into a foal that inherits their form (a head start, not a way to pass
      the limit; both parents retire).</li>
      <li><b>The Stakes</b> — a scheduled major race; enter your animal (a cash buy-in goes into escrow); the worker races
      the field, and the top places share the purse minus a 5% rake. Mickey the Cornerman (the boxing fixer) also trains
      your animals.</li></ul>
      ${R(`GET /v1/stable [+ /v1/leaderboard/stable] · POST /v1/stable/buy · /train/:id · /list/:id · /circuit/:id · /match/:opponentId · /breed · /stakes/:id`)}` },

  { id: 'speakeasy', group: 'Money', title: 'The Speakeasy', tag: 'the social hub',
    html: `<p>One prestige nightclub in each district (open at L15, $750k) — a business, a casino, and a social place. It
      dies when the owner's character dies.</p>
      <p><b>Collect</b> the bar income, <b>upgrade</b> the decor, and <b>name</b> it. <b>Be seen:</b> buy a <b>round</b> (a
      taxed payment to the owner; it adds you to the guest list; 10 visits make a "regular") or buy <b>bottle service</b> (a
      $OMR status payment). The <b>back-room table</b> takes 3% and adds <b>notoriety</b> — above 60 a <b>Prohibition
      raid</b> can happen. Build <b>renown</b> (Nobody to King of the Night). <b>Buy out</b> a club by agreement, or
      <b>stand over</b> it — pay $250k (lost win or lose), win a contest, and force the sale.</p>
      ${R(`GET /v1/speakeasy [public] · POST /v1/speakeasy/:d/round|bottle|table|standover · /collect|upgrade|name|list|unlist · /:d/buy · /decor`)}` },

  { id: 'boxing', group: 'Money', title: 'The Fights (Boxing)', tag: 'manage a fighter',
    html: `<p>Sign one boxer (L8, $50k), <b>train</b> the boxer ($20k + energy, +1 stat, limit 25), <b>list</b> a bout
      limit, and <b>fight</b> other managers. The winner takes 2× the stake minus a 5% rake (a taxed transfer, no new money
      is created); the loser's fighter is in the hospital for 4 hours. The fighter dies when your character dies. Ranks:
      Prospect to Hall of Famer.</p>
      ${R(`GET /v1/boxing · POST /v1/boxing/recruit|train|list · /fight/:opponentId · GET /v1/leaderboard/boxing`)}` },

  { id: 'pvp', group: 'The Underworld', title: 'PvP — Jumps, Hits & Contracts', tag: 'attacking players',
    html: `<p><b>Jump</b> — not lethal; costs energy and ammo; steals up to $25k pocket cash; hospitalizes for about 3
      minutes; scores 1 war point.</p>
      ${L(`<b>The hit:</b> place a <b>search</b> (about 3 hours to be ready) → <b>fire</b> (50 fp or more, 2-hour cooldown,
      +20 heat).`)}
      <p>A fire-<b>kill</b> runs the estate, <b>takes 40% of the cars</b>, <b>loots cash and $OMR</b>, has a 15% chance to
      take one gear piece, swears a <b>vendetta</b>, pays open kill contracts, scores war points, and earns <b>hitman
      reputation</b>. <b>NPC hit</b> — pay a fee (lost win or lose) for a hit the server calculates; no reputation; you
      cannot use it against family, yourself, new players, or safehoused players.</p>
      <p><b>The Contract Board</b> — escrow pots for each (target, kind). Post one (minimum $500; add 3 $OMR to be
      anonymous). A <b>directed</b> named hitman gets an exclusive window (minimum $10k, removed for a vendetta, rat,
      welsher, or wanted kill). The target can <b>peek</b> (5 $OMR) to name every funder. <b>Hitman reputation</b> is a
      status ladder (Associate to The Undertaker); lifetime reputation survives death.</p>
      ${R(`POST /v1/streets/:id/jump|search|fire|npchit|bounty · DELETE /streets/search · GET /v1/contracts [public] · /contracts/peek · /gangs/contract/:id`)}` },

  { id: 'riskpay', group: 'Risk & Death', title: 'Make Risk Pay — Loot, Safehouse, Revive', tag: 'the payoff and the shields',
    html: `${L(`A player fire-kill loots <b>25% of pocket and in-transit cash</b> and <b>20% of liquid and unbonding
      $OMR</b>. Cleared bank cash and staked $OMR are <b>safe</b>. NPC and mod kills loot nothing.`)}
      <p>This is why banking is a <b>timed</b> action: a deposit is exposed for 2 hours, and unstaked $OMR for 6 hours.
      <b>Safehouse</b> — the cost increases with wealth, for each 4-hour stay; a hit cannot target you, but a jump can. It
      is <b>a shield, not a base</b> (you cannot attack or move money from inside). <b>Bodyguard</b> — absorbs one lethal
      hit (never the guard's own attack). <b>Revive insurance</b> (a real-ETH token) — absorbs a lethal hit completely.</p>
      ${R(`POST /v1/safehouse · /bodyguard/offer · /bodyguard/hire/:guardId`)}` },

  { id: 'law', group: 'The Law', title: 'The Law & RICO', tag: 'the state opponent',
    html: `<p>The state reacts to your <b>heat</b>. The <b>investigation meter</b> builds from high heat and decreases
      slowly: clean → watched → investigation → <b>indicted</b>. <code>GET /v1/law</code> is your record.</p>
      <p><b>Escapes:</b> <b>bribe</b> (scales with wealth), the <b>lawyer retainer</b> ($150k for 3 days, reduces the bust
      and forfeiture), the <b>envelope</b> (15 $OMR for 7 days — halves the meter's gain, doubles its decrease).</p>
      ${L(`<b>The RICO bust</b> takes 30% of pocket and bank — but <b>staked $OMR and minted gear are safe, and it is NOT
      death.</b> If you stay offline past the grace window, the state force-busts you.`)}
      <p><b>Courtroom:</b> plea, buy the jury ($OMR), demand trial. <b>Informants:</b> <b>flip</b> a rival (drop your case,
      add exposure to them, earn the permanent <b>rat</b> badge — a rat loses omertà); <b>witness protection</b> makes you
      untargetable for a short time. The Foundation reduces family convictions; patrol hours increase convictions.</p>
      ${R(`GET /v1/law [public] · POST /v1/law/bribe|retainer|envelope|plea|jury|trial|witpro|flip/:id`)}` },

  { id: 'pen', group: 'The Law', title: 'The Pen (Prison)', tag: 'jail is a place',
    html: `<p>Every Pen action requires that you are jailed. <b>Work the yard</b> (reduces your sentence), the
      <b>commissary</b> (shiv $5k, burner $25k, cutkit $50k), <b>protection</b> ($15k no-shank window — a shield, so you
      cannot shank either), <b>bribe the guard</b> (a per-second exit).</p>
      <p><b>The shank</b> — both players jailed; spend a shiv and energy in a muscle contest. It respects revive tokens,
      witness protection, omertà (unless a rat), and protection or the hole. A kill is a real death (no loot, no car loss,
      no reputation); a caught attempt costs the shiv, more time, and <b>the hole</b> (solitary — you cannot act and no one
      can shank you). <b>Yard incidents</b> (Lockdown/Riot/Visit/Toss) change the daily chances. The <b>burner phone</b>
      calls an outside NPC hit. <b>Breakout</b> — solo (a win makes you a WANTED fugitive for 2 days) or co-op (a crew of
      2–4).</p>
      ${R(`GET /v1/pen · POST /v1/pen/work|protection|bribe · /buy/:item · /shank/:id · /burner/:id · /break[/plan] · /break/:id/join|go`)}` },

  { id: 'loans', group: 'The Underworld', title: 'Loan Sharking (The Shylock)', tag: 'the PvP credit market',
    html: `<p><b>Offer</b> escrows the principal ($5k–$1M, rate up to 50%, 1–72 hours; optional <b>directed</b> or
      <b>collateralized</b> by a car). A borrower <b>takes</b> it (one at a time; pledges a car if it is secured). The debt
      is <code>principal × (1+rate)</code>.</p>
      <p><b>Repay</b> (5% vig to the buyback pool). <b>Default and collect</b> — the lender takes the pocket and in-transit
      cash and the pledged car, sends the borrower to hospital, and marks them a permanent <b>welsher</b>. A default also
      marks the borrower <b>WANTED</b> for 3 days (no omertà, a pool bounty if L20 or higher, NPC hunters). <b>Square your
      name</b> ($50k) clears both. A <b>paper market</b> lets you sell an active claim.</p>
      ${R(`GET /v1/loans [public] · POST /v1/loans · /:id/take|repay|cancel|collect|sell|buy|unsell · /loans/square`)}` },

  { id: 'convoys', group: 'The Underworld', title: 'Smuggling Convoys', tag: 'bulk goods on a clock',
    html: `${L(`<b>open</b> (with a first load) → <b>load more</b> (larger than the trunk limit) → <b>depart</b> with
      <b>guards</b> (none/crew $5k/heavy $20k) and optional <b>insurance</b> → travels 30 minutes → <b>collect</b> at the
      destination.`)}
      <p>The route and a value band are announced, never the manifest. <b>Ambush</b> — energy, ammo, and heat in a contest
      of your muscle and speed against the guards and turf defense; a win takes goods up to your trunk limit. Up to 3
      hijacks for each convoy. <b>Tolls</b> — if you collect at another family's docks, you pay 5% to their treasury.
      <b>Insured</b> freight pays for a hijack (with a limit against related-account abuse).</p>
      ${R(`GET /v1/convoys [public] · POST /v1/convoy · /convoy/load · /depart · /cancel · /:id/ambush|collect`)}` },

  { id: 'heists', group: 'The Underworld', title: 'Crew Heists (The Big Score)', tag: 'co-op raids',
    html: `<p>Jobs: Payroll (crew 2, L8) → Inside Job (against a player business) → Bank Vault (crew 3, L20) → Reserve Train
      (crew 4, L40). Each position is a <b>role</b> (brains/muscle/wheelman/gun), and the calculation uses each member's
      stat for their role.</p>
      ${L(`A leader <b>plans</b> and stakes → the crew <b>join</b> by role → the leader <b>executes</b> (one calculation
      for all).`)}
      <p>Success divides the pot (1.2× for the leader); failure jails everyone. <b>The Rat</b> — any member can inform
      silently; the job fails, the rat leaves with half the stake, the rest get double jail, and the feed only says
      "somebody talked." A standard heist also gives every crew member a small legal <b>AAPL</b> share. The <b>solo Daily
      Score</b> shares an 8-hour cooldown.</p>
      ${R(`GET /v1/heists [public] · POST /v1/heists/plan · /:id/join|leave|rat|execute · POST /v1/heist (solo)`)}` },

  { id: 'market', group: 'The Underworld', title: 'The Black Market', tag: 'player-to-player trade',
    html: `<p><b>Cars sell by auction; goods sell at a fixed price with a district pickup; buy orders (WTB) let buyers name
      a price.</b> (Gear is not here — its market is the GearVault on the blockchain.)</p>
      <ul><li><b>Car auction</b> — one bid, an optional buy-now, a hidden reserve, and an anti-snipe close; an outbid
      bidder gets a refund immediately. A listed car locks.</li>
      <li><b>Goods</b> — a fixed price; the buyer must stand at the listing's dock with trunk space (partial buys).</li>
      <li><b>Buy orders</b> — escrow quantity × price at your dock; sellers fill from the trunk and are paid at once.</li></ul>
      ${R(`GET /v1/market [public] · POST /v1/market · /:id/bid|buy|cancel · /market/order · /:id/fill|claim`)}` },

  { id: 'vendettas', group: 'The Underworld', title: 'Vendettas & Blood Feuds', tag: 'status, no money',
    html: `<p>A player fire-kill swears the victim's family against the killer's family <b>for 7 days</b>; the heir inherits
      the feud. A <b>revenge fire-kill inside the window</b> ends it, pays 2× feared-reputation, and feeds the streets.
      Revenge also <b>removes the directed-contract minimum</b> on a kill contract against your target. NPC and mod kills do
      not swear a feud.</p>
      ${R(`GET /v1/feud/:characterId [public]`)}` },

  { id: 'skills', group: 'The Underworld', title: 'Skills & Specializations', tag: 'your build',
    html: `<p>Three branches, three levels each; points <b>come from your level</b> (<code>floor(level/4)</code>). Skills
      die with the character. Respec for 10 $OMR (shared 24-hour cooldown).</p>
      <ul><li><b>Enforcer</b> — Bruiser (jump/shakedown ×1.08) · Doctor's Friend (heal ×0.75) · Executioner (search ×0.8).</li>
      <li><b>Operator</b> — Fast Talker (lay-low ×0.8) · Fence Network (fence/melt +8%) · Broker (listing fees ×0.5).</li>
      <li><b>Wheelman</b> — Pack Mule (+3 trunk) · Getaway (crime jail ×0.8) · Road Captain (own convoys 20% faster).</li></ul>
      ${R(`GET /v1/skills · POST /v1/skills/:id · /skills/respec`)}` },

  { id: 'underworld', group: 'The Underworld', title: 'The Underworld (Fixers)', tag: 'the people you know',
    html: `<p>Five named fixers you build standing with (0–100, for each character): <b>Doc Moretti</b> (survival),
      <b>Vinnie the Match</b> (contracts), <b>Bella Bang-Bang</b> (gear), <b>Big Tuna</b> (trade), <b>The Madame</b> (the
      Den).</p>
      <p>You <b>earn standing when you work with a fixer</b> (limit 25 each day). Levels at 25/60/90 unlock discounts and
      favors. <b>Gifts</b> ($5k, +5) only work below 50 — you must earn the top levels. A <b>daily lead</b>, a <b>weekly
      favor</b>, and an <b>errand chain</b> reward loyalty. A <b>grudge</b> (killing a fixer's friend) limits your level
      until you pay <b>penance</b> ($25k). Your heir inherits 25% of your standings.</p>
      ${R(`GET /v1/underworld · POST /v1/underworld/:npc/gift|penance|favor|errand · /discharge · /gun/:id/sell`)}` },

  { id: 'wire', group: 'The Underworld', title: 'The Wire', tag: 'information you buy',
    html: `<p><b>Wiretap</b> (8 $OMR, 12 hours, up to 5) — shows a rival's Law stage and heat, wealth band, operations,
      WANTED status, and <b>if they are hunting you</b>. <b>Sweep</b> (5 $OMR) removes taps on you (free when clean). The
      <b>Street Wire subscription</b> is a <b>tiered ladder</b> — Street Wire (12 $OMR/7 days: the ticker tape, Law
      forecasts, threat data — a count of hunters on you, never a name), The Wire Room (30: plus the war room and 2
      standing watches), The Switchboard (60: plus 5 standing watches). A <b>standing watch</b> (tier 2 or higher) renews a
      tap from your $OMR, so the surveillance runs while you are offline. There are also <b>tradecraft</b> ranks (more
      slots and a read discount), the <b>watchdog</b> (a live alert when a tapped target becomes hot), the <b>bug
      trace</b>, the <b>dossier</b>, <b>disinformation</b>, and the <b>informant</b> (a human source that passes
      disinformation).</p>
      ${R(`GET /v1/wire · POST /v1/wire/tap/:targetId · /wire/sweep · /wire/subscribe {tier} · /wire/watch/:targetId`)}` },

  { id: 'store', group: 'Endgame & Going Legit', title: 'The Store, PLEX & the Ledger', tag: 'real-money packages',
    html: `<p><b>The Store</b> sells ETH packages that grant <b>only non-currency items</b> (this prevents pay-to-win:
      entitlements, access, cosmetics, status — never cash, $OMR, gear, or power): Made Man (a mint credit), revive
      bundles, Street Wire, the Season Pass, the Patron badge, and decor. Revenue divides 40% founder / 40% buyback / 20%
      RWA reserve.</p>
      <p><b>PLEX</b> — pay for a package or a fee with <b>earned $OMR</b> instead of ETH. <b>The Season Pass / Ledger</b> —
      while active, claim the next of 12 levels each day (titles, revives, energy, small funded $OMR stipends); it is
      account-level and survives death.</p>
      ${R(`GET /v1/store [public] · POST /v1/store/plex/:sku · GET /v1/pass · /pass/claim · GET /v1/plex/price [public]`)}` },

  { id: 'legit', group: 'Endgame & Going Legit', title: 'Going Legit — the Portfolio & Dynasty', tag: 'the death-proof endgame',
    html: `<p>Change dirty cash to laundered $OMR to a <b>legal, death-proof stock book</b>. The tickers are real Robinhood
      tokenized stocks (GLD, AAPL, AMZN, TSLA, HOOD, NVDA, SPCX, GME) — in the game a <b>status collectible</b> with a set
      price; <b>no sell, no cash-out</b> (a real KYC extraction is a future phase behind legal approval).</p>
      <p><b>Invest</b> burns clean $OMR for shares; a large action adds heat and is blocked from a safehouse; 15% funds a
      <b>dividend pool</b>. <b>Dividend</b> — an approximately daily payment of your book value (limited by the pool).
      <b>The Dynasty</b> — name your account-level book, and it passes to your heir (a generational fund plus a crest
      level). <b>Landmarks</b> — hold a district plaque with your dynasty name. Earned (never by chance): a heist AAPL
      share, a season SPCX prize.</p>
      ${R(`GET /v1/portfolio [public] · POST /v1/portfolio/invest · /portfolio/dividend · /dynasty/name · /landmarks/:id · GET /v1/leaderboard/portfolio`)}` },

  { id: 'window', group: 'Endgame & Going Legit', title: 'The Window & the Family Yield', tag: 'tokenomics v2',
    html: `<p>How $OMR works changed. <b>Cash no longer buys $OMR</b> — the wash houses are shut, laundering at your own
      front is gone, and the swap says so plainly if you try it. In exchange:</p>
      <p><b>The Window</b> — burn $OMR, take in-game cash at a published rate, out of a till the street take fills. It runs
      <b>one way only</b>: cash never becomes $OMR again. The till can run dry, and a short window refuses and
      <b>burns nothing</b> — it is a claim on what was funded, never a promise; there is a daily limit per account. It is
      <b>open</b>, which it could not be while cash still bought $OMR: the two together would be a money pump, and the game
      refuses to run both.</p>
      <p><b>The Family Yield</b> — the top families by this season's standing split a pot of $OMR into their reserve. It is
      what staking rewards and personal dividends become: standing stops being only a badge and starts paying, so tribute,
      wars and the Commission are worth real money to a family.</p>
      <p><b>What backs the stock float</b> — the float buys real tokenized shares with real ETH, and the board now names
      where that ETH came from: the DEX sell tax, treasury bonds, the store, game fees. Two of those matter at scale and
      they are deliberately different — the tax only earns when people are trading, and bonds earn whether or not anyone
      is. The game never owes a share it has not already bought, so you can read the funding and the holdings and check
      the claim yourself.</p>
      ${R(`GET /v1/window · POST /v1/window/redeem · GET /v1/yield [public] · GET /v1/vault`)}` },

  { id: 'estate', group: 'Endgame & Going Legit', title: 'The Estate & Auction House', tag: 'status sinks',
    html: `<p><b>The Estate</b> — a deep, account-level (death-proof) $OMR cost and a home: buy levels (Safe House 40 to The
      Compound 2500 $OMR), unlock features, name it, and show <b>trophies</b> from your real holdings.</p>
      <p><b>The Auction House</b> — a competitive weekly $OMR cost: 3 unique items each week; the highest <b>$OMR bid
      wins</b>, and <b>the winning bid burns</b>. Outbid bidders get a refund immediately; won items survive death.</p>
      ${R(`GET /v1/estate · POST /v1/estate/upgrade|feature/:id|name · GET /v1/auction [public] · POST /v1/auction/:lotId/bid`)}` },

  { id: 'chain', group: 'The Chain', title: 'The Chain — Withdrawal & Bonds', tag: 'settling on the blockchain (not active)',
    html: `<p>OMERTÀ settles on Robinhood Chain (an EVM L2). The blockchain layer is built but <b>not active until
      mainnet</b> (behind legal and audit approval). The off-chain game is authoritative; the blockchain settles
      withdrawals and ownership; nothing is created.</p>
      <p><b>Withdraw $OMR</b> — burns your $OMR and signs a voucher <b>only if the reserve can back it</b> (if not, it
      waits in a queue). <b>Only a minted account can extract.</b> <b>Gear withdrawal</b> mints your gear as an NFT (it
      leaves the game). <b>Wallet link</b> is SIWE; <b>character mint</b> (0.01 ETH) makes a trial character permanent.
      <b>Bonds</b> — deposit ETH for discounted treasury $OMR that vests over time; the ETH deepens the pool and feeds the
      <b>Vig</b> (the real-revenue engine that backs withdrawals, so extraction is not more than inflow). Bonds never
      create $OMR (a budgeted amount).</p>
      ${R(`POST /v1/withdraw · /gear/:id/withdraw · /wallet/challenge|verify · /character/mint · GET /v1/bonds [public] · /bonds/:id/claim`)}` },

  { id: 'growth', group: 'Reference', title: 'Growth — Paths, Missions, the First Week', tag: 'progression support',
    html: `<p><b>Paths</b> (L5, $10k; switch for 25 $OMR) — a permanent earning specialty: The Gun (fights/contracts), The
      Ledger (racket/front/trade income), The Kitchen (cook quality, less deal heat). <b>Missions</b> — 29 pay-once jobs
      (cash + respect + sometimes $OMR + titles). <b>Daily contracts</b> — 3 each day plus an all-three $OMR bonus. <b>The
      Daily Score</b> is the best repeatable at a low level (8-hour cooldown).</p>
      <p><b>Referrals</b> (your code is your character NAME) — a recruit qualifies after 4 conditions; milestones pay cash,
      $OMR, and titles. <b>The spark</b> pays a small early bonus at L3 and 10 jobs; <b>tier-2 "the family tree"</b> pays a
      one-time $5k finder's fee when your recruit brings in their own qualified recruit (cash only, depth 2); a
      <b>recruitment drive</b> can multiply referral CASH for a time. The <b>Recruiters</b> boards rank the top recruiters
      and families. <b>Spread the Word</b> — three daily social tasks pay a small amount of cash ($300; $500 for all three; a post must STAND 4 hours before it pays — post-and-delete pays nothing)
      and share your referral code. <b>The First Week</b> — a 9-task checklist that pays cash to teach the game, with a
      final bonus. <b>The Coach</b> (the ▸ line on your sheet) always names your best next action.</p>
      ${R(`POST /v1/path · /missions/:id · GET /v1/daily · /daily/:id/claim · POST /v1/heist · GET /v1/onboard · /onboard/:taskId/claim · GET /v1/social · /v1/social/:taskId/claim · GET /v1/leaderboard/recruiters`)}` },

  { id: 'megaproject', group: 'The City & the World', title: 'The Megaproject', tag: 'the city builds a monument',
    html: `<p>The whole server pools value toward ONE announced monument (the City tab). Contribute <b>cash</b>,
    <b>trade goods</b> from your trunk (at catalog base value), or <b>$OMR</b> (at a fixed $500 rate). Every
    contribution is a <b>burn</b> — this buys glory, not power. The city sees milestones at 25/50/75%; when the
    monument completes it joins <b>the skyline</b> forever, and the plaque records every contributor — tiered
    <b>The Architect</b> (top brick) → Foreman → Patron → Builder. The plaque is account-level: your dynasty keeps
    its glory through death. Monuments rise in order: the Cathedral Restoration → the Grand Casino → the
    Founder's Bridge → the Colossus of the Docks.</p>` },
  { id: 'deferred4', group: 'Money & Legit', title: 'The Household, Motions, the House Window & Ring Poker', tag: 'staff wages, the levy, the last-resort lender, real hold\u2019em',
    html: `<p><b>The Household &amp; the Gala</b> (Estate) \u2014 hire staff who draw daily $OMR wages on one
    household clock; stiff them a week and they WALK. With a Butler and a square book, a tier-2+ house throws a
    <b>gala</b> \u2014 a big burn that opens the doors for four hours; every guest lands on your list. The great
    houses rank on their $OMR sunk.</p>
    <p><b>Motions before the Commission</b> (Family) \u2014 a seated boss stakes a $100k treasury deposit to put a
    decree on the ballot; when motions exist, ONLY they are votable. The enacted motion refunds, the rest forfeit.
    The fifth decree, <b>THE LEVY</b>, pays the buyback's family cut to the seated chamber by seat weight.</p>
    <p><b>The House Window</b> (Shylock) \u2014 the lender of last resort: 35% for 24h, level-scaled cap, and it
    lends ONLY what its vig-fed pool holds. Default and the house always collects \u2014 seizure, the welsher
    mark, the WANTED books.</p>
    <p><b>Ring Poker</b> (the Den) \u2014 real multi-way hold'em with betting streets. The table holds the money:
    cash moves only when you sit or stand; raises cap at the shortest stack; a 90s clock folds stallers; the rake
    comes off the pot. Die at the table and your stack burns. The tournament also runs in <b>BRACKET</b> format
    \u2014 rounds of heats down to a final.</p>` },
  { id: 'slate456', group: 'Risk & Death', title: 'The Dueling Circuit, Clue Scrolls & the Season', tag: 'the ladder, the trail, the twist',
    html: `<p><b>The Dueling Circuit</b> (Wet Work) — the ranked ladder. List yourself with a stake cap,
    challenge anyone listed: your BUILD fights (stats + gear), the stake changes hands minus the 5% rake, and
    your <b>ELO</b> moves. Seasonal (resets every 28 days), dies with your street; lifetime wins are a dynasty
    legend. Rematch-farming the same rival pays less each day.</p>
    <p><b>Clue Scrolls</b> (Streets) — a rare drop on any successful job starts a treasure trail: 3–5 riddles,
    each naming a district (sometimes an hour of day). Travel there and DIG. The last dig opens a <b>casket</b>
    and counts on your lifetime diggers' legend. One hunt at a time; after a casket the streets go quiet 8h.</p>
    <p><b>The Season</b> (the City board) — each 28-day season may carry ONE rule twist from a public pool
    (The Crackdown, Blood in the Streets, The Gold Rush — or a vanilla Dead Quiet). The City banner tells you
    the season's law; it snaps back at rollover.</p>` },
  { id: 'phone', group: 'Reference', title: 'The Cellphone & the Troll Box', tag: 'talking',
    html: `<p><b>The Cellphone</b> (the 📱 button up top) is your personal inbox + direct messages. The
    <b>inbox</b> shows what happened TO you — a convoy jacked, a contract posted on your head, a fee credited.
    <b>The line</b> is player-to-player DMs: pick anyone off the streets and talk. Threads live on your
    ACCOUNT, so they survive death — the heir picks up the phone. 240 characters a line, one message every
    2 seconds, 30-day retention. No money ever rides a message — a "deal" in DMs still has to happen through
    the game's real systems. <b>Blocked lines</b>: block a pest from their thread and they get a dead tone
    (they'll know); the block follows their bloodline until you lift it, and it only mutes their mouth —
    game events still reach you. A 📱 button rides every street in Wet Work, and the mobile thumb bar
    has a cell stop with the unread badge.</p>
    <p><b>The Troll Box</b> (the Live Feed side panel) is public city chat, plus a family-only room. The family
    room shows only messages from AFTER you joined — you can't infiltrate a family and read its back-chat.</p>` },
  { id: 'reference', group: 'Reference', title: 'Quick Reference', tag: 'the things to remember',
    html: `<h3>What is safe from looting</h3><p>Cleared <b>bank</b> cash · <b>staked</b> $OMR · <b>minted (on-chain)</b>
      gear · your account-level <b>portfolio / estate / prestige</b>. Everything in your pocket is at risk when you die.</p>
      <h3>Status marks on your sheet</h3><p><b>wanted</b> (hunted, even by family — square it) · <b>welsher</b>
      (defaulted, cannot borrow — square it) · <b>indicted</b> (a RICO case — go to The Law) · <b>in transit</b> (a deposit
      is not cleared — another player can steal it) · <b>unbonding</b> ($OMR is not liquid — another player can steal it) ·
      <b>safehouse</b> (untargetable, but you cannot act) · <b>hospital / lockup / the hole</b> (wait).</p>
      <h3>Currencies</h3><p><b>Cash</b> (pocket can be stolen, bank is safe) · <b>$OMR</b> (premium, launderable,
      extractable, account-level, so it survives death; staked is safe, liquid can be stolen) · <b>crates</b> (guns/gear) ·
      <b>ammo</b> (jumps/fires/raids).</p>
      <h3>Do not confuse these</h3><p>A flat Racket/Asset "Speakeasy/Nightclub/Casino" (buy-once income) is NOT a Business
      casino/nightclub (an upgradeable front); NOT The Speakeasy (the deep club system); NOT The Den (the games).</p>

];

const GROUP_ORDER = ['Start','The Basics','Money','Crews & Family','The Underworld','Risk & Death',
  'The Law','Endgame & Going Legit','The Chain','Reference'];

function render() {
  const doc = document.getElementById('doc');
  const nav = document.getElementById('navlist');
  doc.innerHTML = ''; nav.innerHTML = '';
  const groups = {};
  for (const s of SECTIONS) (groups[s.group] = groups[s.group] || []).push(s);
  const order = [...GROUP_ORDER.filter((g) => groups[g]), ...Object.keys(groups).filter((g) => !GROUP_ORDER.includes(g))];
  for (const g of order) {
    const gl = document.createElement('div'); gl.className = 'grp'; gl.textContent = g; nav.appendChild(gl);
    for (const s of groups[g]) {
      const a = document.createElement('a'); a.className = 'item'; a.href = '#' + s.id; a.dataset.id = s.id;
      a.textContent = s.title; nav.appendChild(a);
      const sec = document.createElement('section'); sec.id = s.id;
      sec.innerHTML = `<h2>${s.title}</h2>${s.tag ? `<div class="tag">${s.tag}</div>` : ''}${s.html}`;
      doc.appendChild(sec);
    }
  }
  wireScroll();
}
function wireScroll() {
  const links = [...document.querySelectorAll('#nav a.item')];
  const secs = [...document.querySelectorAll('#doc section')];
  const io = new IntersectionObserver((ents) => {
    for (const e of ents) if (e.isIntersecting) {
      links.forEach((l) => l.classList.toggle('on', l.dataset.id === e.target.id));
    }
  }, { rootMargin: '-40% 0px -55% 0px' });
  secs.forEach((s) => io.observe(s));
}
document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const sec of document.querySelectorAll('#doc section')) {
    const hit = !q || sec.textContent.toLowerCase().includes(q);
    sec.style.display = hit ? '' : 'none';
    const link = document.querySelector(`#nav a.item[data-id="${sec.id}"]`);
    if (link) link.classList.toggle('hide', !hit);
  }
});
render();
</script>
