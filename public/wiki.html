<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMERTÀ — the codex</title>
<style>
  /* The codex uses the same display face the city itself is set in, served from our own origin. */
  @font-face{font-family:'OmDisplay';src:url('/art/display.woff2') format('woff2');font-weight:600;font-display:swap}

  :root{
    --bg:#0a0908; --panel:#121110; --panel2:#191614; --line:#2b2622; --line2:#3a332d;
    --ink:#e4ddd0; --dim:#9a9184; --faint:#6b6357;
    --neon:#c9a24a; --neon-d:#8a6f31; --blood:#b3313a; --ok:#5f9d95; --bad:#d16a5f; --cold:#6a8fb5;
    --display:'OmDisplay','Oswald','Arial Narrow',sans-serif;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
    font-size:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.66;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 480px at 78% -8%,rgba(201,162,74,.07),transparent 62%);
    background-attachment:fixed}
  code,.mono,input{font-family:var(--mono)}
  a{color:var(--neon);text-decoration:none;text-underline-offset:3px}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--neon);outline-offset:2px}

  /* ── masthead ─────────────────────────────────────────── */
  #top{display:flex;align-items:center;gap:16px;padding:14px 22px;
    border-bottom:1px solid var(--line);background:rgba(10,9,8,.94);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:6}
  #top h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.14em;font-weight:600;
    background:linear-gradient(176deg,#f4ead4,var(--neon) 62%,var(--neon-d));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #top .sub{color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  #top .home{margin-left:auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;
    border:1px solid var(--line2);padding:6px 12px;border-radius:2px;color:var(--dim)}
  #top .home:hover{color:var(--neon);border-color:var(--neon-d);text-decoration:none}

  /* ── shell ────────────────────────────────────────────── */
  #wrap{display:grid;grid-template-columns:296px 1fr;min-height:calc(100vh - 56px)}
  #nav{border-right:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg));
    padding:16px 0 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;scrollbar-width:thin}
  #nav .search{padding:0 16px 12px}
  #nav input{width:100%;background:#0e0d0c;border:1px solid var(--line2);color:var(--ink);
    padding:9px 11px;border-radius:2px;font-size:13px}
  #nav input::placeholder{color:var(--faint)}
  #nav .grp{color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;padding:18px 18px 6px;display:flex;align-items:center;gap:9px}
  #nav .grp:after{content:'';flex:1;height:1px;background:var(--line)}
  #nav a.item{display:block;padding:6px 18px 6px 22px;color:var(--dim);font-size:13.5px;
    border-left:2px solid transparent;line-height:1.4}
  #nav a.item:hover{background:var(--panel2);color:var(--ink);text-decoration:none}
  #nav a.item.on{color:var(--neon);border-left-color:var(--neon);background:rgba(201,162,74,.07)}
  #nav a.item.hide{display:none}
  #doc .empty{padding:8px 0 40px}

  /* ── the reading column ───────────────────────────────── */
  #doc{padding:40px 44px 120px;max-width:860px}
  #doc section{scroll-margin-top:76px;margin-bottom:56px;padding-bottom:40px;border-bottom:1px solid var(--line)}
  #doc section:last-child{border-bottom:0}
  #doc .num{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--faint);
    text-transform:uppercase;display:block;margin-bottom:9px}
  #doc h2{font-family:var(--display);font-weight:600;color:var(--ink);letter-spacing:.02em;
    font-size:clamp(25px,3.4vw,36px);line-height:1.08;margin:0 0 6px;text-transform:uppercase;text-wrap:balance}
  #doc .tag{color:var(--neon);font-size:14px;font-style:italic;margin:0 0 22px}
  #doc h3{font-family:var(--display);color:var(--neon);font-size:15px;letter-spacing:.13em;
    text-transform:uppercase;margin:30px 0 10px;padding:0;border:0;font-weight:600}
  #doc p,#doc li{font-size:16px;color:var(--ink)}
  #doc p{margin:0 0 14px;max-width:72ch}
  #doc .dim{color:var(--dim)}
  #doc ul{margin:10px 0 14px;padding-left:0;list-style:none;max-width:72ch}
  #doc ul li{position:relative;padding-left:20px;margin-bottom:8px}
  #doc ul li:before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;
    background:var(--neon-d);transform:rotate(45deg)}
  #doc b,#doc strong{color:#fff;font-weight:600}
  #doc code{background:rgba(95,157,149,.09);border-radius:2px;padding:1px 5px;font-size:13.5px;
    color:var(--ok);-webkit-box-decoration-break:clone;box-decoration-break:clone}

  /* the loop / callout — a pull-quote, not a box */
  #doc .loop{background:linear-gradient(90deg,rgba(201,162,74,.08),transparent 72%);
    border-left:2px solid var(--neon);padding:14px 18px;margin:18px 0;font-size:16px;max-width:72ch}
  #doc .loop b{color:var(--neon)}
  #doc .loop:first-child{margin-top:0}

  /* the lead paragraph */
  #doc .lead{font-size:19px;line-height:1.58;color:var(--dim);border:0;background:none;padding:0;
    margin:0 0 20px;max-width:66ch}
  #doc .lead b{color:var(--ink)}

  /* tables read as data */
  #doc table{border-collapse:collapse;margin:18px 0;font-size:14.5px;width:100%;
    border:1px solid var(--line);font-variant-numeric:tabular-nums}
  #doc th,#doc td{border:0;border-bottom:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
  #doc thead th{font-family:var(--display);background:var(--panel2);color:var(--dim);font-weight:600;
    text-transform:uppercase;font-size:11px;letter-spacing:.14em;border-bottom:1px solid var(--line2)}
  #doc tbody tr:last-child td{border-bottom:0}
  #doc tbody tr:hover td{background:rgba(201,162,74,.04)}
  #doc .warn{color:var(--bad)}

  /* the route line — a receipt at the foot of a section */
  #doc .routes{color:var(--faint);font-size:12px;font-family:var(--mono);line-height:1.7;
    border-top:1px solid var(--line);margin-top:20px;padding-top:11px;word-break:break-word}

  #totop{position:fixed;right:22px;bottom:22px;z-index:7;font-family:var(--mono);font-size:11px;
    letter-spacing:.1em;color:var(--dim);background:rgba(18,17,16,.94);border:1px solid var(--line2);
    padding:9px 13px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s}
  #totop.show{opacity:1;pointer-events:auto}
  #totop:hover{color:var(--neon);border-color:var(--neon-d);text-decoration:none}

  @media (max-width:900px){
    #wrap{grid-template-columns:1fr}
    #nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);max-height:44vh}
    #doc{padding:26px 18px 80px}
    #doc section{margin-bottom:40px;padding-bottom:30px}
    #top{padding:11px 14px;gap:10px}
    #top h1{font-size:20px}
    #top .sub{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="top">
  <h1>OMERTÀ</h1><span class="sub">The Codex</span>
  <a class="home" href="/">← the city</a>
</div>
<div id="wrap">
  <div id="nav">
    <div class="search"><input id="q" placeholder="search the codex…" aria-label="Search the codex" autocomplete="off"></div>
    <div id="navlist"></div>
  </div>
  <div id="doc"></div>
</div>
<a id="totop" href="#top">↑ top</a>

<script>
// ── The codex content. Each section: { id, group, title, tag, html }. Rendered into #doc + #nav. ──
// GROUPS order the sidebar. Content authored from the verified feature inventory.
const R = (s) => `<div class="routes">${s}</div>`;          // route line
const L = (s) => `<div class="loop">${s}</div>`;            // loop / callout
const SECTIONS = [
  { id: 'welcome', group: 'Start', title: 'Welcome to the City', tag: 'what this is',
    html: `<p class="lead">OMERTÀ is a deep multiplayer crime game. You start as a new player in the Docks with $500. You
      try to become a powerful and feared boss. Another player can also kill your character. This codex describes every
      system and every loop.</p>
      <p>Use the search box to find a topic. The numbers here are the current settings and can change. "Level N" is your
      character level. The level comes from respect: <code>level = floor(sqrt(respect/10)) + 1</code> — L5 ≈ 160 respect,
      L10 ≈ 810, L20 ≈ 3,610, L30 ≈ 8,410.</p>` },

  { id: 'coreloop', group: 'Start', title: 'The Core Loop', tag: 'how you earn and grow',
    html: `${L(`Do <b>jobs</b> for cash → <b>train</b> your stats → put your cash in the <b>bank</b> → set up <b>income
      sources</b> that pay you while you are away → increase your <b>level</b>.`)}
      <p><b>Crimes</b> — 43 jobs, from Pickpocket (L1) to Empty the Federal Depository (L110). Each job has a level
      requirement, a nerve cost, a cash range, and a chance of jail if you fail. Your success rate increases with cunning
      and speed, your family level, some districts, and your rank. Jobs can give <b>crates</b> (buy guns and make gear) and
      <b>makings</b> (Kitchen ingredients).</p>
      <p><b>Every job has a mark, and the money comes off them.</b> A crime names a victim drawn from the NPC residents standing in your district. When that mark has money on them, <b>THE TAKE</b> moves it: the cash you earn is transferred off their pocket (up to 25% of it per job) and only the shortfall is created by the game. A job on a busy street is a robbery with a name on it; a job on an empty one still pays exactly the same, it just comes from nowhere. Marks are always NPC residents — a real player is never robbed by a stranger's crime roll, because they would get no warning and no way to answer. Taking from a real player is what the PvP asset crimes are for (rob a front, steal a car, mug their trunk), and those always tell the victim who did it.</p>
<p><b>Energy and nerve</b> power your actions and increase again with time. <b>Heat</b> is the police attention that
      crime causes. Too much heat starts a police case. <b>Train</b> costs 10 energy (the increase becomes smaller as a
      stat becomes higher). <b>Heal</b> returns you to full health. <b>Check in</b> one time each day for a streak bonus
      and energy.</p>
      <p><b>The Bank:</b> another player can steal the cash in your pocket when you die. Bank cash is safe. But a new
      deposit is <b>"in transit" for 2 hours</b> (another player can steal it until it clears). You cannot use the bank
      from a safehouse.</p>
      ${R(`POST /v1/crimes/:id · /train/:stat · /heal · /checkin · /bank/deposit|withdraw · /travel/:district`)}` },

  { id: 'character', group: 'The Basics', title: 'Your Character, Death & the Heir', tag: 'respect, rank, the estate',
    html: `<p>Each account has one living character. You start at L1, with 50 energy, 10 nerve, 100 health, $500, and a RANDOM
      stat spread (always 15 points across muscle/cunning/speed, each at least 3 — no two builds the same). <b>Respect</b> is your experience. It sets your <b>level</b> and your <b>rank</b> (benefits at L10
      Hustler, L35 Enforcer, L65 Soldier "made man", L95 Underboss, L125 Don). <b>Effective stats</b> = trained + gear +
      assets. <b>Firepower (fp)</b> comes from your gun — you need 50 fp or more to make a lethal hit.</p>
      ${L(`<b>Death:</b> the character dies, but the account does not die. An heir is born and inherits everything at the
      account level.`)}
      <p><b>Lost when the character dies:</b> stats, skills, businesses, the speakeasy, the Kitchen crew, the boxing
      fighter, territory operation control, and this season's kills. <b>Passes to the heir:</b> prestige, the legal
      the Estate, the Store patron/pass benefit, hitman reputation and lifetime
      kills, minted status, revive tokens, and 25% of your Underworld standings.</p>
      <p><b>Seasons</b> last 28 days. At the end, your level converts to prestige (<code>floor(level/2)</code>) and your
      respect returns to 0. <b>Respec</b> your stats for 90 $OMR (24-hour cooldown).</p>
      ${R(`POST /v1/character · GET /v1/me · /v1/session · POST /v1/respec`)}` },

  { id: 'cars', group: 'The Basics', title: 'Cars, Guns & Gear', tag: 'the garage and the armory',
    html: `<p><b>Cars and the Garage</b> (limit 12). 60 models, each with trims. <b>Boost</b> steals a random car (5-minute
      cooldown). <b>Melt</b> scraps a car for ammo (25% goes to your family). <b>Fence</b> and <b>repair</b> sell or fix a
      car. A car that is listed or pledged refuses melt, fence, and repair.</p>
      <p><b>Guns and the Armory.</b> 15 guns (Rusty .25 fp3 to the 'Undertaker' fp60), bought with cash and crates.
      <b>Vests</b> (bought with $OMR) increase survival. <b>Ammo</b> costs $2000 for 50 rounds. Its price is <b>never
      reduced</b> — it controls the cost of a kill.</p>
      <p><b>Gear</b> (about 55 items, priced in $OMR) increases stats. Gear is a tradeable NFT on the blockchain. A
      fire-kill has a <b>15% chance to take one in-game gear piece</b> — but <b>gear minted on the blockchain is safe</b>.
      Keep gear in the game to use it (you can lose it), or move it to the blockchain (it is safe and tradeable, but you
      cannot use it in the game).</p>
      <p><b>Rarity, and the way off the board.</b> Every car and boat carries a rarity — Common, Rare, Legendary,
      Epic — rolled by the server the moment you <b>earn</b> it, and logged so the draw can be checked. It is pure
      status: no extra speed, no extra value, nothing but scarcity. You can buy your way up the ladder with $OMR, and
      the price buys <b>exactly the next tier</b> — a known item for a known price, never a roll. Nothing in this game
      sells a random outcome for money.</p>
      <p>You can also take one <b>on-chain</b>, on the same rail gear uses, and that is the real decision:
      <b>in-game items are lootable; extracted NFTs are safe, and inert</b>. An extracted car is an ERC-1155 in your own
      wallet — nobody can steal it, win it in a pink-slip race, chop it off your corpse or take it in a war, and it
      <b>survives your death</b> and passes down the bloodline. In exchange it never races, hauls, melts, fences or
      earns again. Use it or own it; you cannot do both, and there is no way back. You must be MADE to take anything
      on-chain.</p>
      ${R(`POST /v1/garage/boost · /garage/:carId/melt|fence|repair · /armory/gun/:id/buy|equip · /armory/ammo · /workshop/craft/:id · GET /v1/nft · POST /v1/nft/:kind/:id/upgrade|withdraw`)}` },

  { id: 'city', group: 'The Basics', title: 'The City & the Living World', tag: 'events, weather, districts, NPC families',
    html: `<p>The city has a <b>daily background that is the same for all players</b> and can be known in advance. <b>City
      events</b> (16, one each day) change every loop (HEAT WAVE, DOCK STRIKE, THE CRACKDOWN, BUREAU SWEEP, OPEN CITY, and
      more). <code>GET /v1/city</code> shows the current day and a 7-day forecast. <b>Regional weather</b> changes
      trade-good prices. A <b>day and night clock</b> increases convictions during patrol hours (UTC 13–22) and makes night
      raids easier.</p>
      <table><tr><th>District</th><th>Benefit</th></tr>
      <tr><td>Docks</td><td>+50% contraband · the harbor · start here</td></tr>
      <tr><td>Neon Mile</td><td>+15% racket/front income · the vice district</td></tr>
      <tr><td>Old Foundry</td><td>workshop −25%</td></tr>
      <tr><td>Brick Yards</td><td>+2% crime success</td></tr>
      <tr><td>Canal Row</td><td>+10% crime pay</td></tr>
      <tr><td>Cathedral Hill</td><td>nerve increases two times faster</td></tr></table>
      <p><b>NPC rival families</b> — shared cash reserves that the whole server reduces together (Zappa L8, Kryl L20,
      Moreau L40). A raid costs energy, ammo, and heat, and pays a bonus if you reduce a family below its floor. If you
      defeat a family, your family holds its outpost (the outpost pays tribute to the treasury; a rival can take it by
      paying more than your garrison).</p>
      <p><b>The uprising</b> — the NPC families fight back. On some days (shown in advance on the forecast) a family rises up
      (harder to raid, no tribute). At the end, it leaves a held outpost if the garrison is too small — use <b>reinforce</b>
      from the treasury (this also protects against rival families) or lose the turf. If you keep a family weak, a small
      garrison is enough.</p>
      ${R(`GET /v1/city [public] · /v1/world · POST /v1/world/:npcId/raid · /v1/world/:npcId/reinforce · GET /v1/market/prices [public]`)}` },

  { id: 'economy', group: 'Money', title: 'The Economy — $OMR, the Window & the Vault', tag: 'the money cycle',
    html: `<p><b>Currencies:</b> cash (pocket and bank), <b>$OMR</b> (premium, earned by playing, extractable
      on-chain by minted accounts, account-level so it survives death), crates, and ammo. <b>Cash and $OMR do
      not trade</b> — cash is the city's own money and stays here; $OMR comes in from outside and leaves
      through the Exchange window. The main rule: the game records every movement of value on a ledger.</p>
      <p><b>Nothing you do in the game creates $OMR.</b> No wage, no yield, no drip — the game has no printer
      at all. Every $OMR in this city was <b>bought with real money</b>
      by somebody, which is exactly why it is worth taking off them. Three ways to get some: <b>take it</b>
      (a kill loots the victim's liquid $OMR — staked and committed $OMR is safer), <b>earn it</b> from a
      player who pays you in it, or <b>buy it</b>. A nightly job asserts no new $OMR appeared, so it is a
      fact you can check rather than a promise.</p>
      <p><b>The Desk</b> — where you buy it, and where it goes when you spend it. Every $OMR a sink takes
      off you (a vanity burn, an estate tier, a jury, the Window) is <b>not destroyed</b> — it lands on the
      desk's shelf and goes back up for sale. Once a day the desk runs a <b>descending auction</b>: it opens
      high, the price falls for six hours toward a <b>reserve</b>, and whatever does not sell rolls to
      tomorrow. The lot is what came home yesterday, capped at 1% of all the $OMR in player hands so a big
      spending day can't become a dump. <b>The desk can only sell what is on its shelf</b> — it never issues
      anything, so buying here moves no supply: those are somebody else's spent chips changing hands. There is a
      <b>buy side</b> too: if the price falls far enough below the 30-day average the desk restocks off the open
      market rather than waiting for the sinks — paid for out of the trading fees the game's own liquidity earns,
      never by printing. Between the two edges it does nothing, deliberately: a desk that buys and sells at once is
      paying fees to trade with itself. The
      board publishes the shelf, the clock, the price and the exact list of spends that feed it. <b>$OMR
      bought at the desk is FRESH</b> — full early-exit toll for its first 48 hours, like any other.</p>
      <p><b>The Exchange window</b> — the ONE conversion, one way: burn $OMR, receive cash at a published
      rate, from a till that real cash sinks fill. A short till refuses and burns nothing. 5% of every
      redemption goes to the top families (the family yield). <b>Cash can never become $OMR</b> — there is no swap
      and no laundering rail. <b>The early-exit tax:</b> $OMR younger than 48 hours pays
      an extra toll when withdrawn on-chain — 50% at age zero, straight-line to 0% at 48 hours, newest tokens
      priced first, no exemptions.</p>
      <p><b>THE MADE MAN</b> — the recurring subscription. Pay <b>120 $OMR every 30 days</b> and you are <i>made</i>:
      the badge, the upper compound (Country Estate and above), a club of your own, and <b>the pad pays itself</b> —
      your fronts settle their own cash upkeep the moment you touch them, so a stretch away does not leave them cold.
      <b>It buys standing, never power:</b> no earning loop is gated, no odds move, no stat changes, and the pad is not
      discounted by a cent. Operating costs stay in cash — all of them — which is the line that keeps the game free. A
      man who never pays dues runs the whole city at full strength, and can hunt made men for their $OMR. Dues are a
      sink like any other, so they go to <b>the Desk</b> to be sold again rather than being destroyed.</p>
      <p><b>The access stake</b> — the Den's high-stakes room wants a seat (level 30, or the Madame's velvet rope)
      <i>and</i> <b>300 $OMR held in a stake</b>. Held, not spent: it earns nobody anything, and its whole job is to put a
      permanent, visible, lootable float on exactly the players worth hunting.</p>
      ${L(`<b>The Vault (staking)</b> is <b>cheaper cover, not a safe harbour</b>. Nothing makes $OMR
      untouchable. A killer takes <b>50%</b> of a loose or unbonding balance and <b>20%</b> of a
      staked one — committing halves what a bad night costs you without ever making you safe. Your full principal
      always returns, but it <b>unbonds for 6 hours</b> (at the higher idle rate) on the way out. Staking pays the
      staker no yield — $OMR yield goes to THE FAMILIES, through the family yield.`)}
      <p><b>The cycle:</b> cash costs go to the street-tax pool, and every 12 hours the whole take funds the
      Exchange window's till — the cash players spend backs the cash $OMR redeems for. <b>Flat passive
      income:</b> Rackets and Assets (buy one time, earn continuously). <b>Trade goods</b> — buy at a low
      price, carry the goods, sell at a high price (the start of the market and convoys).</p>
      ${R(`GET /v1/window · POST /v1/window/redeem · /stake · /unstake · /rackets|assets/:id/buy · /goods/buy|sell`)}` },

  { id: 'kitchen', group: 'Money', title: 'The Kitchen', tag: 'the offline drug engine',
    html: `${L(`Buy <b>makings</b> → upgrade your <b>lab</b> → <b>cook</b> a batch → <b>collect</b> → <b>deal</b> (or let
      your <b>crew</b> sell while you are offline).`)}
      <p>Your <b>trade rank</b> controls it. There are 8 drugs (unlocked by rank). Cook produces <code>demand×12</code>,
      with a fire risk. <b>Deal</b> income = demand × quality × event × trade bonus, and <b>adds heat</b> (feeds the Law).
      A rank-0 dealer gets a +50% bonus on the corner. <b>Crew</b> (up to 5) sell while you are offline but cost
      <b>$1,200 each hour in wages ("the nut")</b> whether the stash moves or not — if you do not pay for 3 days, the
      crew becomes <b>cold</b> and stops. Offline sales cap at 8 hours' worth however long you are away, but the nut
      runs up to a week, so <b>keep them stocked and check in often</b>: three visits a day earns ~3.6× the wages even
      on the cheapest line, once a day barely clears it, three days away costs more than it makes. You can always
      <b>let one go</b> — square up and one walks, or a cold crew walks for nothing (their buy-in is gone either way).
      <b>Lay low</b> and <b>clean papers</b> reduce heat. Above heat 60, the Bureau can raid.</p>
      ${R(`POST /v1/kitchen/makings/:drugId · /lab/upgrade · /cook · /collect · /deal · /crew/hire · /crew/wages · DELETE /v1/kitchen/crew · /laylow · /cleanpapers`)}` },

  { id: 'business', group: 'Money', title: 'Businesses & Fronts', tag: 'premium upgradeable venues',
    html: `<p>Level-gated, upgradeable places (Laundromat L15 to Casino L58) that earn pocket cash — the
      endgame personal-income engine. <code>GET /v1/catalog</code> lists them. <i>(Fronts do not launder
      anything — cash can't become $OMR anywhere.)</i></p>
      ${L(`<b>buy</b> → <b>collect</b> (24-hour limit) → <b>upgrade</b> → <b>pay the upkeep</b>.`)}
      <p><b>A front wants an owner who shows up, and the terms say so.</b> The till holds only a <b>day</b> of
      takings, but <b>the pad</b> — protection and wages, 20% of hourly income, climbing 5% for every extra
      front you run — keeps running for a <b>week</b> whether you are there or not. So an absent owner can owe
      more than the place can hand back. That is the deal working as written, not a fault. Unpaid for 3 days it
      goes <b>cold</b>: no income, no upgrades, until you square it out of pocket.</p>
      <p><b>Closing up</b> (<code>DELETE /v1/business/:id</code>) is the way out. You can own one of each kind,
      so a cold front you cannot carry holds that slot for the rest of your street's life. Close it and the pad
      stops and the slot frees — permanently, tier and all.</p>
      <p>A front also heats up by <b>earning</b>: bank a day's income and the Bureau's file grows; past the
      threshold a raid seizes the pending take and fines you. Collect often and any raid catches less. A rival
      can <b>shakedown</b> 30% of the pending income in a stat contest, <b>rob</b> 15% of it in a stealth one,
      attempt a <b>hostile takeover</b>, crew an <b>inside job</b> — and a killer who puts your street down can
      <b>SACK</b> your best front and run it themselves. A passive empire is risk capital.</p>
      ${R(`GET /v1/catalog [public] · POST /v1/business/:kind/buy · /business/collect · /upkeep · /:id/upgrade|shakedown · DELETE /v1/business/:id`)}` },

  { id: 'territory', group: 'Money', title: 'Territory Rackets', tag: 'seizable family capital',
    html: `<p>There is one income operation in each district. The family that holds the turf owns it, so wars are about
      income, not only a treasury payment. Two axes: a 5-rung SCALE ladder (Corner $50k up to The Syndicate $15M) and a TYPE chosen at establish (numbers is safe; protection, smuggling and more run hotter and richer but draw Bureau raids).</p>
      <p>A boss or underboss <b>establishes</b> an operation on held turf. Income accrues (24-hour limit) and <b>collects
      to the treasury</b>. You can <b>upgrade</b> it and must pay <b>upkeep</b> (20%, cold after 3 days). <b>When another
      family seizes the turf, the whole operation moves to the victor</b> (plus a war premium of 50% of the build cost).</p>
      ${R(`GET /v1/territory · POST /v1/territory/:districtId/establish|upgrade · /territory/collect · /upkeep`)}` },

  { id: 'families', group: 'Crews & Family', title: 'Families', tag: 'groups, wars, turf, the treasury',
    html: `<p><b>Found</b> a family for $25k at L5 (maximum 20 members); you join a family immediately. Roles: boss /
      underboss / capo / crew. <b>Tribute</b> (cash adds to the weekly task; $OMR goes to the reserve). <b>Wars</b> —
      declare a war for $10k; it runs 30 minutes; the winner takes 20% of the treasury. A fire-kill on a war rival scores 3
      points (a jump scores 1). <b>Turf</b> — seize a district for its benefits and its territory racket.</p>
      <p><b>The watch.</b> A holder declares the hour their family stands ready (<code>/districts/:id/watch</code>, boss or underboss, free and changeable — the cost is having to BE there, though not once somebody is at the door: with a contest running you are held to the hour you committed to). Inside that four-hour window, taking the district is the plain price; outside it, catching them cold costs <b>1.5&times;</b>. A family that never declares a watch is dear at every hour, so declaring is what buys you the cheap window. Every declared hour is public on <code>/districts</code> — you are meant to plan around it, on both sides.</p>
      <p><b>The sealed bid.</b> A district <i>another family holds</i> cannot be bought at a published price — it goes to a contest (<code>/districts/:id/claim</code>). Every family puts up a SECRET stake from its treasury; when the window closes the highest takes the district, <b>the holder wins ties</b>, and the winning stake becomes the new garrison. The board tells you how many families are in and never what any of them put up. A loser gets half of their stake back and forfeits the rest, so committing everything against a family that was never coming is how you lose money without losing a fight. A stake only ever goes up, and it leaves the treasury the moment you make it — you cannot bluff with money you have already spent. The watch still applies: staking outside the holder's declared window costs more just to get in.</p>
      <p><b>The map.</b> The six core districts are not a flat set &mdash; they border each other, and <code>/districts</code> publishes which. Geography prices the door from both sides. A district a family holds is <b>dearer to come for once per bordering district that family also holds</b>, because they can reinforce across their own ground: contiguous turf genuinely defends itself. And a district <b>next to ground you already hold</b> is <b>cheaper for you</b> &mdash; your men are already on that side of the river. That is one foothold discount however many borders you share, not a bonus for encirclement. So "we cannot defend the canal, we do not hold the docks" is now a real sentence, and taking the district next to your own beats taking the rich one across town.</p>
      <p><b>The charter &mdash; what your family IS.</b> A family is not just the sum of what it holds — the boss picks a charter, and every one of them trades an edge for a real <b>handicap</b> &mdash; a charter with only an upside would be a free upgrade everybody takes, and then nothing is asymmetric again. <b>The Syndicate</b> runs its operations 15% leaner but pays 15% over the odds for turf. <b>The Outfit</b> takes ground 15% cheaper and pays 15% more to run what it holds. <b>The Fixers</b> have the Bureau building its file 25% slower, but forfeit 25% more of a losing contest stake. Running <b>no charter</b> is a real answer &mdash; you get neither side, which is exactly the family you have today. The first pick is free; re-founding costs the family reserve and locks for a week afterwards. The two mirrors are deliberate: a Syndicate family and an Outfit family are each good at what the other is bad at, so an alliance between them is complementary rather than just twice as big.</p>
      <p><b>The season has an ending.</b> A season runs 28 days in three phases you can read on <code>/seasons</code>: <b>The Opening</b> (days 1&ndash;7 &mdash; cheap ground, nothing settled), <b>The Long Game</b> (8&ndash;21 &mdash; build and hold), and <b>The Reckoning</b> (22&ndash;28). In the last week held turf is a quarter cheaper to challenge, contests settle in half the time and a holder's watch window is halved, so an incumbent who has been sitting on a district since week one has to defend it while the door is open. Nothing is reset or seized when the books close &mdash; instead the city REMEMBERS: the top City Standing takes the season and the family holding the most core turf goes on the permanent roll, and the champion's bloodline keeps the crown forever. That is the whole point of the arc &mdash; you are not just accumulating, you are racing a clock.</p>
      <p><b>The posts.</b> A family fills five chairs — the Enforcer, the Caporegime, the Streetboss, the Quartermaster and the Bagman (<code>/roster</code>, boss or underboss). <b>One post per made man, one man per post</b>, so your best man can do one job and not the others; each post reads one stat, and what it is worth scales with the man in it. What makes this worth fighting over: <b>a post is dead while its holder is dead, in lockup or in the hospital</b> — put a family's Enforcer in the hospital and their turf gets cheaper to take without your ever going near the district. They can fill the chair again straight away, but only with somebody who was on the STREET; you cannot slide a man across from another post for six hours — nor stand him down and walk him into the next chair, which is the same shuffle — so answering a hit costs the family a second made man. Every post is a bonus, never a requirement — the scarcity is which chairs you fill, not that the baseline moved.</p>
      <p>The reserve buys status: <b>seals</b> (Wax 150 to Obsidian 9000 $OMR) and the <b>Foundation</b> (360 to 18000 $OMR).
      The Foundation is real power: it reduces the RICO conviction chance of every member (only members present when a case
      was filed). The family also holds a legal <b>RWA book</b> that earns a dividend.</p>
      ${R(`POST /v1/gangs · /gangs/:id/join · /leave · /kick · /promote · /gangs/tribute[/omr] · /war/:id · /districts/:id/seize · /gangs/foundation · /gangs/vanity/*`)}` },

  { id: 'commission', group: 'Crews & Family', title: 'The Commission', tag: 'server politics',
    html: `<p>Weekly governance with no money. The <b>top 5 families by this season's standing</b> hold seats. Each seated
      boss or underboss casts one <b>public vote each week</b>. Last week's majority controls this week. The boss of the
      first seat can <b>veto</b> one time each week.</p>
      <p><b>Decrees</b> (8): Open Season (safehouse ×0.5), Pax (no new wars), Amnesty (lay-low ×0.5), Lockdown (convoy
      defense +20), The Levy (the family yield pays the chamber), Smuggler's Moon (port interdiction ×0.75), Open Roads
      (convoys ×0.8 time), Blood Oath (kill loot ×1.25).</p>
      ${R(`GET /v1/commission [public] · POST /v1/commission/vote · /veto`)}` },

  { id: 'den', group: 'Money', title: 'The Den (Casino)', tag: 'cash-only gambling',
    html: `<p><b>CASH ONLY, never $OMR.</b> The server calculates and records every result. The house adds 1% to the
      street-tax pool from real profit only.</p>
      <ul><li><b>Craps</b> — the pass line in one action, 1:1, edge about 1.41%, 1 nerve, up to $250k ($2M high-stakes at
      L30 or higher).</li>
      <li><b>The Numbers</b> — pick a number 0–999, one ticket each day, pays 600:1.</li>
      <li><b>Back-room PvP dice</b> — agree by listing a fade limit; the winner takes the pot minus a 5% rake.</li>
      <li><b>The weekly Fight</b> — one $5k bet on a favorite; the Neon-holding boss can <b>fix</b> it for $50k.</li>
      <li><b>The Track</b> — the greyhounds and the horses. A daily card (6 runners with posted odds, about 15% house
      share); one $50–$10k win bet for each race each day; the winner comes from the daily seed; claim at the LOCKED odds.
      If you own an animal, <b>run it in the card</b> ($5k nomination, up to 2 owner entries a race) — the town bets on
      your animal.</li>
      <li><b>The Futurity</b> — the major race where the Stable meets the Track. Owners <b>nominate</b> their animals ($5k
      fee, up to 8 in the field). The whole town bets <b>parimutuel</b>. At window close, the worker races the field on
      form; the winners share the losing pool minus a 5% share, and the winning owner takes a promoter's purse. (This is
      different from The Stakes — that is owners competing for a pooled buy-in; the Futurity is the crowd betting on the
      field.)</li></ul>
      ${R(`GET /v1/casino [public] · POST /v1/casino/dice · /numbers[/claim] · /fade · /dice/:id · /fight[/claim|/fix] · /track[/claim] · /futurity/nominate/:id · /futurity/bet`)}` },

  { id: 'stable', group: 'Money', title: 'The Stable', tag: 'own the dogs and the ponies',
    html: `<p>Own racing animals. <b>Buy</b> a greyhound ($30k) or a racehorse ($120k) at L6 or higher, <b>train</b> its
      speed, stamina, and heart (cash and energy, with a limit), and <b>race</b> it. Run up to 3. CASH only. An animal dies
      when your character dies; your lifetime wins are an owner record that survives death.</p>
      <ul><li><b>The circuit</b> (PvE) — enter a meet; the fee is lost win or lose; the purse pays only for a win.</li>
      <li><b>Match race</b> (PvP) — race a rival owner's animal of the same kind for a cash wager; the winner takes the pot
      minus a 5% share.</li>
      <li><b>Breed</b> two animals of the same kind into a foal that inherits their form (a head start, not a way to pass
      the limit; both parents retire).</li>
      <li><b>The Stakes</b> — a scheduled major race; enter your animal (a cash buy-in goes into escrow); the worker races
      the field, and the top places share the purse minus a 5% rake. Mickey the Cornerman (the boxing fixer) also trains
      your animals.</li></ul>
      ${R(`GET /v1/stable [+ /v1/leaderboard/stable] · POST /v1/stable/buy · /train/:id · /list/:id · /circuit/:id · /match/:opponentId · /breed · /stakes/:id`)}` },

  { id: 'speakeasy', group: 'Money', title: 'The Speakeasy', tag: 'the social hub',
    html: `<p>One prestige nightclub in each district (open at L15, $750k) — a business, a casino, and a social place. It
      dies when the owner's character dies.</p>
      <p><b>Collect</b> the bar income, <b>upgrade</b> the decor, and <b>name</b> it. <b>Be seen:</b> buy a <b>round</b> (a
      taxed payment to the owner; it adds you to the guest list; 10 visits make a "regular") or buy <b>bottle service</b> (a
      $OMR status payment). The <b>back-room table</b> takes 3% and adds <b>notoriety</b> — above 60 a <b>Prohibition
      raid</b> can happen. Build <b>renown</b> (Nobody to King of the Night). <b>Buy out</b> a club by agreement, or
      <b>stand over</b> it — pay $250k (lost win or lose), win a contest, and force the sale.</p>
      ${R(`GET /v1/speakeasy [public] · POST /v1/speakeasy/:d/round|bottle|table|standover · /collect|upgrade|name|list|unlist · /:d/buy · /decor`)}` },

  { id: 'boxing', group: 'Money', title: 'The Fights (Boxing)', tag: 'manage a fighter',
    html: `<p>Sign up to 3 boxers — a stable (L8, $50k each), <b>train</b> the boxer ($20k + energy, +1 stat, limit 25), <b>list</b> a bout
      limit, and <b>fight</b> other managers. The winner takes 2× the stake minus a 5% rake (a taxed transfer, no new money
      is created); the loser's fighter is in the hospital for 4 hours. The fighter dies when your character dies. Ranks:
      Prospect to Hall of Famer.</p>
      ${R(`GET /v1/boxing · POST /v1/boxing/recruit|train|list · /fight/:opponentId · GET /v1/leaderboard/boxing`)}` },

  { id: 'pvp', group: 'The Underworld', title: 'PvP — Jumps, Hits & Contracts', tag: 'attacking players',
    html: `<p><b>Jump</b> — not lethal; costs energy and ammo; steals up to $25k pocket cash; hospitalizes for about 3
      minutes; scores 1 war point.</p>
      ${L(`<b>The hit:</b> place a <b>search</b> (about 3 hours to be ready) → <b>fire</b> (50 fp or more, 2-hour cooldown,
      +20 heat).`)}
      <p>A fire-<b>kill</b> runs the estate, <b>takes 40% of the cars</b>, <b>loots cash and $OMR</b>, has a 15% chance to
      take one gear piece, swears a <b>vendetta</b>, pays open kill contracts, scores war points, and earns <b>hitman
      reputation</b>. <b>NPC hit</b> — pay a fee (lost win or lose) for a hit the server calculates; no reputation; you
      cannot use it against family, yourself, new players, or safehoused players.</p>
      <p><b>The Contract Board</b> — escrow pots for each (target, kind). Post one (minimum $500; add 18 $OMR to be
      anonymous). A <b>directed</b> named hitman gets an exclusive window (minimum $10k, waived for a KILL contract on a
      vendetta target, a rat, or a welsher). The target can <b>peek</b> (30 $OMR) to name every funder. <b>Hitman reputation</b> is a
      status ladder (Associate to The Undertaker); lifetime reputation survives death.</p>
      ${R(`POST /v1/streets/:id/jump|search|fire|npchit|bounty · DELETE /streets/search · GET /v1/contracts [public] · /contracts/peek · /gangs/contract/:id`)}` },

  { id: 'riskpay', group: 'Risk & Death', title: 'Make Risk Pay — Loot, Safehouse, Revive', tag: 'the payoff and the shields',
    html: `${L(`A player fire-kill loots <b>25% of pocket and in-transit cash</b>, <b>50% of loose and unbonding
      $OMR</b>, and <b>20% of staked $OMR</b>. Only <b>cleared bank cash</b> is safe — staking is cheaper cover,
      never a safe harbour. NPC and mod kills loot nothing.`)}
      <p>This is why banking is a <b>timed</b> action: a deposit is exposed for 2 hours, and unstaked $OMR for 6 hours.
      <b>Safehouse</b> — the cost increases with wealth, for each 4-hour stay; a hit cannot target you, but a jump can. It
      is <b>a shield, not a base</b> (you cannot attack or move money from inside). <b>Bodyguard</b> — absorbs one lethal
      hit (never the guard's own attack). <b>Revive insurance</b> (a real-ETH token) — absorbs a lethal hit completely.</p>
      ${R(`POST /v1/safehouse · /bodyguard/offer · /bodyguard/hire/:guardId`)}` },

  { id: 'law', group: 'The Law', title: 'The Law & RICO', tag: 'the state opponent',
    html: `<p>The state reacts to your <b>heat</b>. The <b>investigation meter</b> builds from high heat and decreases
      slowly: clean → watched → investigation → <b>indicted</b>. <code>GET /v1/law</code> is your record.</p>
      <p><b>Escapes:</b> <b>bribe</b> (scales with wealth), the <b>lawyer retainer</b> ($150k for 3 days, reduces the bust
      and forfeiture), the <b>envelope</b> (90 $OMR for 7 days — halves the meter's gain, doubles its decrease).</p>
      ${L(`<b>The RICO bust</b> takes 30% of pocket and bank — but <b>staked $OMR and minted gear are safe, and it is NOT
      death.</b> If you stay offline past the grace window, the state force-busts you.`)}
      <p><b>Courtroom:</b> plea, buy the jury ($OMR), demand trial. <b>Informants:</b> <b>flip</b> a rival (drop your case,
      add exposure to them, earn the permanent <b>rat</b> badge — a rat loses omertà); <b>witness protection</b> makes you
      untargetable for a short time. The Foundation reduces family convictions; patrol hours increase convictions.</p>
      ${R(`GET /v1/law [public] · POST /v1/law/bribe|retainer|envelope|plea|jury|trial|witpro|flip/:id`)}` },

  { id: 'pen', group: 'The Law', title: 'The Pen (Prison)', tag: 'jail is a place',
    html: `<p>Every Pen action requires that you are jailed. <b>Work the yard</b> (reduces your sentence), the
      <b>commissary</b> (shiv $5k, burner $25k, cutkit $50k), <b>protection</b> (a wealth-scaled no-shank window — a shield, so you
      cannot shank either), <b>bribe the guard</b> (a per-second exit).</p>
      <p><b>The shank</b> — both players jailed; spend a shiv and energy in a muscle contest. It respects revive tokens,
      witness protection, omertà (unless a rat), and protection or the hole. A kill is a real death (no loot, no car loss,
      no reputation); a caught attempt costs the shiv, more time, and <b>the hole</b> (solitary — you cannot act and no one
      can shank you). <b>Yard incidents</b> (Lockdown/Riot/Visit/Toss) change the daily chances. The <b>burner phone</b>
      calls an outside NPC hit. <b>Breakout</b> — solo (a win makes you a WANTED fugitive for 2 days) or co-op (a crew of
      2–4).</p>
      ${R(`GET /v1/pen · POST /v1/pen/work|protection|bribe · /buy/:item · /shank/:id · /burner/:id · /break[/plan] · /break/:id/join|go`)}` },

  { id: 'loans', group: 'The Underworld', title: 'Loan Sharking (The Shylock)', tag: 'the PvP credit market',
    html: `<p><b>Offer</b> escrows the principal ($5k–$1M, rate up to 50%, 1–72 hours; optional <b>directed</b> or
      <b>collateralized</b> by a car). A borrower <b>takes</b> it (one at a time; pledges a car if it is secured). The debt
      is <code>principal × (1+rate)</code>.</p>
      <p><b>Repay</b> (5% vig to the buyback pool). <b>Default and collect</b> — the lender takes the pocket and in-transit
      cash and the pledged car, sends the borrower to hospital, and marks them a permanent <b>welsher</b>. A default also
      marks the borrower <b>WANTED</b> for 3 days (no omertà, a pool bounty if L20 or higher, NPC hunters). <b>Square your
      name</b> ($50k) clears both. A <b>paper market</b> lets you sell an active claim.</p>
      ${R(`GET /v1/loans [public] · POST /v1/loans · /:id/take|repay|cancel|collect|sell|buy|unsell · /loans/square`)}` },

  { id: 'convoys', group: 'The Underworld', title: 'Smuggling Convoys', tag: 'bulk goods on a clock',
    html: `${L(`<b>open</b> (with a first load) → <b>load more</b> (larger than the trunk limit) → <b>depart</b> with
      <b>guards</b> (none/crew $5k/heavy $20k) and optional <b>insurance</b> → travels 30 minutes → <b>collect</b> at the
      destination.`)}
      <p>The route and a value band are announced, never the manifest. <b>Ambush</b> — energy, ammo, and heat in a contest
      of your muscle and speed against the guards and turf defense; a win takes goods up to your trunk limit. Up to 3
      hijacks for each convoy. <b>Tolls</b> — if you collect at another family's docks, you pay 5% to their treasury.
      <b>Insured</b> freight pays for a hijack (with a limit against related-account abuse).</p>
      ${R(`GET /v1/convoys [public] · POST /v1/convoy · /convoy/load · /depart · /cancel · /:id/ambush|collect`)}` },

  { id: 'heists', group: 'The Underworld', title: 'Crew Heists (The Big Score)', tag: 'co-op raids',
    html: `<p>Jobs: a 12-rung ladder from the Corner Store (crew 2, L4) up to the Federal Reserve (crew 5, L80),
      plus the Inside Job (against a player business). Each position is a <b>role</b> (brains/muscle/wheelman/gun), and the calculation uses each member's
      stat for their role.</p>
      ${L(`A leader <b>plans</b> and stakes → the crew <b>join</b> by role → the leader <b>executes</b> (one calculation
      for all).`)}
      <p>Success divides the pot (1.2× for the leader); failure jails everyone. <b>The Rat</b> — any member can inform
      silently; the job fails, the rat leaves with half the stake, the rest get double jail, and the feed only says
      "somebody talked." A standard heist also gives every crew member a small legal <b>AAPL</b> share. The <b>solo Daily
      Score</b> shares an 8-hour cooldown.</p>
      ${R(`GET /v1/heists [public] · POST /v1/heists/plan · /:id/join|leave|rat|execute · POST /v1/heist (solo)`)}` },

  { id: 'market', group: 'The Underworld', title: 'The Black Market', tag: 'player-to-player trade',
    html: `<p><b>Cars sell by auction; goods sell at a fixed price with a district pickup; buy orders (WTB) let buyers name
      a price.</b> (Gear is not here — its market is the GearVault on the blockchain.)</p>
      <ul><li><b>Car auction</b> — one bid, an optional buy-now, a hidden reserve, and an anti-snipe close; an outbid
      bidder gets a refund immediately. A listed car locks.</li>
      <li><b>Goods</b> — a fixed price; the buyer must stand at the listing's dock with trunk space (partial buys).</li>
      <li><b>Buy orders</b> — escrow quantity × price at your dock; sellers fill from the trunk and are paid at once.</li></ul>
      ${R(`GET /v1/market [public] · POST /v1/market · /:id/bid|buy|cancel · /market/order · /:id/fill|claim`)}` },

  { id: 'vendettas', group: 'The Underworld', title: 'Vendettas & Blood Feuds', tag: 'status, no money',
    html: `<p>A player fire-kill swears the victim's family against the killer's family <b>for 7 days</b>; the heir inherits
      the feud. A <b>revenge fire-kill inside the window</b> ends it, pays 2× feared-reputation, and feeds the streets.
      Revenge also <b>removes the directed-contract minimum</b> on a kill contract against your target. NPC and mod kills do
      not swear a feud.</p>
      ${R(`GET /v1/feud/:characterId [public]`)}` },

  { id: 'skills', group: 'The Underworld', title: 'Skills & Specializations', tag: 'your build',
    html: `<p>Three branches, FOUR levels each — the 4th a capstone that unlocks an ACTIVE ability; points <b>come from your level</b> (<code>floor(level/4)</code> plus a small prestige bonus). Skills
      die with the character. Respec for 60 $OMR (shared 24-hour cooldown).</p>
      <ul><li><b>Enforcer</b> — Bruiser (jump/shakedown ×1.08) · Doctor's Friend (heal ×0.75) · Executioner (search ×0.8).</li>
      <li><b>Operator</b> — Fast Talker (lay-low ×0.8) · Fence Network (fence/melt +8%) · Broker (listing fees ×0.5).</li>
      <li><b>Wheelman</b> — Pack Mule (+3 trunk) · Getaway (crime jail ×0.8) · Road Captain (own convoys 20% faster).</li></ul>
      ${R(`GET /v1/skills · POST /v1/skills/:id · /skills/respec`)}` },

  { id: 'trades', group: 'The Underworld', title: 'The Trades (mastery)', tag: 'learn by doing',
    html: `<p>Ten <b>use-XP tracks</b> — every job, deal, race and bout schools its own craft, and nothing
      else does (XP is never bought, gifted or traded). Larceny (crimes) · Wet Work (kills, shanks, duels) ·
      The Cook (batches, deals) · Wheels (boosts, races) · Seamanship (landings, piracy) · The Gambler (the
      Den's games) · Protection (jumps, shakedowns, standovers) · Commerce (goods sales, market fills) ·
      Big Scores (the Score, crew heists) · Fisticuffs (bouts, exhibitions).</p>
      <p>Level = √(xp/15)+1, capped at 50; ranks Green → Made → Craftsman → Expert → <b>Master of the
      Trade</b>. Levels <b>die with the street</b> — the heir keeps <b>25% of each track's XP</b> (the
      bloodline echo) — while a lifetime account-level XP <b>legend</b> survives whole and ranks the trades
      board (Dabbler → A Legend of the Life; agents excluded).</p>
      <p><b>Milestone perks</b> deepen at L10/25/40 — one axis per trade (shorter stints, faster clocks,
      discounted tunes/refits/listings, a higher table limit, harder jumps). Den plays under $1,000 school
      nothing. At <b>level 50</b> choose a permanent trait: <b>Virtuoso</b> (the perk deepens further) or
      <b>Dynast</b> (your heir keeps HALF this trade instead of a quarter). It dies with the street.</p>
      <p><b>Paths v2:</b> six careers — The Gun, The Ledger, The Kitchen, <b>The Wheel, The Shadow, The
      Ring</b> — each with a signature edge, a REAL handicap, and trades that come easy (×1.5 XP) or
      fight you (×0.6). Switching takes the $OMR switch fee and a week between moves.</p>
      <p><b>Stats by use:</b> working a trade also builds its core stat (larceny→cunning, wet work→muscle,
      wheels→speed…) — a small chance per action on the gym's own diminishing curve, hard-capped at
      <b>3 points per rolling day</b>. The gym is still the fast lane.</p>
      ${R(`GET /v1/mastery · GET /v1/leaderboard/trades`)}` },

  { id: 'underworld', group: 'The Underworld', title: 'The Underworld (Fixers)', tag: 'the people you know',
    html: `<p>Six named fixers you build standing with (0–100, for each character): <b>Doc Moretti</b> (survival),
      <b>Vinnie the Match</b> (contracts), <b>Bella Bang-Bang</b> (gear), <b>Big Tuna</b> (trade), <b>The Madame</b> (the
      Den).</p>
      <p>You <b>earn standing when you work with a fixer</b> (limit 25 each day). Levels at 25/60/90 unlock discounts and
      favors. <b>Gifts</b> ($5k, +5) only work below 50 — you must earn the top levels. A <b>daily lead</b>, a <b>weekly
      favor</b>, and an <b>errand chain</b> reward loyalty. A <b>grudge</b> (killing a fixer's friend) limits your level
      until you pay <b>penance</b> ($25k). Your heir inherits 25% of your standings.</p>
      ${R(`GET /v1/underworld · POST /v1/underworld/:npc/gift|penance|favor|errand · /discharge · /gun/:id/sell`)}` },

  { id: 'wire', group: 'The Underworld', title: 'The Wire', tag: 'information you buy',
    html: `<p><b>Wiretap</b> (48 $OMR, 12 hours, up to 5) — shows a rival's Law stage and heat, wealth band, operations,
      WANTED status, and <b>if they are hunting you</b>. <b>Sweep</b> (30 $OMR) removes taps on you (free when clean). The
      <b>Street Wire subscription</b> is a <b>tiered ladder</b> — Street Wire (72 $OMR/7 days: Law
      forecasts, threat data — a count of hunters on you, never a name), The Wire Room (30: plus the war room and 2
      standing watches), The Switchboard (60: plus 5 standing watches). A <b>standing watch</b> (tier 2 or higher) renews a
      tap from your $OMR, so the surveillance runs while you are offline. There are also <b>tradecraft</b> ranks (more
      slots and a read discount), the <b>watchdog</b> (a live alert when a tapped target becomes hot), the <b>bug
      trace</b>, the <b>dossier</b>, <b>disinformation</b>, and the <b>informant</b> (a human source that passes
      disinformation).</p>
      ${R(`GET /v1/wire · POST /v1/wire/tap/:targetId · /wire/sweep · /wire/subscribe {tier} · /wire/watch/:targetId`)}` },

  { id: 'store', group: 'Endgame & Going Legit', title: 'The Store &amp; the Ledger', tag: 'real-money packages',
    html: `<p><b>The Store</b> sells ETH packages that grant <b>only non-currency items</b> (this prevents pay-to-win:
      entitlements, access, cosmetics, status — never cash, $OMR, gear, or power): revive
      bundles, Street Wire, the Season Pass, the Patron badge, and decor. Revenue divides 40% founder / 40% buyback / 20%
      RWA reserve.</p>
      <p><b>Two rails — except for getting Made.</b> PLEX lets you pay in earned $OMR instead of ETH, and every
      package takes it, because none of them gates anything. Becoming Made is the exception: a price payable two ways
      is always the cheaper of the two, and being Made is what unlocks extraction, so it costs ETH at the published
      wave and nothing else sells it. The free road is unchanged: the mission ladder hands you a mint credit outright.
      And where the $OMR for that rail comes from, plainly: nothing mints it. Every $OMR mission pays 1,320 across a
      career and the daily bonus adds 3 a day, against 4,118 for the cheapest thing PLEX sells — so you fund it by
      taking it off somebody, buying it at the desk, or being handed it by your family, not by grinding jobs. <b>The Season Pass / Ledger</b> —
      while active, claim the next of 12 levels each day (titles, revives, energy, small funded $OMR stipends); it is
      account-level and survives death.</p>
      ${R(`GET /v1/store [public] · GET /v1/pass · /pass/claim`)}` },

  { id: 'legit', group: 'Endgame & Going Legit', title: 'Going Legit — what your $OMR does', tag: 'the endgame',
    html: `<p><b>The game sells no shares</b>, real or fictional — there are no tickers to buy and no fund to
      invest in, and any route that would do it says so plainly if you try it. Going legit means what your
      <b>earned $OMR</b> actually does:</p>
      <p><b>Stake it</b> — a held balance climbs the ladder (trunk, energy, nerve, garage, the fence at the top),
      and a committed balance is looted lighter than an idle one when you die. <b>Redeem it</b> at the Window for
      cash. <b>Claim backed ETH</b> at the Vault — real ETH the treasury holds, never more than it holds.
      <b>Get Made</b> and take your $OMR out on-chain. <b>Landmarks</b> — a district plaque still bears your name.</p>
      ${R(`POST /v1/stake · /v1/made · GET /v1/vault · /v1/window · POST /v1/landmarks/:id`)}` },

  { id: 'window', group: 'Endgame & Going Legit', title: 'The Window & the Family Yield', tag: 'the one conversion',
    html: `<p><b>Cash cannot buy $OMR — at any price, by any route.</b> There is no wash house, no laundering at
      your own front, no swap. The two economies are severed on purpose, and the one crossing between them runs
      one way:</p>
      <p><b>The Window</b> — burn $OMR, take in-game cash at a published rate, out of a till the street take fills. It runs
      <b>one way only</b>: cash never becomes $OMR again. The till can run dry, and a short window refuses and
      <b>burns nothing</b> — it is a claim on what was funded, never a promise; there is a daily limit per account. It is
      <b>open</b> precisely because cash cannot buy $OMR: a fixed-rate window alongside a purchase rail would be a money
      pump, so the game runs one or the other, never both.</p>
      <p><b>The Family Yield</b> — the top families by this season's standing split a pot of $OMR into their reserve. The
      pot is fed by <b>the family's cut of every redemption at the Window</b> — a small share of what a player spends goes
      to the families rather than to the house. It is what staking rewards and personal dividends become: standing stops
      being only a badge and starts paying, so tribute, wars and the Commission are worth real money to a family.</p>
      <p><b>The Vault</b> — four streams of real ETH (the DEX sell tax, treasury bonds, the store, game fees) fund the
      protocol: liquidity, the withdrawal reserve, the founder, and a treasury. Burn earned $OMR and you claim a share of
      what that treasury actually holds. It is <b>backed by ETH</b>, on both sides of the book — what the treasury holds and what it can owe you are
      the same asset, so the rule is unbreakable rather than merely watched: <b>the house never owes more than it
      holds</b>, and no price move can change that. The board publishes what came in and from where. Allocation only — nothing is delivered, no sell, no
      cash-out.</p>
      <h3>Why it is built this way</h3>
      <p>Almost every game with a token has the same pipe: farm the game's currency, convert it to the token, sell.
      It is one pipe and everything bad runs through it — farming is unbounded so the token is unbounded, the people
      converting are the people leaving, and the grind gets optimised until it stops resembling a game. The genre's
      most-studied collapse is that pipe running to completion.</p>
      <p><b>OMERTÀ does not have the pipe.</b> Cash cannot become $OMR at any price, by any route. Not a rate tuned
      down or a cap lowered — the conversion does not exist. Four things follow, each a mechanism rather than a
      policy:</p>
      <ul>
        <li><b>Grinding cannot inflate the token.</b> Grinding makes cash, and cash has nowhere to go but back into the
        city. A player who never logs off is a rich player, not a source of new supply.</li>
        <li><b>Supply is enumerated, and the list is shrinking.</b> The ledger checks
        <code>buckets == genesis + mints − burns</code>, and a reason nobody enumerated is itself an alarm. The Street
        city has no scheduled printer, and a nightly check asserts none appears. Two small taps remain — mission rewards
        and the Vig prize pool — and both are enumerated and bounded.</li>
        <li><b>No faucet is the strong version of the promise.</b> With nothing paying $OMR for play, in-game $OMR can
        never exceed what was deposited — so "you can only take out what somebody put in" stops being a rule the game
        enforces and becomes an arithmetic fact about the ledger.</li>
        <li><b>The one conversion runs the other way, on money that already exists.</b> The Window burns $OMR and pays
        cash from a till real sinks filled. A short till refuses and burns nothing.</li>
      </ul>
      <p><b>Why this game.</b> OMERTÀ is about things being lost — death is permanent, your pocket is lootable, your
      empire is seizable. A token you can farm and dump is structurally a way to opt out of that: convert your position
      into something the game cannot take, and leave. With the pipe cut, effort becomes $OMR only by being paid for
      playing well, and $OMR becomes power only by being burned. The currency cannot be an exit from the risk the game
      is about.</p>
      <p><b>And there is no hiding place, by design.</b> The obvious way to soften a risk economy is a vault nobody can
      reach into, and this game deliberately does not have one. What it has instead is a CHOICE with a real trade-off:
      money doing nothing is the most exposed thing you own (a killer takes half), money committed to a stake is cheaper
      to be caught with (a fifth) — and neither is free. Both answers help the city: committing keeps the currency
      moving, staying liquid keeps hunters in business. On top of that, unstaking exposes the principal for six hours,
      staking pays no personal yield (that goes to families), and every route out passes an early-exit toll starting at
      50% and decaying over 48 hours.</p>
      ${R(`GET /v1/window · POST /v1/window/redeem · GET /v1/yield [public] · GET /v1/vault · POST /v1/vault/claim`)}` },

  { id: 'estate', group: 'Endgame & Going Legit', title: 'The Estate & Auction House', tag: 'status sinks',
    html: `<p><b>The Estate</b> — a deep, account-level (death-proof) $OMR cost and a home: buy levels (Safe House 40 to The
      Compound 36000 $OMR), unlock features, name it, and show <b>trophies</b> from your real holdings.</p>
      <p><b>The Auction House</b> — a competitive weekly $OMR cost: 3 unique items each week; the highest <b>$OMR bid
      wins</b>, and <b>the winning bid is sunk</b> — it leaves you for good and goes to the house, which sells it back at the daily auction. Outbid bidders get a refund immediately; won items survive death.</p>
      ${R(`GET /v1/estate · POST /v1/estate/upgrade|feature/:id|name · GET /v1/auction [public] · POST /v1/auction/:lotId/bid`)}` },

  { id: 'chain', group: 'The Chain', title: 'The Chain — Withdrawal & Bonds', tag: 'settling on the blockchain (not active)',
    html: `<p>OMERTÀ settles on Robinhood Chain (an EVM L2). The blockchain layer is built but <b>not active until
      mainnet</b> (behind legal and audit approval). The off-chain game is authoritative; the blockchain settles
      withdrawals and ownership. The ONE place new $OMR is created on-chain is bonds — minted at bond
      time inside hard walls (a daily cap, a discount ceiling, a rate ceiling).</p>
      <p><b>Withdraw $OMR</b> — burns your $OMR and signs a voucher <b>only if the reserve can back it</b> (if not, it
      waits in a queue). <b>Only a minted account can extract.</b> <b>Gear withdrawal</b> mints your gear as an NFT (it
      leaves the game). <b>Wallet link</b> is SIWE; <b>character mint</b> makes a trial character permanent — a one-off
      ETH fee on a published schedule (five waves, 0.01 at the founding wave, never above 0.05; the Store shows
      the current one), or a mint credit earned outright off the mission ladder.
      <b>Bonds</b> — deposit ETH for discounted $OMR that vests over time; the ETH deepens the pool and feeds the
      <b>Vig</b> (the real-revenue engine that backs withdrawals). Bonds are the one mint — new $OMR is issued at
      bond time inside hard on-chain walls (daily cap, discount ceiling, rate ceiling). Every withdrawal pays a
      small exit toll, steeper on tokens younger than 48 hours.</p>
      ${R(`POST /v1/withdraw · /gear/:id/withdraw · /wallet/challenge|verify · /character/mint · GET /v1/bonds [public] · /bonds/:id/claim`)}` },

  { id: 'growth', group: 'Reference', title: 'Growth — Paths, Missions, the First Week', tag: 'progression support',
    html: `<p><b>Paths</b> (L5, $10k; switch for 150 $OMR + a 7-day cooldown) — SIX careers (The Gun, The Ledger,
      The Kitchen, The Wheel, The Shadow, The Ring), each with a signature edge, a real handicap, and trades that
      come easy (×1.5 mastery XP) or fight you (×0.6). <b>Missions</b> — 29 pay-once jobs
      (cash + respect + sometimes $OMR + titles). <b>Daily contracts</b> — 3 each day plus an all-three $OMR bonus. <b>The
      Daily Score</b> is the best repeatable at a low level (8-hour cooldown).</p>
      <p><b>Referrals</b> (your code is your character NAME) — a recruit qualifies after 4 conditions; milestones pay cash
      and titles. <b>THE CREW BONUS</b> is the real reward: every qualified recruit makes you earn <b>respect faster</b>,
      scaled by how far THEY have got (level 5 → +5%, level 10 → +10%, level 15 → +15%, in steps), applied to every
      respect you earn anywhere. It is live — it rises as they rise and stops when they stop — capped, and not a
      currency, so it cannot be sold or given away. <b>Referrals pay in cash and in respect, never in $OMR.</b> A recruit names who sent them in the <b>"who sent you?"</b> field at character creation
      (a shared link pre-fills it) or from the <b>"Did someone send you?"</b> card on Start Here in their first
      3 days — wrong capitalization is forgiven, and it's set once. <b>The spark</b> pays a small early bonus at L3 and 10 jobs; <b>tier-2 "the family tree"</b> pays a
      one-time $5k finder's fee when your recruit brings in their own qualified recruit (cash only, depth 2); a
      <b>recruitment drive</b> can multiply referral CASH for a time. The <b>Recruiters</b> boards rank the top recruiters
      and families. <b>My Profile</b> (the "My Profile" screen, <code>GET /v1/profile</code>) is your personal page —
      mood, member-since, generation, family, honor, kills, your <b>Top 8</b> recruits with their status, and
      <b>The Take</b>: exactly what recruiting has paid you in cash and $OMR, read straight from the ledger, with
      copy-the-link and share buttons. <b>Spread the Word</b> — three daily social tasks pay a small amount of cash ($300; $500 for all three; a post must STAND 4 hours before it pays — post-and-delete pays nothing)
      and share your referral code. <b>The First Week</b> — an 8-task checklist that pays cash to teach the game, with a
      final bonus. <b>The Coach</b> (the ▸ line on your sheet) always names your best next action.</p>
      ${R(`POST /v1/path · /missions/:id · GET /v1/daily · /daily/:id/claim · POST /v1/heist · GET /v1/onboard · /onboard/:taskId/claim · GET /v1/social · /v1/social/:taskId/claim · GET /v1/leaderboard/recruiters`)}` },

  { id: 'megaproject', group: 'The City & the World', title: 'The Megaproject', tag: 'the city builds a monument',
    html: `<p>The whole server pools value toward ONE announced monument (the City tab). Contribute <b>cash</b>,
    <b>trade goods</b> from your trunk (at catalog base value), or <b>$OMR</b> (at a fixed $500 rate). Every
    contribution is a <b>burn</b> — this buys glory, not power. The city sees milestones at 25/50/75%; when the
    monument completes it joins <b>the skyline</b> forever, and the plaque records every contributor — tiered
    <b>The Architect</b> (top brick) → Foreman → Patron → Builder. The plaque is account-level: your dynasty keeps
    its glory through death. Monuments rise in order: the Cathedral Restoration → the Grand Casino → the
    Founder's Bridge → the Colossus of the Docks.</p>` },
  { id: 'deferred4', group: 'Money & Legit', title: 'The Household, Motions, the House Window & Ring Poker', tag: 'staff wages, the levy, the last-resort lender, real hold\u2019em',
    html: `<p><b>The Household &amp; the Gala</b> (Estate) \u2014 hire staff who draw daily $OMR wages on one
    household clock; stiff them a week and they WALK. With a Butler and a square book, a tier-2+ house throws a
    <b>gala</b> \u2014 a big burn that opens the doors for four hours; every guest lands on your list. The great
    houses rank on their $OMR sunk.</p>
    <p><b>Motions before the Commission</b> (Family) \u2014 a seated boss stakes a $100k treasury deposit to put a
    decree on the ballot; when motions exist, ONLY they are votable. The enacted motion refunds, the rest forfeit.
    The fifth decree, <b>THE LEVY</b>, redirects the family yield to the seated chamber, by seat, instead of the standing board.</p>
    <p><b>The House Window</b> (Shylock) \u2014 the lender of last resort: 35% for 24h, level-scaled cap, and it
    lends ONLY what its vig-fed pool holds. Default and the house always collects \u2014 seizure, the welsher
    mark, the WANTED books.</p>
    <p><b>Ring Poker</b> (the Den) \u2014 real multi-way hold'em with betting streets. The table holds the money:
    cash moves only when you sit or stand; raises cap at the shortest stack; a 90s clock folds stallers; the rake
    comes off the pot. Die at the table and your stack burns. The tournament also runs in <b>BRACKET</b> format
    \u2014 rounds of heats down to a final.</p>` },
  { id: 'slate456', group: 'Risk & Death', title: 'The Dueling Circuit, Clue Scrolls & the Season', tag: 'the ladder, the trail, the twist',
    html: `<p><b>The Dueling Circuit</b> (Wet Work) — the ranked ladder. List yourself with a stake cap,
    challenge anyone listed: your BUILD fights (stats + gear), the stake changes hands minus the 5% rake, and
    your <b>ELO</b> moves. Seasonal (resets every 28 days), dies with your street; lifetime wins are a dynasty
    legend. Rematch-farming the same rival pays less each day.</p>
    <p><b>Clue Scrolls</b> (Streets) — a rare drop on any successful job starts a treasure trail: 3–5 riddles,
    each naming a district (sometimes an hour of day). Travel there and DIG. The last dig opens a <b>casket</b>
    and counts on your lifetime diggers' legend. One hunt at a time; after a casket the streets go quiet 8h.</p>
    <p><b>The Season</b> (the City board) — each 28-day season may carry ONE rule twist from a public pool
    (The Crackdown, Blood in the Streets, The Gold Rush — or a vanilla Dead Quiet). The City banner tells you
    the season's law; it snaps back at rollover.</p>` },
  { id: 'phone', group: 'Reference', title: 'The Cellphone & the Troll Box', tag: 'talking',
    html: `<p><b>The Cellphone</b> (the 📱 button up top) is your personal inbox + direct messages. The
    <b>inbox</b> shows what happened TO you — a convoy jacked, a contract posted on your head, a fee credited.
    <b>The line</b> is player-to-player DMs: pick anyone off the streets and talk. Threads live on your
    ACCOUNT, so they survive death — the heir picks up the phone. 240 characters a line, one message every
    2 seconds, 30-day retention. No money ever rides a message — a "deal" in DMs still has to happen through
    the game's real systems. <b>Blocked lines</b>: block a pest from their thread and they get a dead tone
    (they'll know); the block follows their bloodline until you lift it, and it only mutes their mouth —
    game events still reach you. A 📱 button rides every street in Wet Work, and the mobile thumb bar
    has a cell stop with the unread badge.</p>
    <p><b>The Troll Box</b> (the Live Feed side panel) is public city chat, plus a family-only room. The family
    room shows only messages from AFTER you joined — you can't infiltrate a family and read its back-chat.</p>` },
  { id: 'streetlife', group: 'Reference', title: 'Street Life', tag: 'the corner · the black book · the call',
    html: `<p><b>Word on the Street</b> — every district posts 3 daily tasks (the same board for everyone
    standing there; one CONFLICT job — a jump or a bust — guaranteed). Take a job WHERE it's posted, do the
    work anywhere it happens, collect the envelope back at the district: $400 + 15 respect each, at most 5
    envelopes a day across the whole city. Only work done AFTER you take a job counts.</p>
    <p><b>The block's standing job</b> — work the same district's corner on <b>3 separate days</b> and it pays a
    <b>$1,500 + 40 respect</b> bonus on the last one. A second envelope there today still pays but does not move
    the chain: it is days of showing up, not a busy afternoon.</p>
    <p><b>The Black Book</b> — phone numbers are EARNED, never free. Three ways to a line: <b>meet them</b>
    (any completed face-to-face — a jump, a hire, a fade, a duel — hands BOTH sides the other's number),
    <b>tap them</b> (a wiretap or dossier earns it one-way — they never get yours), or <b>answer</b>
    (whoever rings you reveals their own number). The phone's compose list IS your book; a stranger's 📱
    reads 📵 until you earn the line. How many lines you hold is a <b>rank</b>, and there is a board for the
    busiest books in the city.</p>
    <p><b>Standing</b> — every job you finish for one contact deepens that relationship (a stranger → a regular →
    a friend → family), and a contact who knows you asks for <b>bigger loads and tips better</b>. The money still
    comes from their own pocket, so one who cannot cover the bigger ask simply does not call.</p>
    <p><b>The Call</b> — contacts you've met ring you with paid requests: bring freight to their district
    (base × 1.15) or come see them (a tip). The pay comes from THE CONTACT'S OWN pocket — a real transfer,
    never minted — and an unanswered request lapses in a day.</p>
    <p><b>The Favor</b> — the player-posted call. Put up to 3 requests on the wire: N units of a trade good
    delivered to a district, with the pay <b>escrowed the moment you post it</b>. Everyone holding your number
    sees it; whoever hauls the freight there takes the money on the spot, minus a 2% house cut. That escrow is
    the point — a runner can never cross town and find your pocket empty. Pull it back any time and the money
    returns; nobody runs it in a day and it returns by itself. But escrow is cash outside your pocket, so it is
    NOT a hiding place: no posting from a safehouse, and a killer takes a quarter of every open favor.</p>` },
  { id: 'reference', group: 'Reference', title: 'Quick Reference', tag: 'the things to remember',
    html: `<h3>What is safe from looting</h3><p>Cleared <b>bank</b> cash · <b>staked</b> $OMR · <b>minted (on-chain)</b>
      gear · your account-level <b>estate / prestige</b>. Everything in your pocket is at risk when you die.</p>
      <h3>Status marks on your sheet</h3><p><b>wanted</b> (hunted, even by family — square it) · <b>welsher</b>
      (defaulted, cannot borrow — square it) · <b>indicted</b> (a RICO case — go to The Law) · <b>in transit</b> (a deposit
      is not cleared — another player can steal it) · <b>unbonding</b> ($OMR is not liquid — another player can steal it) ·
      <b>safehouse</b> (untargetable, but you cannot act) · <b>hospital / lockup / the hole</b> (wait).</p>
      <h3>Currencies</h3><p><b>Cash</b> (pocket can be stolen, bank is safe) · <b>$OMR</b> (premium, earned by
      playing — never converted from cash — extractable after minting, account-level, so it survives death;
      staked is safe, liquid can be stolen) · <b>crates</b> (guns/gear) ·
      <b>ammo</b> (jumps/fires/raids).</p>
      <h3>Do not confuse these</h3><p>A flat Racket/Asset "Speakeasy/Nightclub/Casino" (buy-once income) is NOT a Business
      casino/nightclub (an upgradeable front); NOT The Speakeasy (the deep club system); NOT The Den (the games).</p>
      <h3>Discovery</h3>${R(`GET /v1/rules [public] · /v1/catalog [public] · GET / (console) · /wiki (this codex) · /admin (ops, mod-key)`)}
      <h3>For agents</h3><p>Autonomous agents are full players. Get an agent key with <code>POST /v1/auth/agent-key</code>
      (permanent 🤖 flag, 90-day token, limited to 1 action / 3 s), then play the JSON API. Agents compete on SKILL —
      the anti-abuse sources (referrals, social tasks, assassin reputation) are for humans only; every economic loop is
      open.</p>
      ${R(`GET /agents (agent quickstart) · /openapi.json (OpenAPI 3.1) · /llms.txt (discovery index)`)}
      ${R(`GET /v1/opportunities (the Opportunity Board — open actions and skill loops, ranked by estimated value) · /v1/leaderboard/agents (the agent leaderboard)`)}` },
];

const GROUP_ORDER = ['Start','The Basics','Money','Money & Legit','Crews & Family','The City & the World',
  'The Underworld','Risk & Death','The Law','Endgame & Going Legit','The Chain','Reference'];

function render() {
  const doc = document.getElementById('doc');
  const nav = document.getElementById('navlist');
  doc.innerHTML = ''; nav.innerHTML = '';
  const groups = {};
  for (const s of SECTIONS) (groups[s.group] = groups[s.group] || []).push(s);
  const order = [...GROUP_ORDER.filter((g) => groups[g]), ...Object.keys(groups).filter((g) => !GROUP_ORDER.includes(g))];
  let n = 0;
  for (const g of order) {
    const gl = document.createElement('div'); gl.className = 'grp'; gl.textContent = g; nav.appendChild(gl);
    for (const s of groups[g]) {
      const a = document.createElement('a'); a.className = 'item'; a.href = '#' + s.id; a.dataset.id = s.id;
      a.textContent = s.title; nav.appendChild(a);
      const sec = document.createElement('section'); sec.id = s.id;
      n += 1;
      const num = String(n).padStart(2, '0');
      sec.innerHTML = `<span class="num">${num} — ${g}</span><h2>${s.title}</h2>`
        + `${s.tag ? `<div class="tag">${s.tag}</div>` : ''}${s.html}`;
      doc.appendChild(sec);
    }
  }
  wireScroll();
}
function wireScroll() {
  const links = [...document.querySelectorAll('#nav a.item')];
  const secs = [...document.querySelectorAll('#doc section')];
  const io = new IntersectionObserver((ents) => {
    for (const e of ents) if (e.isIntersecting) {
      links.forEach((l) => l.classList.toggle('on', l.dataset.id === e.target.id));
      // …and keep the active item in view: the nav is far taller than one screen, so without this
      // the reader's place in the contents silently scrolls out of sight.
      const on = links.find((l) => l.classList.contains('on'));
      if (on) {
        const nav = document.getElementById('nav');
        const r = on.getBoundingClientRect(), nr = nav.getBoundingClientRect();
        if (r.top < nr.top + 8 || r.bottom > nr.bottom - 8) {
          nav.scrollTop += r.top - nr.top - nav.clientHeight / 3;
        }
      }
    }
  }, { rootMargin: '-40% 0px -55% 0px' });
  secs.forEach((s) => io.observe(s));
}
document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  let hits = 0;
  for (const sec of document.querySelectorAll('#doc section')) {
    const hit = !q || sec.textContent.toLowerCase().includes(q);
    if (hit) hits += 1;
    sec.style.display = hit ? '' : 'none';
    const link = document.querySelector(`#nav a.item[data-id="${sec.id}"]`);
    if (link) link.classList.toggle('hide', !hit);
  }
  // A search that hides everything and says nothing reads like a broken page.
  let none = document.getElementById('nohit');
  if (!none) {
    none = document.createElement('div'); none.id = 'nohit'; none.className = 'empty';
    document.getElementById('doc').appendChild(none);
  }
  none.innerHTML = hits ? '' : `<h2 style="color:#6b6357">Nothing matches</h2>`
    + `<p class="lead">The codex has no section mentioning “${q.replace(/[<>&]/g, '')}”. Try a shorter word.</p>`;
  none.style.display = hits ? 'none' : '';
});

// the way back up, once the reader is deep enough to want one
const totop = document.getElementById('totop');
addEventListener('scroll', () => totop.classList.toggle('show', scrollY > 700), { passive: true });

render();
</script>
</body>
