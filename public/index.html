<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMERTÀ — the city</title>
<style>
  :root {
    --bg: #0b0b0e; --panel: #131318; --panel2: #17171e; --line: #26262f;
    --ink: #d6d2c4; --dim: #7d7a6f; --neon: #e8b34b; --blood: #c0392b;
    --ok: #5fa96b; --bad: #d16055; --cold: #5b84a8;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; }
  code, .mono, textarea, input, select, button { font-family: 'Courier New', monospace; }
  a { color: var(--neon); }

  #top { display: flex; align-items: baseline; gap: 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  #top h1 { font-size: 20px; margin: 0; letter-spacing: 6px; color: var(--neon); font-weight: normal; }
  #top .sub { color: var(--dim); font-size: 12px; }
  #whoami { margin-left: auto; color: var(--dim); font-size: 13px; }
  #whoami b { color: var(--ink); }

  #layout { display: grid; grid-template-columns: 300px 1fr 320px; gap: 12px; padding: 12px 16px; }
  @media (max-width: 1100px) { #layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .panel h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); font-weight: normal; }

  /* the sheet */
  #sheet .money { font-size: 22px; color: var(--neon); }
  #sheet .row { display: flex; justify-content: space-between; margin: 3px 0; font-size: 13px; }
  #sheet .row .k { color: var(--dim); }
  .bar { height: 7px; background: #22222a; border-radius: 4px; overflow: hidden; margin: 2px 0 8px; }
  .bar i { display: block; height: 100%; background: var(--neon); }
  .bar.health i { background: var(--ok); } .bar.heat i { background: var(--blood); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); }
  .chip.bad { border-color: var(--blood); color: var(--bad); }
  .chip.good { border-color: var(--ok); color: var(--ok); }
  .chip.cold { border-color: var(--cold); color: var(--cold); }

  /* tabs */
  #tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 10px; }
  #tabs button { background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    padding: 6px 12px; cursor: pointer; border-radius: 4px 4px 0 0; font-size: 12px; }
  #tabs button.on { color: var(--neon); border-bottom-color: var(--panel); }
  .tab { display: none; } .tab.on { display: block; }

  button.act { background: #1d1d25; border: 1px solid var(--line); color: var(--ink);
    padding: 6px 10px; margin: 2px; cursor: pointer; border-radius: 4px; font-size: 12px; }
  button.act:hover { border-color: var(--neon); color: var(--neon); }
  button.act:disabled { opacity: .35; cursor: default; }
  input, select, textarea { background: #0f0f13; border: 1px solid var(--line); color: var(--ink);
    padding: 6px 8px; border-radius: 4px; font-size: 12px; }
  textarea { width: 100%; min-height: 110px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px; font-size: 12px; }
  .card .t { color: var(--ink); } .card .d { color: var(--dim); font-size: 11px; margin: 3px 0; }

  /* feed */
  #feed { max-height: 75vh; overflow-y: auto; font-size: 12px; }
  #feed .ev { border-bottom: 1px dashed var(--line); padding: 5px 0; }
  #feed .ev .ch { color: var(--cold); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  #feed .ev.me .ch { color: var(--neon); }
  #resp { white-space: pre-wrap; font-size: 11px; color: var(--dim); max-height: 260px; overflow: auto;
    background: #0f0f13; border: 1px solid var(--line); border-radius: 4px; padding: 8px; }

  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--neon); color: var(--ink);
    padding: 10px 18px; border-radius: 6px; font-size: 13px; display: none; z-index: 10; max-width: 70vw; }
  #toast.bad { border-color: var(--blood); }

  /* auth screens */
  .center { max-width: 460px; margin: 12vh auto; text-align: center; }
  .center h1 { letter-spacing: 10px; color: var(--neon); font-weight: normal; }
  .center p { color: var(--dim); }
  .hidden { display: none !important; }
  label.f { display: block; text-align: left; color: var(--dim); font-size: 11px; margin: 8px 0 2px; }
</style>
</head>
<body>

<div id="screen-auth" class="center hidden">
  <h1>OMERTÀ</h1>
  <p>The city doesn't know your name yet. Good. Keep it that way.</p>
  <button class="act" id="btn-guest" style="font-size:14px;padding:10px 24px">ENTER AS A GHOST</button>
  <p class="sub" style="font-size:11px;color:var(--dim)">A guest account — upgrade to X / Privy later without losing the street.</p>
</div>

<div id="screen-create" class="center hidden">
  <h1>A NAME</h1>
  <p>Every street name is a debt someone eventually collects.</p>
  <input id="new-name" placeholder="street name" style="width:260px;font-size:15px">
  <div style="margin-top:10px"><button class="act" id="btn-create" style="font-size:14px;padding:10px 24px">STEP OUT</button></div>
</div>

<div id="screen-main" class="hidden">
  <div id="top">
    <h1>OMERTÀ</h1><span class="sub">the city breathes</span>
    <span id="whoami"></span>
    <button class="act" id="btn-logout">burn the papers</button>
  </div>
  <div id="layout">

    <div>
      <div class="panel" id="sheet">
        <h2>The Sheet</h2>
        <div id="sheet-body">…</div>
        <div style="margin-top:8px">
          <button class="act" data-do="POST /v1/heal">heal</button>
          <button class="act" data-do="POST /v1/checkin">check in</button>
          <button class="act" id="btn-refresh">refresh</button>
        </div>
      </div>
      <div class="panel" style="margin-top:12px">
        <h2>Last Word</h2>
        <div id="resp">—</div>
      </div>
    </div>

    <div class="panel">
      <div id="tabs"></div>
      <div id="tabbodies"></div>
    </div>

    <div class="panel">
      <h2>The Wire <span id="ws-dot" style="color:var(--bad)">●</span></h2>
      <div id="feed"></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const el = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
  const fmt = (n) => Number(n).toLocaleString('en-US');
  let token = localStorage.getItem('omerta_token') || null;
  let me = null, rules = null, ws = null;

  // ── plumbing ──
  async function api(method, path, body) {
    // content-type only when a body rides along — Fastify 400s an empty JSON-typed body
    const r = await fetch(path, { method,
      headers: { ...(body !== undefined ? { 'content-type': 'application/json' } : {}),
        ...(token ? { authorization: 'Bearer ' + token } : {}) },
      body: body === undefined ? undefined : JSON.stringify(body) });
    let j = null; try { j = await r.json(); } catch { j = { raw: await r.text?.() }; }
    $('#resp').textContent = `${method} ${path}\n` + JSON.stringify(j, null, 2);
    return { code: r.status, body: j };
  }
  function toast(msg, bad = false) {
    const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : '';
    t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3200);
  }
  async function act(method, path, body) {
    const r = await api(method, path, body);
    if (r.code >= 400) toast(r.body?.message || r.body?.error || `${r.code}`, true);
    else {
      const b = r.body || {};
      toast(b.message || (b.win === true ? 'WIN' : b.win === false ? 'bust' : null) || 'done.');
    }
    await refresh();
    return r;
  }

  // ── screens ──
  function show(id) {
    for (const s of ['screen-auth', 'screen-create', 'screen-main']) $('#' + s).classList.add('hidden');
    $('#' + id).classList.remove('hidden');
  }

  async function boot() {
    if (!token) return show('screen-auth');
    const r = await api('GET', '/v1/me');
    if (r.code === 401) { token = null; localStorage.removeItem('omerta_token'); return show('screen-auth'); }
    if (r.code === 404 || r.body?.error === 'no_character') return show('screen-create');
    me = r.body.character || r.body;
    if (!rules) rules = (await api('GET', '/v1/rules')).body;
    show('screen-main'); renderSheet(); buildTabs(); connectWs();
  }

  $('#btn-guest').onclick = async () => {
    const r = await api('POST', '/v1/auth/guest');
    if (r.body?.token) { token = r.body.token; localStorage.setItem('omerta_token', token); boot(); }
    else toast(r.body?.message || 'no dice', true);
  };
  $('#btn-create').onclick = async () => {
    const r = await api('POST', '/v1/character', { name: $('#new-name').value.trim() });
    if (r.code < 400) boot(); else toast(r.body?.message || r.body?.error, true);
  };
  $('#btn-logout').onclick = () => { localStorage.removeItem('omerta_token'); location.reload(); };
  $('#btn-refresh').onclick = () => refresh();

  async function refresh() {
    const r = await api('GET', '/v1/me');
    if (r.code < 400) { me = r.body.character || r.body; renderSheet(); }
  }

  // ── the sheet ──
  function bar(cls, v, max) {
    const pct = Math.max(0, Math.min(100, 100 * v / Math.max(1, max)));
    return `<div class="bar ${cls}"><i style="width:${pct}%"></i></div>`;
  }
  function renderSheet() {
    if (!me) return;
    $('#whoami').innerHTML = `<b>${me.name}</b> · gen ${me.generation} · lvl ${me.level} · ${me.loc}` +
      (me.gang ? ` · <span style="color:${me.gang.color || 'var(--dim)'}">${me.gang.tag}</span>` : '');
    const chips = [];
    if (me.jailSeconds > 0) chips.push(['bad', `LOCKUP ${Math.ceil(me.jailSeconds / 60)}m`]);
    if (me.hospSeconds > 0) chips.push(['bad', `HOSPITAL ${Math.ceil(me.hospSeconds / 60)}m`]);
    if (me.safeSeconds > 0) chips.push(['cold', `SAFEHOUSE ${Math.ceil(me.safeSeconds / 60)}m`]);
    if (me.wanted) chips.push(['bad', 'WANTED']);
    if (me.welsher) chips.push(['bad', 'WELSHER']);
    if (me.law?.indicted) chips.push(['bad', 'INDICTED']);
    if (me.law?.rat) chips.push(['bad', 'RAT']);
    if (me.law?.stage && me.law.stage !== 'clean') chips.push(['cold', me.law.stage.toUpperCase()]);
    if (me.guardedBy) chips.push(['good', 'GUARDED']);
    $('#sheet-body').innerHTML = `
      <div class="money">$${fmt(me.cash)}</div>
      <div class="row"><span class="k">bank</span><span>$${fmt(me.bank)}${me.bankInTransit ? ` <span style="color:var(--cold)">($${fmt(me.bankInTransit)} in transit)</span>` : ''}</span></div>
      <div class="row"><span class="k">$OMR</span><span>${fmt(me.omr)} liquid · ${fmt(me.staked)} staked</span></div>
      <div class="row"><span class="k">respect</span><span>${fmt(me.respect)} (lvl ${me.level})</span></div>
      <div class="chips">${chips.map(([c, t]) => `<span class="chip ${c}">${t}</span>`).join('')}</div>
      <div class="row"><span class="k">energy</span><span>${me.energy}/${me.maxEnergy}</span></div>${bar('', me.energy, me.maxEnergy)}
      <div class="row"><span class="k">nerve</span><span>${me.nerve}/${me.maxNerve}</span></div>${bar('', me.nerve, me.maxNerve)}
      <div class="row"><span class="k">health</span><span>${me.health}/100</span></div>${bar('health', me.health, 100)}
      <div class="row"><span class="k">heat</span><span>${me.heat}</span></div>${bar('heat', me.heat, 100)}
      <div class="row"><span class="k">muscle / cunning / speed</span><span>${me.eff.muscle} / ${me.eff.cunning} / ${me.eff.speed}</span></div>
      <div class="row"><span class="k">gun</span><span>${me.gun || '—'}</span></div>
      <div class="row"><span class="k">ammo / crates</span><span>${fmt(me.ammo)} / ${fmt(me.cb)}</span></div>
      <div class="row"><span class="k">cars</span><span>${(me.cars || []).length}</span></div>`;
  }

  // ── tabs ──
  const TABS = { streets: 'Streets', pvp: 'Wet Work', kitchen: 'The Kitchen', family: 'The Family',
    market: 'Black Market', law: 'The Law', city: 'The City', den: 'The Den', deck: 'Everything Else' };
  function buildTabs() {
    const tabs = $('#tabs'), bodies = $('#tabbodies');
    if (tabs.childElementCount) return;
    for (const [id, label] of Object.entries(TABS)) {
      const b = el(`<button data-tab="${id}">${label}</button>`);
      b.onclick = () => { setTab(id); };
      tabs.appendChild(b);
      bodies.appendChild(el(`<div class="tab" id="tab-${id}"></div>`));
    }
    renderStreets(); renderCity(); renderDen(); renderDeck();
    setTab('streets');
  }
  function setTab(id) {
    for (const b of $('#tabs').children) b.classList.toggle('on', b.dataset.tab === id);
    for (const t of $('#tabbodies').children) t.classList.toggle('on', t.id === 'tab-' + id);
    if (id === 'city') renderCity();
    if (id === 'den') renderDen();
    if (id === 'kitchen') renderKitchen();
    if (id === 'family') renderFamily();
    if (id === 'market') renderMarket();
    if (id === 'pvp') renderPvp();
    if (id === 'law') renderLaw();
  }
  const drugName = (id) => (rules?.drugs || []).find((d) => d.id === id)?.name || id;
  const goodName = (id) => (rules?.goods || []).find((g) => g.id === id)?.name || id;
  const mins = (s) => s > 3600 ? Math.floor(s / 3600) + 'h' + Math.ceil((s % 3600) / 60) + 'm' : Math.ceil(s / 60) + 'm';

  // ── THE KITCHEN: lab → makings → cook → collect → deal, the crew, heat management ──
  async function renderKitchen() {
    const t = $('#tab-kitchen');
    await refresh();
    const prices = (await api('GET', '/v1/market/prices')).body || {};
    const ranks = rules?.tradeRanks || [];
    const rankIdx = me.tradeRank ?? 0; // server-computed — the client never re-derives game math
    const rank = ranks[rankIdx] || { name: '?', bonus: 0 };
    const nextRank = ranks[rankIdx + 1];
    const kitchens = rules?.kitchens || [];
    const labIdx = me.lab ? kitchens.findIndex((k) => k.id === me.lab) : -1;
    const lab = kitchens[labIdx], nextLab = kitchens[labIdx + 1];
    const demandHere = prices.demand?.[me.loc] || {};
    const unlocked = (rules?.drugs || []).filter((d) => d.unlock <= rankIdx);

    t.innerHTML = `
      <h2>The Trade</h2>
      <div class="card"><span class="t">${rank.name}</span>
        <div class="d">gross moved $${fmt(me.tradeRep || 0)} · rank bonus +${Math.round(rank.bonus * 100)}%${nextRank ? ` · next: ${nextRank.name} at $${fmt(nextRank.at)}` : ' · the top of the trade'}</div></div>

      <h2 style="margin-top:12px">The Lab</h2>
      <div class="card"><span class="t">${lab ? lab.name : 'no kitchen'}</span>
        <div class="d">${lab ? `batch cap ${lab.cap} · cook ~${lab.mins * 12}min · fire risk ${Math.round(lab.fire * 100)}%` : 'even a bathtub beats the corner'}</div>
        ${nextLab ? `<button class="act" data-do="POST /v1/kitchen/lab/upgrade">upgrade → ${nextLab.name} ($${fmt(nextLab.cost)}${nextLab.omr ? ` + ${nextLab.omr} $OMR` : ''})</button>` : ''}</div>

      <h2 style="margin-top:12px">The Supplier <span class="d" style="font-size:10px">(makings — today's prices)</span></h2>
      <div class="grid">${unlocked.map((d) => `
        <div class="card"><span class="t">${d.name}</span> <span class="d">${d.tag}</span>
          <div class="d">makings $${fmt(prices.makings?.[d.id] ?? '?')}/unit · shelf: ${me.makings?.[d.id] || 0}</div>
          <input data-mk="${d.id}" placeholder="qty" size="5"> <button class="act" data-mkbuy="${d.id}">buy</button></div>`).join('')}</div>
      ${(rules?.drugs || []).filter((d) => d.unlock > rankIdx).map((d) =>
        `<span class="chip">${d.name} — locked (rank ${d.unlock})</span>`).join(' ')}

      <h2 style="margin-top:12px">The Burner</h2>
      ${me.batch ? `
        <div class="card"><span class="t">${drugName(me.batch.drug)} × ${me.batch.qty}</span>
          <div class="d">${me.batch.readySeconds > 0 ? `ready in ${mins(me.batch.readySeconds)}` : 'DONE — pull it off the heat'}</div>
          <button class="act" data-do="POST /v1/kitchen/collect">collect</button></div>` : `
        <select id="cook-drug">${unlocked.map((d) => `<option value="${d.id}">${d.name}</option>`).join('')}</select>
        <input id="cook-qty" placeholder="qty (blank = max)" size="14">
        <button class="act" id="cook-go">cook</button>
        <span class="d" style="color:var(--dim);font-size:11px">1 crate packs 20 units — crates: ${fmt(me.cb)}</span>`}

      <h2 style="margin-top:12px">The Corner <span class="d" style="font-size:10px">(demand at ${me.loc})</span></h2>
      ${(me.stash || []).length ? `<div class="grid">${me.stash.map((s) => `
        <div class="card"><span class="t">${drugName(s.drug)}</span>
          <div class="d">${s.qty} units · quality ${s.quality} · demand here ×${demandHere[s.drug] ?? '?'}</div>
          <input data-deal="${s.drug}" placeholder="qty" size="5"> <button class="act" data-dealgo="${s.drug}">deal</button></div>`).join('')}</div>`
        : '<span class="d" style="color:var(--dim)">the stash is empty — cook something</span>'}

      <h2 style="margin-top:12px">The Crew</h2>
      <div class="card"><span class="t">${me.crew || 0} hands${me.crewCold ? ' — DOWNED TOOLS' : ''}</span>
        <div class="d">they move the cheapest lines while you sleep · wages owed $${fmt(me.crewWageOwed || 0)}${me.crewCold ? ' · COLD: nothing moves until the nut is paid' : ''}</div>
        <button class="act" data-do="POST /v1/kitchen/crew/hire">hire (next: $${fmt((rules?.crew?.costStep || 50000) * ((me.crew || 0) + 1))})</button>
        <button class="act" data-do="POST /v1/kitchen/crew/wages">pay the nut</button></div>

      <h2 style="margin-top:12px">Heat (${me.heat})</h2>
      <button class="act" data-do="POST /v1/kitchen/laylow">lay low</button>
      <button class="act" data-do="POST /v1/kitchen/cleanpapers">clean papers ($OMR)</button>`;

    t.querySelectorAll('[data-mkbuy]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/kitchen/makings/${b.dataset.mkbuy}`, { qty: Number(t.querySelector(`[data-mk="${b.dataset.mkbuy}"]`).value) || 1 }).then(() => renderKitchen()));
    const cookBtn = t.querySelector('#cook-go');
    if (cookBtn) cookBtn.onclick = () =>
      act('POST', '/v1/kitchen/cook', { drugId: t.querySelector('#cook-drug').value, qty: Number(t.querySelector('#cook-qty').value) || undefined }).then(() => renderKitchen());
    t.querySelectorAll('[data-dealgo]').forEach((b) => b.onclick = () =>
      act('POST', '/v1/kitchen/deal', { drugId: b.dataset.dealgo, qty: Number(t.querySelector(`[data-deal="${b.dataset.dealgo}"]`).value) || 1 }).then(() => renderKitchen()));
  }

  // ── THE FAMILY: your family's dashboard, or the boards to found/join one ──
  async function renderFamily() {
    const t = $('#tab-family');
    await refresh();
    if (!me.gang) {
      const gl = (await api('GET', '/v1/gangs')).body?.gangs || [];
      t.innerHTML = `
        <h2>The Families</h2>
        ${gl.length ? `<div class="grid">${gl.sort((a, b) => b.standing - a.standing).map((g) => `
          <div class="card"><span class="t">[${g.tag}] ${g.name}</span>${g.seal ? ` <span class="chip">${g.seal}</span>` : ''}
            <div class="d">${g.members} made · ${g.warsWon} wars won · standing ${fmt(g.standing)}</div>
            <button class="act" data-join="${g.id}">kiss the ring</button></div>`).join('')}</div>`
          : '<span class="d" style="color:var(--dim)">no families yet — the city is waiting for a boss</span>'}
        <h2 style="margin-top:14px">Found Your Own <span class="d" style="font-size:10px">($${fmt(rules?.family?.foundCost || 25000)} — level-gated)</span></h2>
        <input id="g-name" placeholder="family name" size="18"> <input id="g-tag" placeholder="TAG" size="5">
        <button class="act" id="g-found">found it</button>`;
      t.querySelectorAll('[data-join]').forEach((b) => b.onclick = () =>
        act('POST', `/v1/gangs/${b.dataset.join}/join`, {}).then(() => renderFamily()));
      t.querySelector('#g-found').onclick = () =>
        act('POST', '/v1/gangs', { name: t.querySelector('#g-name').value.trim(), tag: t.querySelector('#g-tag').value.trim() }).then(() => renderFamily());
      return;
    }
    const g = (await api('GET', `/v1/gangs/${me.gang.id}`)).body?.gang;
    if (!g) { t.innerHTML = '<span class="d">the family is gone.</span>'; return; }
    const com = (await api('GET', '/v1/commission')).body || {};
    const mySeat = (com.seats || []).find((s) => s.name === g.name);
    const boss = me.gang.role === 'boss' || me.gang.role === 'underboss';
    t.innerHTML = `
      <h2>[${g.tag}] ${g.name}${g.seal ? ` <span class="chip">${g.seal}</span>` : ''} — you are ${me.gang.role}</h2>
      <div class="grid">
        <div class="card"><span class="t">$${fmt(g.treasury)}</span><div class="d">treasury</div></div>
        <div class="card"><span class="t">${fmt(g.omrReserve)} $OMR</span><div class="d">family reserve</div></div>
        <div class="card"><span class="t">${g.warsWon}</span><div class="d">wars won</div></div>
        <div class="card"><span class="t">${g.held.length ? g.held.join(', ') : 'none'}</span><div class="d">turf held</div></div>
      </div>

      <button class="act" id="trib-go">kick up cash</button>
      <input id="tribo-amt" placeholder="$OMR" size="8">
      <button class="act" id="tribo-go">pool $OMR</button>
      <span class="d" style="color:var(--dim);font-size:11px">tribute builds the treasury AND the family's season standing</span>

      ${boss ? `<button class="act" data-do="POST /v1/districts/${me.loc}/seize">seize ${me.loc}</button>` : ''}
      ${boss ? `<input id="war-gang" placeholder="rival gang id" size="26"> <button class="act" id="war-go">declare war ($10k)</button>` : '<span class="d" style="color:var(--dim)">wars and turf are the boss’s to call</span>'}

      <h2 style="margin-top:12px">The Commission ${mySeat ? `<span class="chip good">seated — #${(com.seats || []).indexOf(mySeat) + 1}</span>` : '<span class="chip">no seat</span>'}</h2>
      <div class="d" style="color:var(--dim);font-size:11px">decree in force: <b>${com.decree?.name || com.decree?.id || 'none'}</b>${com.veto ? ` · vetoed: ${com.veto.decree} by ${com.veto.family}` : ''}</div>
      <div class="grid" style="margin-top:4px">${(com.seats || []).map((s, i) => `

      ${boss && mySeat ? `<div style="margin-top:6px">
        <select id="com-decree">${(com.book || []).map((d) => `<option value="${d.id}">${d.id} — ${d.name || d.desc || ''}</option>`).join('')}</select>

    t.querySelector('#tribo-go').onclick = () =>
      act('POST', '/v1/gangs/tribute/omr', { amount: Number(t.querySelector('#tribo-amt').value) }).then(() => renderFamily());

  // ── BLACK MARKET: the board (auctions / goods / buy orders) + your sell side ──
  async function renderMarket() {
    const t = $('#tab-market');
    await refresh();
    const board = (await api('GET', '/v1/market')).body || {};
    const prices = (await api('GET', '/v1/market/prices')).body || {};
    const here = prices.goods?.[me.loc] || {};
    const listings = board.listings || [];
    const carCard = (l) => `
      <div class="card"><span class="t">${l.car ? `${l.car.model}${l.car.trim ? ' · ' + l.car.trim : ''}` : 'iron'}</span>
        ${l.seller === me.name ? '<span class="chip">yours</span>' : ''}
        <div class="d">${l.car?.plate ? `[${l.car.plate}] · ` : ''}dmg ${l.car?.dmg ?? '?'}% · seller ${l.seller}</div>
        <div class="d">bid ${l.bid != null ? '$' + fmt(l.bid) : 'none'} (floor $${fmt(l.minBid)})${l.buyNow ? ` · buy-now $${fmt(l.buyNow)}` : ''}${l.reserveMet === false ? ' · reserve NOT met' : ''} · ${mins(l.expiresSeconds)} left</div>
        ${l.seller !== me.name ? `<input data-bid="${l.id}" placeholder="bid" size="9">
          <button class="act" data-bidgo="${l.id}">bid</button>
          ${l.buyNow ? `<button class="act" data-buynow="${l.id}">buy now</button>` : ''}`
        : `<button class="act" data-cancel="${l.id}">pull it</button>`}</div>`;
    const goodCard = (l) => `
      <div class="card"><span class="t">${goodName(l.good)} × ${fmt(l.qty)}</span>
        ${l.seller === me.name ? '<span class="chip">yours</span>' : ''}
        <div class="d">$${fmt(l.unitPrice)}/unit at ${l.district} (spot here: $${fmt(here[l.good] ?? '?')}) · ${l.seller} · ${mins(l.expiresSeconds)} left</div>
        ${l.seller !== me.name ? `${l.district === me.loc ? `<input data-gqty="${l.id}" placeholder="qty" size="6">
          <button class="act" data-gbuy="${l.id}">buy</button>` : `<span class="chip cold">stand at ${l.district} to buy</span>`}`
        : `<button class="act" data-cancel="${l.id}">pull it</button>`}</div>`;
    const orderCard = (l) => `
      <div class="card"><span class="t">WTB ${goodName(l.good)} × ${fmt(l.wanted)}</span>
        ${l.seller === me.name ? '<span class="chip">yours</span>' : ''}
        <div class="d">pays $${fmt(l.unitPrice)}/unit at ${l.district} · ${l.seller} · ${mins(l.expiresSeconds)} left</div>
        ${l.seller !== me.name ? `${l.district === me.loc ? `<input data-fqty="${l.id}" placeholder="qty" size="6">
          <button class="act" data-fill="${l.id}">fill from trunk</button>` : `<span class="chip cold">deliver at ${l.district}</span>`}`
        : `<button class="act" data-claim="${l.id}">claim delivered</button> <button class="act" data-cancel="${l.id}">pull it</button>`}</div>`;
    const myCars = (me.cars || []).filter((c) => !c.listed && !c.pledged);
    const myCargo = Object.entries(me.cargo || {}).filter(([, q]) => q > 0);
    t.innerHTML = `
      <h2>The Board <span class="d" style="font-size:10px">(take ${(board.levers?.takeBps || 200) / 100}% · list fee ${(board.levers?.listFeeBps || 100) / 100}% · max ${board.levers?.maxListings} listings)</span></h2>
      ${listings.length ? `<div class="grid">${listings.map((l) =>
        l.kind === 'car' ? carCard(l) : l.kind === 'good' ? goodCard(l) : orderCard(l)).join('')}</div>`
        : '<span class="d" style="color:var(--dim)">the board is bare — list something</span>'}

      <h2 style="margin-top:14px">Put Iron on the Block</h2>
      ${myCars.length ? `
        <select id="mk-car">${myCars.map((c) => `<option value="${c.id}">${c.model}${c.trim ? ' · ' + c.trim : ''} (dmg ${c.dmg}%)</option>`).join('')}</select>
        <input id="mk-minbid" placeholder="min bid" size="9">
        <input id="mk-buynow" placeholder="buy-now (opt)" size="11">
        <input id="mk-reserve" placeholder="reserve (opt)" size="11">
        <button class="act" id="mk-listcar">auction it</button>`
        : '<span class="d" style="color:var(--dim)">no unlisted, unpledged iron in the garage</span>'}

      <h2 style="margin-top:12px">Move Goods <span class="d" style="font-size:10px">(pinned to ${me.loc} — buyers come to you)</span></h2>
      ${myCargo.length ? `
        <select id="mk-good">${myCargo.map(([id, q]) => `<option value="${id}">${goodName(id)} (${q} in trunk, spot $${fmt(here[id] ?? '?')})</option>`).join('')}</select>
        <input id="mk-gqty" placeholder="qty" size="6">
        <input id="mk-gprice" placeholder="$/unit" size="8">
        <button class="act" id="mk-listgood">list it</button>`
        : '<span class="d" style="color:var(--dim)">the trunk is empty — buy goods on the Streets first</span>'}

      <h2 style="margin-top:12px">Post a Buy Order <span class="d" style="font-size:10px">(escrows cash — sellers deliver to ${me.loc})</span></h2>
      <select id="mk-ogood">${(rules?.goods || []).map((g) => `<option value="${g.id}">${g.name} (spot $${fmt(here[g.id] ?? '?')})</option>`).join('')}</select>
      <input id="mk-oqty" placeholder="qty" size="6">
      <input id="mk-oprice" placeholder="$/unit" size="8">
      <button class="act" id="mk-order">post it</button>`;
    const rerender = () => renderMarket();
    t.querySelectorAll('[data-bidgo]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/market/${b.dataset.bidgo}/bid`, { amount: Number(t.querySelector(`[data-bid="${b.dataset.bidgo}"]`).value) }).then(rerender));
    t.querySelectorAll('[data-buynow]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/market/${b.dataset.buynow}/buy`, {}).then(rerender));
    t.querySelectorAll('[data-gbuy]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/market/${b.dataset.gbuy}/buy`, { qty: Number(t.querySelector(`[data-gqty="${b.dataset.gbuy}"]`).value) || 1 }).then(rerender));
    t.querySelectorAll('[data-fill]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/market/${b.dataset.fill}/fill`, { qty: Number(t.querySelector(`[data-fqty="${b.dataset.fill}"]`).value) || 1 }).then(rerender));
    t.querySelectorAll('[data-claim]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/market/${b.dataset.claim}/claim`, {}).then(rerender));
    t.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/market/${b.dataset.cancel}/cancel`, {}).then(rerender));
    const listCar = t.querySelector('#mk-listcar');
    if (listCar) listCar.onclick = () => {
      const body = { carId: t.querySelector('#mk-car').value, minBid: Number(t.querySelector('#mk-minbid').value) };
      const bn = Number(t.querySelector('#mk-buynow').value), rv = Number(t.querySelector('#mk-reserve').value);
      if (bn) body.buyNow = bn; if (rv) body.reserve = rv;
      act('POST', '/v1/market', body).then(rerender);
    };
    const listGood = t.querySelector('#mk-listgood');
    if (listGood) listGood.onclick = () =>
      act('POST', '/v1/market', { goodId: t.querySelector('#mk-good').value, qty: Number(t.querySelector('#mk-gqty').value), price: Number(t.querySelector('#mk-gprice').value) }).then(rerender);
    t.querySelector('#mk-order').onclick = () =>
      act('POST', '/v1/market/order', { goodId: t.querySelector('#mk-ogood').value, qty: Number(t.querySelector('#mk-oqty').value), price: Number(t.querySelector('#mk-oprice').value) }).then(rerender);
  }

  function renderStreets() {

    const crimes = (rules?.crimes || []).map((c) => `
      <div class="card"><span class="t">${c.name}</span>
        <div class="d">lvl ${c.lvl} · ${c.nerve} nerve · $${fmt(c.cash[0])}–$${fmt(c.cash[1])}${c.jail ? ' · jail risk' : ''}</div>

      `<button class="act" data-do="POST /v1/travel/${d.id || d}">${d.name || d.id || d}</button>`).join('');

      `<button class="act" data-do="POST /v1/train/${s}">${s}</button>`).join('');

      <h2>Crimes</h2><div class="grid">${crimes}</div>

  async function renderCity() {

    const c = r.body;
    t.innerHTML = `
      <h2>Today</h2>
      <div class="card"><span class="t">${c.event?.name || c.event?.id || '—'}</span>
        <div class="d">${c.event?.desc || ''}</div>

      <div class="grid">${Object.entries(c.weather || {}).map(([d, w]) =>
        `<div class="card"><span class="t">${d}</span><div class="d">shock ×${Number(w).toFixed(3)}</div></div>`).join('')}</div>
      <h2 style="margin-top:12px">Forecast</h2>

  }

      ['POST', '/v1/business/:id/upgrade', {}], ['POST', '/v1/business/:id/launder', { amount: 1000 }],
      ['POST', '/v1/business/:id/shakedown', {}],
    ],
    'The Law': [
      ['GET', '/v1/law'], ['POST', '/v1/law/bribe', {}], ['POST', '/v1/law/retainer', {}],
      ['POST', '/v1/law/plea', {}], ['POST', '/v1/law/jury', {}], ['POST', '/v1/law/trial', {}],
      ['POST', '/v1/law/witpro', {}], ['POST', '/v1/law/flip/:targetId', {}],
    ],
    'The Pen': [
      ['GET', '/v1/pen'], ['POST', '/v1/pen/work', {}], ['POST', '/v1/pen/buy/:item', {}],
      ['POST', '/v1/pen/protection', {}], ['POST', '/v1/pen/bribe', { seconds: 60 }],
      ['POST', '/v1/pen/shank/:targetId', {}], ['POST', '/v1/pen/burner/:targetId', { tier: 'legbreaker' }],
    ],
    'Loans': [
      ['GET', '/v1/loans'], ['POST', '/v1/loans', { amount: 10000, rate: 0.2, hours: 24 }],
      ['POST', '/v1/loans/:id/take', {}], ['POST', '/v1/loans/:id/repay', {}], ['POST', '/v1/loans/:id/collect', {}],
      ['POST', '/v1/loans/:id/cancel', {}], ['POST', '/v1/loans/:id/sell', { price: 5000 }],
      ['POST', '/v1/loans/:id/buy', {}], ['POST', '/v1/loans/square', {}],
    ],
    'Underworld & Skills': [
      ['GET', '/v1/underworld'], ['POST', '/v1/underworld/:npc/gift', {}], ['POST', '/v1/underworld/discharge', {}],
      ['POST', '/v1/underworld/:npc/penance', {}], ['POST', '/v1/underworld/:npc/favor', {}],
      ['POST', '/v1/underworld/:npc/errand', {}], ['GET', '/v1/skills'], ['POST', '/v1/skills/:id', {}],
      ['POST', '/v1/skills/respec', {}], ['POST', '/v1/respec', { muscle: 5, cunning: 5, speed: 5 }],
      ['POST', '/v1/vanity/name', { name: '' }], ['POST', '/v1/vanity/title', { title: '' }],
    ],
    'World & Growth': [
      ['GET', '/v1/world'], ['POST', '/v1/world/:npcId/raid', {}], ['GET', '/v1/daily'],
      ['POST', '/v1/daily/:id/claim', {}], ['POST', '/v1/missions/:id', {}], ['POST', '/v1/path', { path: 'earner' }],
      ['GET', '/v1/notifications'],
    ],
    'Chain': [
      ['GET', '/v1/session'], ['POST', '/v1/wallet/challenge', { address: '' }],
      ['POST', '/v1/wallet/verify', { address: '', signature: '' }], ['POST', '/v1/withdraw', { amount: 1 }],
      ['GET', '/v1/withdraw/status'], ['POST', '/v1/character/mint', {}], ['GET', '/v1/fees/status'],
    ],
  };
  function renderDeck() {
    const t = $('#tab-deck');
    t.innerHTML = `<p class="d" style="color:var(--dim);font-size:12px;margin-top:0">
      Every system in the city, raw. Pick a move — <code>:params</code> become inputs, the body is yours to edit.</p>`;
    const groupSel = el(`<select id="deck-group">${Object.keys(DECK).map((g) => `<option>${g}</option>`).join('')}</select>`);
    const routeSel = el(`<select id="deck-route" style="max-width:340px"></select>`);
    const paramBox = el(`<span id="deck-params"></span>`);
    const bodyTa = el(`<textarea id="deck-body" spellcheck="false"></textarea>`);
    const goBtn = el(`<button class="act" style="margin-top:6px">SEND</button>`);
    t.append(groupSel, ' ', routeSel, el('<div style="margin:6px 0"></div>'), paramBox, bodyTa, goBtn);
    const fillRoutes = () => {
      const routes = DECK[groupSel.value] || [];
      routeSel.innerHTML = routes.map(([m, p], i) => `<option value="${i}">${m} ${p}</option>`).join('');
      fillRoute();
    };
    const fillRoute = () => {
      const [m, p, body] = (DECK[groupSel.value] || [])[Number(routeSel.value) || 0] || [];
      paramBox.innerHTML = '';
      for (const prm of (p?.match(/:([A-Za-z]+)/g) || []))
        paramBox.appendChild(el(`<label class="f">${prm.slice(1)} <input data-prm="${prm}" size="24"></label>`));
      bodyTa.value = m === 'GET' || body === undefined ? '' : JSON.stringify(body, null, 2);
      bodyTa.style.display = m === 'GET' ? 'none' : 'block';
    };
    groupSel.onchange = fillRoutes; routeSel.onchange = fillRoute;
    goBtn.onclick = async () => {
      const [m, p] = (DECK[groupSel.value] || [])[Number(routeSel.value) || 0] || [];
      let path = p;
      for (const inp of paramBox.querySelectorAll('input')) path = path.replace(inp.dataset.prm, encodeURIComponent(inp.value.trim()));
      let body;
      if (m !== 'GET' && bodyTa.value.trim()) {
        try { body = JSON.parse(bodyTa.value); } catch { return toast('bad JSON body', true); }
      } else if (m !== 'GET') body = {};
      await act(m, path, body);
    };
    fillRoutes();
  }

  // ── WET WORK: the contract board, the streets roster, your hunt, your defenses ──
  const huntKey = () => 'omerta_hunt_' + (me?.id || '');
  async function renderPvp() {
    const t = $('#tab-pvp');
    await refresh();
    const board = (await api('GET', '/v1/contracts')).body?.contracts || [];
    const streets = ((await api('GET', '/v1/streets')).body?.streets || []).filter((s) => s.id !== me.id);
    const hunt = JSON.parse(localStorage.getItem(huntKey()) || 'null');
    const huntReadyS = hunt ? Math.ceil((new Date(hunt.placedAt) - Date.now()) / 1000) : 0;
    const npcs = [['legbreaker', 'Leg-Breaker $50k'], ['journeyman', 'Journeyman $250k'], ['professional', 'The Professional $1M']];

    t.innerHTML = `
      <h2>The Contract Board</h2>
      ${board.length ? `<div class="grid">${board.map((c) => `
        <div class="card"><span class="t">${c.target.name}</span>
          <span class="chip ${c.kind === 'kill' ? 'bad' : ''}">${c.kind.toUpperCase()}</span>
          <div class="d">pot <b style="color:var(--neon)">$${fmt(c.pot)}</b> · by ${c.poster ? (c.family ? c.poster + ' (family)' : c.poster) : 'somebody'}${c.reason ? ` · “${c.reason}”` : ''}</div>
          <div class="d">${c.directedTo ? `EXCLUSIVE: ${c.directedTo} for ${mins(c.opensInSeconds)} · ` : ''}${c.expiresInSeconds != null ? mins(c.expiresInSeconds) + ' left' : 'open-ended'}</div>
          <button class="act" data-pullstake="${c.target.id}:${c.kind}">pull my stake</button></div>`).join('')}</div>`
        : '<span class="d" style="color:var(--dim)">no open contracts — the city is at peace. fix that.</span>'}

      <h2 style="margin-top:12px">Put Out a Contract</h2>
      <select id="ct-target">${streets.map((s) => `<option value="${s.id}">${s.name} (lvl ${s.level}${s.gangTag ? ' · ' + s.gangTag : ''})</option>`).join('')}</select>
      <select id="ct-kind"><option value="hospitalize">hospitalize</option><option value="kill">kill</option></select>
      <input id="ct-amt" placeholder="pot $" size="9">
      <label style="font-size:11px;color:var(--dim)"><input type="checkbox" id="ct-anon"> anonymous (3 $OMR)</label>
      <input id="ct-reason" placeholder="reason (public)" size="18">
      <button class="act" id="ct-post">post it</button>
      <div style="margin-top:4px"><span class="d" style="color:var(--dim);font-size:11px">name a gun (optional — directed contract, $10k floor):</span>
        <select id="ct-hitman"><option value="">— open to all —</option>${streets.map((s) => `<option value="${s.id}">${s.name}</option>`).join('')}</select>
        <input id="ct-excl" placeholder="exclusive hrs" size="10"></div>

      <h2 style="margin-top:12px">Your Hunt</h2>
      ${hunt ? `
        <div class="card"><span class="t">hunting ${hunt.name}</span>
          <div class="d">${huntReadyS > 0 ? `your people place them in ${mins(huntReadyS)}` : 'PLACED — take the shot'}${me.shootCdSeconds > 0 ? ` · trigger cools ${mins(me.shootCdSeconds)}` : ''}</div>
          <button class="act" data-fire="${hunt.targetId}" ${huntReadyS > 0 ? 'disabled' : ''}>FIRE</button>
          <button class="act" id="hunt-off">call it off</button></div>`
        : '<span class="d" style="color:var(--dim)">nobody in the crosshairs — start a search from the roster below (3h to place a mark)</span>'}

      <h2 style="margin-top:12px">Your Defenses</h2>
      <div class="grid">
        <div class="card"><span class="t">Safehouse</span>
          <div class="d">${me.safeSeconds > 0 ? `to ground for ${mins(me.safeSeconds)} more` : `$${fmt(me.safehouseCost)} for 4h — untargetable by fire + NPC hits (still jumpable; no offense/extraction inside)`}</div>
          ${me.safeSeconds > 0 ? '' : '<button class="act" data-do="POST /v1/safehouse">go to ground</button>'}</div>
        <div class="card"><span class="t">Bodyguard</span>
          <div class="d">${me.guardedBy ? `guarded — one lethal shot absorbed (${mins(me.guardSeconds)})` : me.guardPrice != null ? `you're for hire at $${fmt(me.guardPrice)}` : 'list yourself, or hire off the roster below'}</div>
          <input id="bg-price" placeholder="your price" size="9"> <button class="act" id="bg-offer">offer to guard</button></div>
        <div class="card"><span class="t">Counter-intel</span>
          <div class="d">5 $OMR reads every funder on every pot on YOUR head — pierces anonymity</div>
          <button class="act" data-do="POST /v1/contracts/peek">peek</button></div>
        ${me.wanted || me.welsher ? `<div class="card" style="border-color:var(--blood)"><span class="t" style="color:var(--bad)">Square Your Name</span>
          <div class="d">$50k clears WANTED + the welsher mark and calls off the pool bounty (settle the debt first)</div>
          <button class="act" data-do="POST /v1/loans/square">pay it</button></div>` : ''}
      </div>

      <h2 style="margin-top:12px">The Streets (${streets.length})</h2>
      <div class="grid">${streets.map((s) => `
        <div class="card"><span class="t">${s.name}</span> <span class="d">lvl ${s.level}${s.gangTag ? ' · ' + s.gangTag : ''}</span>
          ${s.jailed ? '<span class="chip cold">LOCKUP</span>' : ''}${s.hospitalized ? '<span class="chip cold">HOSPITAL</span>' : ''}
          <div class="d">${s.loc}${s.guardPrice != null ? ` · guards for $${fmt(s.guardPrice)}` : ''}</div>
          <button class="act" data-jump="${s.id}">jump</button>
          <button class="act" data-search="${s.id}" data-name="${s.name}">search</button>
          <select data-npctier="${s.id}" style="font-size:10px">${npcs.map(([id, n]) => `<option value="${id}">${n}</option>`).join('')}</select>
          <button class="act" data-npchit="${s.id}">NPC hit</button>
          ${s.guardPrice != null ? `<button class="act" data-hire="${s.id}">hire guard</button>` : ''}
          <button class="act" data-feud="${s.id}">feud</button></div>`).join('')}</div>`;

    t.querySelectorAll('[data-pullstake]').forEach((b) => b.onclick = () => {
      const [tid, kind] = b.dataset.pullstake.split(':');
      act('POST', `/v1/contracts/${tid}/${kind}/cancel`, {}).then(() => renderPvp());
    });
    t.querySelector('#ct-post').onclick = () => {
      const body = { amount: Number(t.querySelector('#ct-amt').value), kind: t.querySelector('#ct-kind').value };
      if (t.querySelector('#ct-anon').checked) body.anon = true;
      const rsn = t.querySelector('#ct-reason').value.trim(); if (rsn) body.reason = rsn;
      const hm = t.querySelector('#ct-hitman').value; if (hm) { body.hitman = hm;
        const ex = Number(t.querySelector('#ct-excl').value); if (ex) body.exclusiveHours = ex; }
      act('POST', `/v1/streets/${t.querySelector('#ct-target').value}/bounty`, body).then(() => renderPvp());
    };
    t.querySelectorAll('[data-jump]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/streets/${b.dataset.jump}/jump`, {}).then(() => renderPvp()));
    t.querySelectorAll('[data-search]').forEach((b) => b.onclick = async () => {
      const r = await act('POST', `/v1/streets/${b.dataset.search}/search`, {});
      if (r.code < 400 && r.body.placedAt)
        localStorage.setItem(huntKey(), JSON.stringify({ targetId: b.dataset.search, name: b.dataset.name, placedAt: r.body.placedAt }));
      renderPvp();
    });
    t.querySelectorAll('[data-npchit]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/streets/${b.dataset.npchit}/npchit`, { tier: t.querySelector(`[data-npctier="${b.dataset.npchit}"]`).value }).then(() => renderPvp()));
    t.querySelectorAll('[data-hire]').forEach((b) => b.onclick = () =>
      act('POST', `/v1/bodyguard/hire/${b.dataset.hire}`, {}).then(() => renderPvp()));
    t.querySelectorAll('[data-feud]').forEach((b) => b.onclick = () => act('GET', `/v1/feud/${b.dataset.feud}`));
    t.querySelectorAll('[data-fire]').forEach((b) => b.onclick = async () => {
      const r = await act('POST', `/v1/streets/${b.dataset.fire}/fire`, {});
      // the server consumes the search on every resolved shot (kill or miss) — clear the local
      // hunt on any 2xx, and on a stale no_search too
      if (r.code < 400 || r.body?.error === 'no_search') localStorage.removeItem(huntKey());
      renderPvp();
    });
    const off = t.querySelector('#hunt-off');
    if (off) off.onclick = () => act('DELETE', '/v1/streets/search').then(() => { localStorage.removeItem(huntKey()); renderPvp(); });
    t.querySelector('#bg-offer').onclick = () =>
      act('POST', '/v1/bodyguard/offer', { price: Number(t.querySelector('#bg-price').value) }).then(() => renderPvp());
  }

  // ── THE LAW: the investigation meter, the escapes, the courtroom, the informant's door ──
  async function renderLaw() {
    const t = $('#tab-law');
    await refresh();
    const r = await api('GET', '/v1/law');
    if (r.code >= 400) { t.innerHTML = '<span class="d">the docket is sealed.</span>'; return; }
    const L = r.body;
    const meterMax = Math.max(L.thresholds.indict * 1.2, L.exposure);
    const mark = (v) => `${Math.min(100, 100 * v / meterMax)}%`;
    const stageColor = { clean: 'var(--ok)', watched: 'var(--neon)', investigation: 'var(--neon)', indicted: 'var(--bad)' }[L.stage] || 'var(--dim)';
    t.innerHTML = `
      <h2>The Rap Sheet</h2>
      <div class="card"><span class="t" style="color:${stageColor};text-transform:uppercase">${L.stage}</span>
        ${L.rat ? '<span class="chip bad">RAT — the badge follows the bloodline</span>' : ''}
        ${L.patrol ? '<span class="chip cold">PATROL HOURS — the Bureau convicts harder</span>' : ''}
        <div class="d" style="margin-top:6px">the case: ${L.exposure} exposure · heat above ${L.watch} feeds it (yours: ${me.heat}) · today ×${L.cityEvent.exposureMult} (${L.cityEvent.name})</div>
        <div class="bar" style="height:10px;position:relative;margin-top:6px"><i style="width:${mark(L.exposure)};background:${stageColor}"></i></div>
        <div class="d" style="display:flex;justify-content:space-between;font-size:10px">
          <span>watched @ ${L.thresholds.watched}</span><span>investigation @ ${L.thresholds.investigation}</span><span>INDICTMENT @ ${L.thresholds.indict}</span></div></div>

      ${L.indicted ? `
      <h2 style="margin-top:12px" >The Case Against You</h2>
      <div class="card" style="border-color:var(--blood)">
        <span class="t" style="color:var(--bad)">UNDER INDICTMENT</span>
        <div class="d">trial in ${mins(L.graceSeconds)} unless you act · conviction odds ~${L.convictionOdds}% · a conviction seizes ${Math.round(L.forfeitRate * 100)}% of pocket + bank (staked $OMR + minted gear are SAFE) and jails you — the street SURVIVES</div>
        <div style="margin-top:6px">
          <button class="act" data-do="POST /v1/law/plea">cop a plea (${Math.round((L.plea?.forfeitRate || 0) * 100)}% + ${mins(L.plea?.jailSeconds || 0)} inside)</button>
          <button class="act" data-do="POST /v1/law/jury" ${L.jury.bought ? 'disabled' : ''}>${L.jury.bought ? 'jury bought' : `buy the jury (${L.jury.cost} $OMR)`}</button>
          <button class="act" data-do="POST /v1/law/trial">demand trial NOW</button>
        </div></div>` : ''}

      <h2 style="margin-top:12px">The Escapes</h2>
      <div class="grid">
        <div class="card"><span class="t">Grease the Beat Cop</span>
          <div class="d">${L.bribeCost != null ? `$${fmt(L.bribeCost)} knocks ${L.bribeClears} off the meter (wealth-scaled)` : 'a FILED case is past bribing'}</div>
          ${L.bribeCost != null ? '<button class="act" data-do="POST /v1/law/bribe">pay</button>' : ''}</div>
        <div class="card"><span class="t">The Lawyer</span>
          <div class="d">${L.retainer.active ? `on retainer — ${mins(L.retainer.seconds)} left (softer busts, smaller forfeits)` : `$${fmt(L.retainer.cost)} keeps counsel on call`}</div>
          ${L.retainer.active ? '' : '<button class="act" data-do="POST /v1/law/retainer">retain</button>'}</div>
        <div class="card"><span class="t">Lay Low / Clean Papers</span>
          <div class="d">heat feeds the case — cool it in the Kitchen tab</div></div>
      </div>

      <h2 style="margin-top:12px">The Informant's Door</h2>
      <div class="card">
        <div class="d">FLIP: drop your case by naming a rival — seeds their meter, brands you a RAT forever
        (omertà void on your head; witness protection opens). The named man collapsing YOUR case means
        someone probably wants you dead.</div>
        <select id="flip-target"></select>
        <button class="act" id="flip-go" style="border-color:var(--blood)">flip on them</button>
        ${L.witpro.available ? '<button class="act" data-do="POST /v1/law/witpro">enter witness protection</button>' : ''}
        ${L.witpro.active ? `<span class="chip cold">WITPRO — untargetable ${mins(L.witpro.seconds)}</span>` : ''}
      </div>`;
    const streets = ((await api('GET', '/v1/streets')).body?.streets || []).filter((s) => s.id !== me.id);
    $('#flip-target').innerHTML = streets.map((s) => `<option value="${s.id}">${s.name} (lvl ${s.level})</option>`).join('');
    $('#flip-go').onclick = () =>
      act('POST', `/v1/law/flip/${$('#flip-target').value}`, {}).then(() => renderLaw());
  }

  // data-do buttons (simple POST/GET with no body)
  document.addEventListener('click', (e) => {
    const d = e.target?.dataset?.do;
    if (!d) return;
    const [m, p] = d.split(' ');
    act(m, p, m === 'GET' ? undefined : {});
  });

  // ── the wire (websocket feed) ──
  function feedLine(channel, ev) {
    const f = $('#feed');
    const line = el(`<div class="ev ${channel === 'me' ? 'me' : ''}"><span class="ch">${channel}</span> ` +
      `<span>${ev.type || ''}</span> <span style="color:var(--dim)">${escapeHtml(summarize(ev))}</span></div>`);
    f.prepend(line);
    while (f.childElementCount > 120) f.lastElementChild.remove();
  }
  const escapeHtml = (s) => String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
  function summarize(ev) {
    const { type, channel, ...rest } = ev;
    const s = JSON.stringify(rest);
    return s.length > 140 ? s.slice(0, 140) + '…' : s;
  }
  function connectWs() {
    if (ws) return;
    try {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/v1/ws?token=${encodeURIComponent(token)}`);
      ws.onopen = () => { $('#ws-dot').style.color = 'var(--ok)'; };
      ws.onmessage = (m) => {
        try {
          const ev = JSON.parse(m.data);
          feedLine(ev.channel || '?', ev);
          if (ev.channel === 'me') refresh();
        } catch { /* noise */ }
      };
      ws.onclose = () => { $('#ws-dot').style.color = 'var(--bad)'; ws = null; setTimeout(connectWs, 4000); };
    } catch { /* headless */ }
  }

  boot();
})();
</script>
</body>
</html>
