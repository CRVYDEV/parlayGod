name: forge test (contracts)

# The pre-mainnet gate the sandboxed build environment can't run (Foundry's release binaries are
# egress-blocked there). GitHub's runners have open internet, so `forge test` — the OMERTÀ Solidity
# suite (unit + 512-run fuzz) — runs here on every push/PR that touches the contracts. Mirrors
# omerta-contracts/run-forge-test.sh: solc 0.8.26 (foundry.toml), OpenZeppelin v5.6.1, forge-std v1.9.6.

on:
  push:
    paths:
      - 'omerta-contracts/**'
      - '.github/workflows/forge.yml'
  pull_request:
    paths:
      - 'omerta-contracts/**'
      - '.github/workflows/forge.yml'
  workflow_dispatch: {}

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omerta-contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Deps aren't committed as submodules — clone them into lib/ at the pinned tags the contracts
      # target (deterministic, avoids forge-install/submodule friction inside the parent git repo).
      - name: Fetch dependencies
        run: |
          git clone --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - name: forge build
        run: forge build --sizes

      - name: forge test (unit + fuzz)
        run: forge test -vvv
