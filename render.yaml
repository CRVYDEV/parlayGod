# OMERTÀ — Render Blueprint. ONE file → the whole GAME stack: the API + the background worker + a Postgres DB.
#
# How to use (see DEPLOY-CHECKLIST.md for the click-by-click): push this repo to GitHub, then on Render pick
# "New +" → "Blueprint" → this repo. Render reads this file, creates all three pieces, GENERATES the secrets,
# and deploys. No terminal, no config typing.
#
# This brings the GAME live only. The blockchain layer stays DORMANT (there are deliberately NO CHAIN_* vars
# here) — you activate it later for mainnet by adding those vars to these same services (see CHAIN-DEPLOY.md).

databases:
  - name: omerta-db
    # THE FILE MUST MATCH THE DATABASE. This said `basic-256mb` while the live instance had been
    # upgraded to Pro-4gb with high availability switched on, and that mismatch is what broke the
    # blueprint sync for ~16 days:
    #
    #   databases[0].highAvailability.enabled
    #   High availability is only available for Pro instances and higher
    #
    # Render was not refusing HA. It was refusing HA *on the plan this file claimed*. The upgrade was
    # made in the dashboard and never written down here, so the declared state and the real state
    # drifted apart and reconciliation stopped dead.
    #
    # THE FAILURE WAS QUIET IN THE WAY THAT MATTERS. A blueprint sync and a service deploy are
    # different machines: deploys kept working and the site stayed current throughout, so the red
    # banner read as cosmetic. What silently stopped was every CHANGE TO THIS FILE reaching Render —
    # including `autoDeployTrigger: checksPass` below, the guard that stops a commit with failing CI
    # from reaching production. Sixteen days of that guard being written down and not in force.
    #
    # And while it was red it was also PROTECTIVE: a sync forced green with `basic-256mb` still
    # declared would have reconciled a live Pro database back down to basic. If you change the
    # instance type or the HA toggle in the dashboard again, change these two lines in the same
    # sitting — that is the whole lesson.
    plan: pro-4gb                # 4 GB RAM / 1 CPU / 15 GB storage. Was basic-256mb; upgraded Aug 2026.
    highAvailability:
      enabled: true              # a standby instance with automatic failover. Pro-and-above only, which
                                 # is exactly what the old `basic-256mb` line made illegal. Stated as the
                                 # nested object because that is the shape Render's own validator names
                                 # in the error above; the docs' `highAvailability: true` is shorthand.
                                 # Declared rather than omitted ON PURPOSE — a blueprint reconciles what
                                 # it declares, so staying silent here risks Render deciding the standby
                                 # you are paying for should be switched off.

envVarGroups:
  - name: omerta-secrets         # shared by BOTH processes so MARKET_SEED matches (the draws must agree)
    envVars:
      - key: JWT_SECRET
        generateValue: true      # signs player login tokens (Render makes a strong random value)
      - key: MARKET_SEED
        generateValue: true      # the secret seed behind Numbers/Track/Fight/goods price draws (§7.11)
      - key: MOD_KEY
        generateValue: true      # gates the /admin dashboard + mod tools — reveal it in the Render dashboard
      # ── ONE-CLICK "SIGN IN WITH X" (optional; the whole path is DORMANT until both are set) ──
      # Without these the entry screen offers the ghost door and a paste-a-token box for developers,
      # which is not something to put in front of a normal player. With them, players sign in with one
      # tap — and it is also what makes the "Follow OMERTÀ on X" First-Week task claimable at all, since
      # that check reads the player's own X identity and a guest hasn't got one.
      - key: X_CLIENT_ID
        sync: false              # OAuth 2.0 Client ID from developer.x.com → your App → Keys and tokens.
                                 # NOT the API Key: that is the older OAuth 1.0a pair and will not work.
      - key: X_CLIENT_SECRET
        sync: false              # ONLY if the X app is a CONFIDENTIAL client ("Web App, Automated App or
                                 # Bot"). For a Public client leave this UNSET — sending a secret an app
                                 # does not have, or omitting one it does, fails the token exchange with
                                 # an unhelpful error. Match it to the app type you picked.
      - key: PUBLIC_URL
        sync: false              # your real origin, e.g. https://omerta.example.com — no trailing slash.
                                 # The callback to register on the X app is EXACTLY this + the path:
                                 #   https://omerta.example.com/v1/auth/x/callback
                                 # X compares it byte-for-byte; a trailing slash or http:// is a mismatch.
      # ── MOBILE WALLETS (optional; the option is DORMANT until this is set) ──
      # Desktop players already get every browser wallet automatically (MetaMask, Coinbase, Trust,
      # Rabby, Phantom, Crypto.com, Rainbow, OKX, Zerion, Robinhood Wallet — the console discovers
      # whatever is installed, no per-wallet work). But a phone browser has NO wallet extension, so
      # without this a mobile player simply cannot link a wallet at all. Set it and they get a
      # "WalletConnect (mobile)" option that shows a QR (desktop) or opens their wallet app (phone).
      # Get one free in 2 minutes: https://dashboard.reown.com → sign in → Create Project → copy the
      # Project ID. It is PUBLIC by design (it ships in the page) — it is not a secret.
      - key: WALLETCONNECT_PROJECT_ID
        sync: false
      - key: INVARIANT_WEBHOOK_URL
        sync: false              # YOU paste this one: a Slack or Discord webhook URL. It is how the game
                                 # TELLS you something is wrong — the nightly §10.4 economy check and the
                                 # backup watchdog post to it. Leave it blank and those alarms have nowhere
                                 # to shout; you would only find out by reading logs. Discord: Server
                                 # Settings → Integrations → Webhooks → New Webhook → Copy URL.
                                 # It is in the SHARED group on purpose: the alarms run in the worker.
      - key: CITY_WIRE_WEBHOOK_URL
        sync: false              # OPTIONAL, marketing: a PUBLIC Discord channel webhook. THE CITY WIRE
                                 # posts the city's drama (kills, wars, monuments, prison breaks) there so
                                 # a community can watch — organic reach at ~zero cost. Public-safe (names +
                                 # the event, never a dollar figure), throttled. Keep it DISTINCT from the
                                 # private ops alarm above. Dormant if blank. Lives on the API (the streets
                                 # bus is there), so set it on the web service, not just the shared group.

services:
  # 1) the game server — serves the website (/), the admin dashboard (/admin), the wiki (/wiki), and the API
  - type: web
    name: omerta-api
    runtime: node
    plan: starter                # always-on (~$7/mo). The free tier SLEEPS when idle — bad for a live game.
    # ⚠ RUN EXACTLY ONE INSTANCE OF THIS SERVICE (numInstances is deliberately not declared — it
    # defaults to 1). This process holds per-process state that does not exist across boxes:
    #   · the in-process event bus (game.js `bus`) — streets/gang/me events fan out to the sockets
    #     THIS process holds; with two instances a player on box A never hears an event emitted on
    #     box B, silently and with nothing red anywhere
    #   · the `wsClients` presence registry — /v1/online, discovery/circle "online" chips, the
    #     push-skip signal all read it
    #   · the in-memory rate-limit buckets (unless REDIS_URL is set) — N instances = N× every limit
    #   · the /health request-metrics ring — per-instance numbers, harmless but misleading
    # Scaling OUT (vs upgrading the database, which is the measured dial below) needs REDIS_URL for
    # the rate limiter + a cross-process fanout for the bus. Until that exists, more instances make
    # the game WORSE, not faster. Scale the DATABASE plan instead (+50% per doubling — see below).
    buildCommand: npm ci --omit=dev   # honour the audited lockfile exactly (npm install may re-resolve),
                                      # and keep devDependencies (playwright-core) OUT of the prod image.
                                      # Optional deps (@resvg/resvg-js) still install, so PNG cards work.
    startCommand: npm start
    healthCheckPath: /             # Render pings this; the homepage returns 200 when the server is healthy
                                   # (NOT /v1/session — that requires a login and returns 401, failing the check)
    # BLUE-TEAM C1: wait for the GitHub CI checks to pass before deploying. Previously autoDeploy:true
    # shipped the instant a commit landed, RACING CI — so a red pgcheck (the job that catches the
    # prod-only class: the uuid=text outage, the roster boot crash-loop) blocked nothing. This makes
    # the deploy wait for green. A docs-only push (CI skipped via paths-ignore) has no checks and
    # deploys normally. Verify in the Render dashboard after sync: Settings → Auto-Deploy shows
    # "After CI Checks Pass"; if it still says "On Commit", flip it there.
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: omerta-secrets
      - key: NODE_ENV
        value: production
      - key: INVITE_MODE
        value: "off"              # LAUNCH (founder-directed 2026-08-12): the doors are OPEN — anyone
                                 # can create an account. `off` is also the code default, but a launch
                                 # posture resting on an unstated default is invisible: written here so
                                 # opening or closing the doors is a diff, not somebody's memory.
                                 # Set to "on" to go back to closed alpha (codes: POST /v1/mod/invites).
      - key: SOCIAL_VERIFY_MODE
        value: live               # REQUIRED in production or social/First-Week rewards pay nothing.
                                 # BUT `live` means "verify for real", and that needs a token to verify
                                 # WITH. On its own it pays nobody either — the faucet reports itself OFF
                                 # and the X First-Week task drops off the checklist. To switch
                                 # the word-of-mouth loop ON, add these to the omerta-secrets group:
                                 #   X_BEARER_TOKEN     — post checks (Spread the Word). The one that matters.
                                 #   X_TARGET_USER_ID   — + the "Follow on X" task
                                 # /admin's "Growth loop" panel says PAYING or NOT PAYING at a glance.
      - key: RATE_LIMIT
        value: "on"
      - key: TRUST_PROXY
        value: "on"               # Render sits behind a load balancer → per-IP throttles use the real client IP
      # The pool is a CLIFF, not a slope, and the default (20, src/db.js) sits on the wrong side of it.
      # Measured with `npm run loadtest` at 30 concurrent players against real Postgres:
      #     PG_POOL_MAX=20  →   30 req/s, p95 10.0s, NINE 503s   (10.0s is the connect timeout exactly:
      #                                                            requests queue for a connection, give up,
      #                                                            and the player is told the database is down)
      #     PG_POOL_MAX=60  →  284 req/s, p95  87ms, zero 5xx, zero pool failures
      # 3× the pool bought 9.4× the throughput because past the cliff it is queueing collapse, not a slope.
      # 40 is the declared value: comfortably clear of the cliff, and 40 (api) + 20 (worker) is far under
      # anything a pro-4gb instance limits.
      #
      # ── AND THE DATABASE IS THE SCALING DIAL, MEASURED PROPERLY (2026-08-12) ──────────────────────
      # That claim used to rest on a CONFOUNDED number: tools/loadtest.js boots the server IN-PROCESS
      # with its client loops, which is right for what it measures (contention, §10.4 under overlap)
      # and cannot say how much CPU the SERVER needed — "node ~1 core" included the clients. Re-measured
      # with the server and Postgres in separate cgroups at exactly the plans below (API 0.5 CPU =
      # `starter`, DB 1 CPU = `pro-4gb`), driven by an external client, read-dominated mix, 25 concurrent:
      #
      #     API 0.5 · DB 1   (what we run)   290 req/s   p95 205ms      —
      #     API 1.0 · DB 1   (web upgrade)   295 req/s   p95 201ms    +2%
      #     API 0.5 · DB 2   (db upgrade)    435 req/s   p95 123ms   +50%
      #
      # So: doubling the WEB plan's CPU buys ~2%, doubling the DATABASE's buys ~50%. Upgrade the database
      # first, and expect the web plan to buy you almost nothing until you have. (I went in expecting to
      # correct this line and the measurement corrected me instead — it is recorded because the cheap
      # version of this reasoning, "the app is on the small plan so upgrade the app", is wrong here.)
      #
      # WHAT THAT IS IN PLAYERS: a real console session was measured in a browser at 0.56 req/s IDLE and
      # 0.72 req/s while actively playing, so ~290 req/s is roughly 450-500 concurrent players before
      # latency starts climbing. Two caveats, both pushing the real number DOWN: that ran against a small
      # database (query cost grows with data) and with the rate limiter off.
      #
      # THE CHEAPEST CAPACITY WIN IS NOT A PLAN — and it has now been TAKEN (2026-08-16, asked for
      # directly: "what happens if we get 1000 users on the first day?"). An idle player used to cost
      # almost as much as a playing one because the 30s tick re-rendered the whole open screen, and
      # Home fans out EIGHTEEN board GETs in one Promise.all — on the screen a returning player LANDS
      # on. The poll was the load. Measured in a real browser (`npm run pollcost`, the harness written
      # for this question) and re-measured after:
      #
      #     idle player on Home   BEFORE 19 req/tick = 0.63 req/s   →  ~457 concurrent at 290 req/s
      #                           AFTER               0.18 req/s    →  ~1,580 concurrent
      #
      # The change is in public/index.html: the SHEET (one request — vitals, money, cooldowns, coach)
      # still refreshes every 30s; the BOARDS re-render every 4th tick. Nothing a player can SEE happen
      # got slower, because the websocket already re-renders the open board on every event and every
      # action re-renders through act(); what is delayed is only time-drift on a screen nobody touched.
      # 3.5x the player ceiling for no infrastructure spend, so the plans below are unchanged.
      #
      # If it needs to go further: the database is still the dial (+50% per doubling, above), and the
      # remaining client win is Home's fan-out itself — 18 boards is the widest in the game.
      - key: PG_POOL_MAX
        value: "40"
      - key: DATABASE_URL
        fromDatabase:
          name: omerta-db
          property: connectionString

  # 2) the background worker — the 12h buyback, the nightly §10.4 economy monitor, and every timed settlement.
  #    Run exactly ONE. The game works without it, but income/settlements/alerts stall — keep it running.
  - type: worker
    name: omerta-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev   # honour the audited lockfile (blue-team M5)
    startCommand: npm run worker
    autoDeployTrigger: checksPass      # wait for CI green before deploying (blue-team C1)
    envVars:
      - fromGroup: omerta-secrets
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omerta-db
          property: connectionString
